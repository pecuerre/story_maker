
- universe: Universe.dark
  name: "Jonas Key"
  item_tags: [ ItemTag.key ]
  slug: "jonas_key"
  description: |
    The small key Jonas carries through the cave.

    ## What it does

    Opens the padlocked grate at the cave mouth.

    ## How it is used

    Turned in the grate's lock, then kept out of sight.

    ## Origin

    Cut by the locksmith who fitted the grate.

    ## Constraints

    Fits the grate only, not the passage beyond it.

    ## History

    Carried by Jonas in 2019 and again in 1986.

    ## Jargon

    The key.

- universe: Universe.dark
  name: "Tannhaus Clockwork Device"
  item_tags: [ ItemTag.time_machine ]
  slug: "tannhaus_clockwork_device"
  photo: Photo.the_tannhaus
  description: |
    A clockmaker's apparatus that runs a cycle of time.

    ## What it does

    Carries a small area forward and back through the cycle.

    ## How it is used

    Wound and set to a date, then left to run.

    ## Side effects

    Everyone inside the cycle loses the years they passed through.

    ## Origin

    Built by H. G. Tannhaus in the workshop above the shop.

    ## Value

    Beyond any price the town could pay.

    ## Cannot

    Choose which cycle it opens.

    ## Constraints

    Only works while its mechanism is intact.

    ## Jargon

    The apparatus.

- universe: Universe.dark
  name: "St Christopher Medal"
  item_tags: [ ItemTag.medal ]
  slug: "st_christopher_medal"
  description: |
    A traveller's medal passed between the families.

    ## Origin

    Brought to Winden by a family that left before the first cycle.

    ## Value

    Worth little, and kept for what it remembers.

    ## History

    Changes hands between the Kahnwalds and the Nielsens.

    ## Jargon

    The medal.

- universe: Universe.dark
  name: "Sphere Machine"
  item_tags: [ ItemTag.time_machine ]
  slug: "sphere_machine"
  description: |
    A sphere-shaped machine built to move between cycles.

    ## What it does

    Opens a passage between two points in the cycle.

    ## How it is used

    Charged in the bunker and entered from within.

    ## Side effects

    The traveller arrives without the years they crossed.

    ## Origin

    Assembled from the Tannhaus apparatus and the bunker's equipment.

    ## Cannot

    Open a passage to a time it has not been tuned to.

    ## Constraints

    Needs the bunker's power to run.

    ## Jargon

    The sphere.

- universe: Universe.dark
  name: "The God Particle"
  item_tags: [ ItemTag.time_machine ]
  slug: "the_god_particle"
  description: |
    The unstable particle at the centre of the cycle.

    ## Origin

    Created by the accident at the nuclear plant.

    ## Cannot

    Be held or moved.

    ## Constraints

    Exists only inside the plant's containment.
