  # Spanish for the parts of Rails' own translations this application renders.
  #
  # Rails ships these strings in English only, and
  # `config.i18n.raise_on_missing_translations` is on in the test environment, so
  # a Spanish page that rendered a validation message or a duration would raise
  # rather than quietly fall back to English. That is the right failure, and it
  # is also what makes this block necessary rather than optional.
  #
  # Only the keys this application can actually reach are here, and
  # `TranslationsTest` checks that each one mirrors a key Rails really defines, so
  # this block cannot drift into translating something the framework never asks
  # for. The proper answer for a third language — or for a Rails version that
  # reaches a key not listed here — is the `rails-i18n` gem, which would replace
  # this block wholesale. It is deliberately not added: that is a dependency
  # change, and this subset is what the application currently needs.
  datetime:
    distance_in_words:
      half_a_minute: "medio minuto"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
      less_than_x_minutes:
        one: "menos de un minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "aproximadamente 1 hora"
        other: "aproximadamente %{count} horas"
      x_days:
        one: "1 día"
        other: "%{count} días"
      about_x_months:
        one: "aproximadamente 1 mes"
        other: "aproximadamente %{count} meses"
      x_months:
        one: "1 mes"
        other: "%{count} meses"
      about_x_years:
        one: "aproximadamente 1 año"
        other: "aproximadamente %{count} años"
      over_x_years:
        one: "más de 1 año"
        other: "más de %{count} años"
      almost_x_years:
        one: "casi 1 año"
        other: "casi %{count} años"
  # `errors.format` is the frame Rails puts a translated message in, and
  # `errors.messages` are the built-in validation messages. The application's own
  # `errors.add` messages are literals in the models, and are translated with
  # the models rather than here. The two refusals below are this application's
  # own, and live under the same `errors:` key as the Rails subset rather than in
  # a second `errors:` block: a repeated key in one YAML file silently replaces
  # the earlier one, which is how these two strings were being dropped entirely.
  errors:
    unavailable_account: "Esa página no está disponible para esta cuenta. Aquí tienes los universos que puedes abrir."
    rate_limited: "Inténtalo de nuevo más tarde."
    format: "%{attribute} %{message}"
    messages:
      model_invalid: "La validación falló: %{errors}"
      inclusion: "no está incluido en la lista"
      exclusion: "está reservado"
      invalid: "no es válido"
      confirmation: "no coincide con %{attribute}"
      accepted: "debe aceptarse"
      empty: "no puede estar vacío"
      blank: "no puede estar en blanco"
      present: "debe estar en blanco"
      # `belongs_to` produces this one, and Rails defines it in English only, so
      # without it a Spanish page that rejects a missing reference raises instead
      # of naming the field.
      required: "debe existir"
      too_long:
        one: "es demasiado largo (el máximo es 1 carácter)"
        other: "es demasiado largo (el máximo es %{count} caracteres)"
      password_too_long: "es demasiado larga"
      too_short:
        one: "es demasiado corto (el mínimo es 1 carácter)"
        other: "es demasiado corto (el mínimo es %{count} caracteres)"
      wrong_length:
        one: "no tiene la longitud correcta (debería tener 1 carácter)"
        other: "no tiene la longitud correcta (debería tener %{count} caracteres)"
      not_a_number: "no es un número"
      not_an_integer: "debe ser un número entero"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual que %{count}"
      equal_to: "debe ser igual a %{count}"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual que %{count}"
      other_than: "debe ser distinto de %{count}"
      in: "debe estar en %{count}"
      odd: "debe ser impar"
      even: "debe ser par"
      taken: "ya está en uso"
  # The connectors `to_sentence` uses, which the settings flash and the scene
  # filter summaries read.
  support:
    array:
      words_connector: ", "
      two_words_connector: " y "
      last_word_connector: " y "
