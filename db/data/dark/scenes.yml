# Several scenes share one section (Season 1 / Episode 1), several scenes stay
# ungrouped, and the remaining sections keep one scene each, so grouping and
# narrative order can be seen to be different things.
#
# The three stories each own their own flat scene sequence, and `position` is
# per Story: the second story starts again at 0 rather than continuing the first
# one's numbering, because narrative order is a property of a Story and nothing
# else.
- story: Story.netflix-dark
  name: Secrets
  slug: secrets
  description: "Jonas Kahnwald arrives in Winden and meets the Nielsen family."
  section: Section.s1e1
  event: Event.jonas_meets_bartosz
  scene_tags: [ SceneTag.mood, SceneTag.mystery ]
  datetime: "1986-09-01T10:00"
  position: 0

- story: Story.netflix-dark
  name: The Search in the Woods
  slug: the-search-in-the-woods
  description: "Jonas follows Hannah into the woods looking for Noah and finds the box in the hollow tree."
