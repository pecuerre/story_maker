# Explicit Character presence in a Dark Scene. A role is the author's own free
# text, so this file uses the words an author would actually write, and one link
# deliberately has none: participation without a role is a valid state.
#
# These links are separate from dialogue speakers. A character may appear in both
# lists, in which case the Characters tab shows one row labelled as both, and
# several characters here appear only as speakers and therefore have no row here.
#
# Presence belongs to a Scene, so the second and third stories keep their own
# rows while the Characters they point at are the same universe records.

# Jonas is a stored participant and also, in other scenes, a speaker.
- scene: Scene.secrets
  character: Character.jonas
  role: carries the box

# Martha opens the door in the dialogue above, so she is both here and a speaker.
- scene: Scene.secrets
  character: Character.martha
  role: opens the door

- scene: Scene.michaels-waltz
  character: Character.jonas
  role:

- scene: Scene.lies
  character: Character.martha
  role: lies

- scene: Scene.lies
  character: Character.hannah
  role: lies

# Ulrich is not linked here even though he speaks in the scene: a speaker is a
# participant without becoming a second stored row.
- scene: Scene.truths
  character: Character.jonas
  role: finds the cave

- scene: Scene.truths
  character: Character.martha
  role:

- scene: Scene.the-grotto
  character: Character.hannah
  role: gives birth

# "Netflix Darker". The same eight characters, a different set of scenes.
- scene: Scene.darker-hollow-tree
  character: Character.jonas
  role: opens the tree

# Bartosz speaks in this scene but is not a stored participant, which is the
# same derived-speaker state the first story exercises with Katharina.
- scene: Scene.darker-bartoszs-version
  character: Character.jonas
  role: memorizes it wrong

- scene: Scene.darker-bartoszs-version
  character: Character.bartosz
  role:

- scene: Scene.darker-second-grave
  character: Character.martha
  role: digs

- scene: Scene.darker-second-grave
  character: Character.hannah
  role: watches

- scene: Scene.darker-what-the-wind-remembers
  character: Character.claudia
  role: offers the log

- scene: Scene.darker-cold-open
  character: Character.bartosz
  role: not yet arrived

# "Bethesda Dark". Claudia is the player's guide in two of these scenes.
- scene: Scene.bethesda-arrival
  character: Character.claudia
  role: the stranger on the platform

- scene: Scene.bethesda-power-plant
  character: Character.claudia
  role: gives the tour

# Egon speaks in the bridge scene and is stored there too, so his row is both.
- scene: Scene.bethesda-wardens-bridge
  character: Character.egon
  role: blocks the bridge

- scene: Scene.bethesda-cave-mouth
  character: Character.bartosz
  role: already inside

# "Winden's Fair" is deliberately left with no participants and no items: a
# Scene may hold any number of presence links, including none, and the second
# story's fair is a different Scene entirely.