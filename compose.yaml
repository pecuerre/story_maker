services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

volumes:
  storage:
