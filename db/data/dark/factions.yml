- universe: Universe.dark
  name: Sic Mundus
  slug: sic-mundus
  summary: Preserve the loop and guide humanity toward its promised future.
  description: |
    ## Actual aims

    Break the knot and create a world without origin.

    ## Structure

    A secret order led by Adam, with members placed across time.

    ## Internal divisions

    Members disagree about what the promised world will cost.

    ## Resources

    Time travel, hidden facilities, and influence across generations.

    ## Would never

    Admit that its leader's certainty may be misplaced.

    ## Would absolutely

    Sacrifice the present to shape the origin.
  faction_tags: [ FactionTag.secretive, FactionTag.ideological ]

- universe: Universe.dark
  name: Erit Lux
  slug: erit-lux
  summary: Preserve the origin world and free humanity from the knot.
  description: |
    ## Actual aims

    Prevent Adam from erasing their world.

    ## Structure

    A covert movement led by Eva and her trusted agents.

    ## Internal divisions

    Some members question Eva's willingness to repeat the cycle.

    ## Resources

    A network across timelines and knowledge of the passage.

    ## Would never

    Accept Adam's single-world solution.

    ## Would absolutely

    Protect the world from which its members come.
  faction_tags: [ FactionTag.secretive, FactionTag.ideological ]
