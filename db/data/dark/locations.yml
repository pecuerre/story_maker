  description: |
    A private place where Jonas first tries to make sense of the cycles.

    ## Sensory

    - Sight: Posters, a crowded desk, and gray light through a single window.
    - Sound: Muffled voices from the kitchen and rain against the glass.

    ## Layout

    - Points of interest: The desk drawer where Jonas keeps the letter.

- universe: Universe.dark
  slug: winden_cave
  name: Winden Cave
  location_tags: [ LocationTag.cave ]
  parent: Location.winden
  summary: The cave above Winden where the passage opens, and where [[character:jonas]] learns what [[canon:K1]] costs.
  description: |
    The cave in the forest above Winden, where the passage opens and the cycle
    turns again.

    ## Sensory

    - Smell: Damp stone, wet earth, and a cold mineral smell.
    - Sound: Water dripping out of sight and the cave's long echo.

    ## History

    - Significant events: The passage to 1986 is found and used here. [[character:jonas]] learns what [[canon:K1]] means for every crossing.
    - Changes: Equipment and markings appear in the cave across different years.

    ## Control and access

    - Controlled by: The cave belongs to the forest, though only a few know the way in.
    - Security: A padlocked grate and a narrow entrance that is easy to miss.
    - Restrictions: The tunnels flood after heavy rain.

- universe: Universe.dark
  slug: winden_forest
  name: Winden Forest
  location_tags: [ LocationTag.forest ]
  parent: Location.winden
  summary: The pines above Winden, where the cave mouth hides in the rock.
  description: |
    The pines above Winden, where the cave mouth hides in the rock.

    ## Sensory

    - Sight: Dense pines, paths of wet needles, and the cave mouth hidden in the rock.
    - Smell: Resin, moss, and leaf mold.

    ## Control and access

    - Restrictions: The forest paths close after dark.

