  # Relaciones y Propiedades son los dos espacios de trabajo que usan el flujo de
  # redirección y rerenderizado en HTML en lugar de una mutación solo JSON, así
  # que son también los dos que establecen un mensaje flash. Sus bloques `flash`
  # son la confirmación de un registro guardado o eliminado; el tipo de registro
  # se escribe entero en lugar de interpolarse, porque «Relation created.» es una
  # frase sobre un registro y componerla a partir del nombre de la raíz le
  # devolvería el orden de las palabras al control de la locale.
  relations:
    title: "Relaciones"
    # El antetítulo es la tira de pestañas a la que pertenece este espacio de
    # trabajo, no la sección donde se archiva: se llega a Relaciones desde la
    # pestaña Personajes.
    eyebrow: "Personajes"
    description: "Conecta a los personajes y registra cómo cambian sus relaciones con el tiempo."
    new_title: "Nueva relación"
    add: "Añadir relación"
    save: "Guardar relación"
    form:
      # El nombre es opcional en ambos modelos: los dos personajes son la
      # etiqueta fiable, y la etiqueta de un registro y el slug compuesto solo
      # prefieren el nombre cuando hay uno.
      name: "Nombre"
      name_hint: "Opcional. Se usa como etiqueta en lugar de los dos personajes cuando está definido."
      description: "Descripción"
      tags_label: "Etiquetas de relaciones"
    character1: "Personaje 1"
    character2: "Personaje 2"
    select_character: "Selecciona un personaje"
    from: "Desde"
    to: "Hasta"
    empty_title: "Todavía no hay relaciones"
    empty_writable_description: "Conecta a dos personajes para describir su relación. Las etiquetas de relaciones son opcionales, pero pueden hacer estas conexiones más fáciles de leer."
    empty_read_only_description: "Las relaciones entre personajes de este universo aparecerán aquí en cuanto se hayan añadido."
    show:
      label: "Relación"
      back_label: "Todas las relaciones"
      facts:
        character1: "Primer personaje"
        character2: "Segundo personaje"
        tags: "Etiquetas de relaciones"
        tags_blank: "No hay etiquetas asignadas. Las etiquetas son opcionales."
        in_world_dates: "Fechas en el mundo"
        description: "Descripción"
        description_blank: "Todavía no hay descripción."
      related:
        title: "Información relacionada"
        empty_title: "Todavía no hay nada relacionado"
        empty_description: "Esta relación es un vínculo entre dos personajes. Todo lo demás que merezca la pena saber sobre ella se mostrará aquí más adelante."
    # El sujeto del resumen de errores. Es la frase que va detrás del «this» de la
    # oración, así que aquí no lleva artículo; la entrada española es una frase
    # entera porque su oración no aporta determinante.
    errors:
      subject: "esta relación"
      must_belong_to_universe: "debe pertenecer al universo de la relación"
    # Los dos extremos en una sola frase, para la confirmación de borrado de la
    # fila: la fila los dibuja a ambos lados de una flecha, pero la confirmación
    # tiene que nombrarlos en una frase. Ninguno de los dos nombres es chrome, así
