  # El espacio de trabajo de Escenas y las tres pestañas que la Escena posee. Este
  # bloque es dueño de la lista con ámbito de historia y su filtro, de los
  # detalles de la Escena con su lista de elementos, del único editor que
  # comparten `new` y `edit`, y de las pestañas Personajes, Objetos y Lugares.
  #
  # Tres de sus cadenas no se repiten aquí porque una sola casa ya las posee: la
  # tira de pestañas del espacio de trabajo nombra a sus hermanos con los títulos
  # de esos espacios de trabajo (`characters.title`, `items.title`,
  # `locations.title`), las etiquetas de recuento resuelven los sustantivos de tipo
  # de registro de la **raíz** con un `count:`, y «Cancelar»/«Cerrar» son el par
  # `shared.form`.
  scenes:
    title: "Escenas"
    add: "Añadir escena"
    # `new_*` y `edit_*` son planos y no bloques anidados, porque los títulos y las
    # descripciones de las páginas del editor son las cuatro cadenas que hay a su
    # lado y un bloque `new:` chocaría con la clave `new_title` de al lado.
    new_title: "Nueva escena"
    new_description: "Añade la siguiente escena a %{story}. Su posición es el orden en que se cuenta la historia, no la cronología en el mundo."
    # La pestaña del navegador nombra el registro que se está editando; la página
    # de abajo conserva su propio título «Editar escena», y el enlace al editor de
    # la página de detalles de la escena lleva ese mismo título.
    edit_title: "Editar escena"
    edit_document_title: "Editar %{name}"
    edit_description: "Actualiza el título, la descripción breve, el grupo de sección, el enlace al suceso y el tiempo en el mundo de esta escena. Su posición narrativa solo cambia mediante los controles Subir/Bajar de la lista de escenas."
    back_to_details: "Detalles de la escena"
    # Los controles de movimiento que muestran tanto la lista de Escenas como la
    # de elementos, y los títulos que dicen por qué uno está desactivado en un
    # límite de la secuencia. Los controles de elementos son una secuencia dentro de
    # una Escena y los de escenas son los de la propia Historia, y por eso cada uno
    # tiene su redacción en lugar de una frase compartida que sería incorrecta la
    # mitad de las veces.
    move:
      up: "Subir"
      down: "Bajar"
      already_first: "Ya está la primera en el orden narrativo"
      already_last: "Ya está la última en el orden narrativo"
      up_aria: "Subir %{name} en el orden narrativo"
      down_aria: "Bajar %{name} en el orden narrativo"
      element_already_first: "Ya está el primero en esta escena"
      element_already_last: "Ya está el último en esta escena"
      element_up_aria: "Subir %{name}"
      element_down_aria: "Bajar %{name}"
    index:
      description: "El orden de abajo es el orden en que se cuenta %{story}, no la cronología en el mundo. Un grupo de sección solo organiza una escena; nunca cambia este orden."
      # Dos estados vacíos, porque una historia sin escenas y un filtro que no
      # encontró nada son hechos distintos y solo a quien puede escribir se le dice
      # que cambie algo.
      empty_title: "Todavía no hay escenas"
      empty_writable_description: "Las escenas son las unidades ordenadas de esta historia. Añade la primera para empezar su orden narrativo."
      empty_read_only_description: "Esta historia todavía no tiene escenas que mostrar."
      no_match_title: "Ninguna escena coincide con estos filtros"
      no_match_description: "%{story} tiene %{total}, pero ninguna coincide con los filtros de arriba. Quítalos para ver todo el orden narrativo."
      # La confirmación de borrado de la fila. Una Escena posee sus elementos y
      # sus enlaces de presencia, así que aquí se declara la cascada en lugar de
      # recurrir a la confirmación corta `shared.row_actions.delete_confirm`; `name`
      # es el nombre propio del registro y se interpola en lugar de traducirse.
      delete_confirm: "¿Eliminar «%{name}»? Sus elementos, las asignaciones de etiquetas y los enlaces con registros de la historia y del universo se eliminarán de forma permanente. Los registros vinculados no se eliminarán."
      # Las dos píldoras de la fila que no son recuentos, y los dos títulos que
      # explican qué significa una píldora de agrupación.
      grouped_title: "Agrupada bajo %{grouping}. La agrupación no cambia el orden narrativo."
      ungrouped_title: "Sin agrupar bajo ninguna sección. La agrupación no cambia el orden narrativo."
      participants_title: "Personajes que participan en esta escena, tanto si son participantes almacenados como si solo hablan en un diálogo. Contados una sola vez."
      # `%{characters}` es un recuento resuelto con un `count:`, así que el plural
      # viene de la locale y esta frase sigue siendo una sola cláusula en los dos
      # idiomas.
      participants_aria: "%{characters} participando"
    filter:
      title: "Buscar escenas"
      description: "Una historia puede tener cientos o miles de escenas. Reduce la lista por texto, sección, etiqueta de escena o rango de fechas en el mundo. Filtrar nunca cambia el orden narrativo, y una escena sin tiempo en el mundo no pertenece a ningún rango de fechas."
      search_label: "Buscar"
      search_placeholder: "Título o descripción breve"
      section_label: "Sección"
      all_sections: "Todas las secciones"
      scene_tag_label: "Etiqueta de escena"
      all_scene_tags: "Todas las etiquetas de escenas"
      from_label: "En el mundo desde"
      to_label: "En el mundo hasta"
      submit: "Filtrar escenas"
      clear: "Quitar filtros"
      # La frase con la que abre una lista reducida. Los dos recuentos se resuelven
      # con un `count:` antes de interpolarse, así que cada uno elige su plural.
      showing: "Mostrando %{shown} de %{total}."
      filtered_by: "Filtrado por"
      # Los filtros activos repetidos como texto, para que un conjunto de resultados
      # vacío siempre pueda decir qué valor lo produjo.
      summaries:
        search: "Búsqueda: «%{value}»"
        section: "Sección: %{value}"
        scene_tag: "Etiqueta de escena: %{value}"
        from: "En el mundo desde %{value}"
        to: "En el mundo hasta %{value}"
      # Un valor de filtro que el filtro no pudo usar. `bound` es
      # `scenes.filter.bound.*` resuelto con la misma palabra que usa la etiqueta del
      # propio formulario, nunca el literal `start`/`end` con el que se construyó
