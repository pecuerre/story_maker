    ## Sensory

    - Sound: Church bells, rain on cobbles, and the low hum of the nuclear plant at night.
    - Smell: Wet asphalt, pine, and the faint metallic tang carried down from the plant.

- universe: Universe.dark
  name: Jonas House
  slug: jonas_house
  location_tags: [ LocationTag.house ]
  parent: Location.winden
  summary: The Kahnwald family home, with Jonas's room and the attic studio above it.
  description: |
    A narrow two-storey family house with a steep roof and a converted attic.

    ## Layout

    - Structure: A narrow two-storey family house with a steep roof and a converted attic.
    - Key areas: Kitchen, living room, hallway, Jonas's room, and the attic studio.
    - Pathways: A central hallway connects the front door to the kitchen and the stairs.
    - Entrances and exits: Front door under the porch, a back door into the garden, and the cellar hatch.

    ## History

    - Past occupants: The Kahnwald family across several versions of the cycle.

