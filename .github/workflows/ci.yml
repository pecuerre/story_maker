name: CI

# Every `uses:` below is pinned to a commit SHA with the release tag kept as a trailing comment.
# A major tag is a mutable name, so `actions/checkout@v6` can start pointing at different code
# without a commit here, and a job's permissions change silently. Dependabot's `github-actions`
# ecosystem updates the SHA and the comment together. Keep the comment: without it the SHA says
# nothing about which release it is.
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Ensure deployment secrets are not tracked
        run: |
          if git ls-files --error-unmatch -- .kamal/secrets >/dev/null 2>&1; then
            echo "::error::.kamal/secrets must remain untracked"
            exit 1
          fi

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      # The pinned Bun version, which is also the one in `mise.toml`, in `package.json`'s
      # `packageManager`, and in the Dockerfile. Keep the four in step: `bun audit` reads the
      # lockfile through the same Bun that wrote it, so a drift here would silently audit a
      # differently resolved graph.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Importmap Audit sees the packages `config/importmap.rb` names and nothing else. That is the
      # right check for a locally vendored asset, and it is not a check of the dependency graph:
      # everything under the direct dependencies in `bun.lock` was invisible to it.
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Audit the committed Bun lockfile
        run: |
          bun install --frozen-lockfile
          bun audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  js-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Lint the client-side code
        run: bun run lint:js

      - name: Run the client-side unit tests
        run: bun run test:js

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      # `CI: "1"` is what turns the coverage gate on. GitHub Actions sets `CI`
      # itself, but it is set here too because a run that silently lost the gate
      # would still be green, which is the failure this is guarding against.
      - name: Run tests
        env:
          RAILS_ENV: test
          SKIP_BUN_INSTALL: 1
          CI: "1"
          # SQLite permits one writer at a time. Two processes keep the full suite parallel
          # without exhausting its busy timeout on a hosted runner.
          PARALLEL_WORKERS: 2
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test
      - name: Check development data manifests
        env:
          RAILS_ENV: test
        run: |
          UNIVERSE=dark bin/rails db:demo:check
          UNIVERSE=lotr bin/rails db:demo:check

      # The report is generated but never committed (`tmp/` is git-ignored), so
      # this is the only place the HTML is readable. It is uploaded on failure as
      # well as on success, because a run that tripped the gate is exactly the one
      # where the missing lines matter.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage
          path: tmp/coverage
          if-no-files-found: error
          retention-days: 14

  migrations-from-zero:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      # One `bin/rails` process per command, deliberately. `db:drop` unlinks the
      # SQLite file while the boot connection still points at it, so a single
      # `bin/rails db:drop db:create db:migrate` migrates that deleted inode,
      # leaves the recreated database empty, and the next process reports
      # "Schema migrations table does not exist yet".
      #
      # `schema_migrations` is created before migrating, and that is the part
      # that makes this job mean what its name says. On a database without that
      # table Rails 8.1's `DatabaseTasks.initialize_database` loads
      # `db/schema.rb` instead of executing the migrations and records every
      # version as applied — so `db:migrate:status` would report all 36 `up` and
      # `git diff --exit-code db/schema.rb` would compare the dump against
      # itself. Creating the table first makes Rails treat the database as
      # initialized, so the migration files actually run.
      - name: Migrate an empty test database from zero
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:drop
          bin/rails db:create
          bin/rails runner 'ActiveRecord::Base.connection_pool.schema_migration.create_table'
          bin/rails db:migrate

      - name: Prove the migrations ran rather than the schema being loaded
        env:
          RAILS_ENV: test
        # `schema_sha1` is written only by `DatabaseTasks.load_schema`. If it is
        # present, the step above migrated nothing, and both `db:migrate:status`
        # and `git diff --exit-code db/schema.rb` would be comparing the dump
        # against itself. This is the check that stops this job from quietly
        # becoming a no-op if a Rails upgrade changes that behaviour.
        run: |
          bin/rails runner '
            metadata = ActiveRecord::Base.connection_pool.internal_metadata
            abort "::error::the migrated database has no ar_internal_metadata table" unless metadata.table_exists?
            abort "::error::db/schema.rb was loaded instead of the migrations being executed" if metadata[:schema_sha1]
          '

      - name: Verify every migration is up
        env:
          RAILS_ENV: test
        run: bin/rails db:migrate:status

      - name: Verify the checked-in schema matches the migrations
        run: git diff --exit-code db/schema.rb

  system-test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verify the installed Chrome and ChromeDriver
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          "$CHROME_PATH" --version
          "$CHROMEDRIVER_PATH" --version
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      # No `CI: "1"` here, deliberately. The browser suite is a smoke suite whose
      # coverage total is not comparable with the request suite's, so it writes its
      # own report and sets no threshold
      # (`test/application_system_test_case.rb`).
      - name: Run System Tests
        env:
          RAILS_ENV: test
          SKIP_BUN_INSTALL: 1
          # Browser processes still share test infrastructure, so serialize this smoke suite.
          PARALLEL_WORKERS: 1
          SE_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          SE_CHROME_NO_SANDBOX: "1"
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Known quirk 36: a green test job was not evidence that the deployed runtime
  # boots. This job builds the production image and starts it, so a Dockerfile,
  # asset-pipeline, or production-environment change that only breaks at boot
  # fails here instead of on the server.
  #
  # It boots the container the way the entrypoint does and asks the one endpoint
  # that proves a working application: `/up`. The environment variables below are
  # throwaway values for a container nobody talks to. `SECRET_KEY_BASE` is
  # generated per run and `APP_HOST` is a name that resolves nowhere -- neither is
  # a credential, and no real key, host, or mailer address is in this repository.
  production-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain `docker build`, deliberately: no cache mount, no BuildKit secret, no
      # registry login. The job proves the checked-in Dockerfile works from a clean
      # checkout; anything that made the build depend on state outside this
      # repository would defeat that.
      - name: Build the production image
        run: docker build --tag universe_maker:ci .

      # The image is built from the checked-in Dockerfile, so this inspects what a deploy would
      # actually receive. Two things are checked: that the pruning in the Dockerfile really happened,
      # and that the assets which can only be resolved while `node_modules` still exists were
      # digested into `public/assets` before it was removed. The second half is the one that would
      # otherwise fail as a missing stylesheet font in production rather than here.
      - name: Verify the image carries no test or build artifacts
        run: |
          docker run --rm --user root --entrypoint sh universe_maker:ci -c '
            for path in /rails/node_modules /rails/.git; do
              if [ -e "$path" ]; then
                echo "::error::$path is present in the production image"
                exit 1
              fi
            done

            for gem in capybara selenium-webdriver simplecov brakeman rubocop-rails-omakase bundler-audit debug web-console; do
              if ls -d /usr/local/bundle/ruby/*/gems/${gem}-* >/dev/null 2>&1; then
                echo "::error::${gem} is installed in the production bundle"
                exit 1
              fi
            done

            for asset in "public/assets/application-*.css" "public/assets/bootstrap.bundle.min-*.js" "public/assets/fonts/bootstrap-icons-*.woff2"; do
              if ! ls /rails/${asset} >/dev/null 2>&1; then
                echo "::error::${asset} is missing from the precompiled assets"
                exit 1
              fi
            done

            echo "no test or build artifacts, and the node_modules-derived assets were precompiled"
          '

      - name: Boot the container and check /up
        env:
          APP_HOST: ci.universe-maker.invalid
          MAILER_FROM: no-reply@ci.universe-maker.invalid
          SMTP_ADDRESS: smtp.universe-maker.invalid
        run: |
          # Generated per run rather than read from a secret: this container serves
          # nothing and throws its database away when the job ends. `openssl` rather
          # than `ruby`, so the job needs no Ruby on the runner outside the image.
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"

          docker run --detach --name universe_maker_ci \
            --publish 127.0.0.1:8080:80 \
            --env APP_HOST \
            --env MAILER_FROM \
            --env SMTP_ADDRESS \
            --env SECRET_KEY_BASE \
            universe_maker:ci

          # The entrypoint runs `db:prepare` before the server starts, so the
          # first request is also the proof that the production schema, the Solid
          # Cache/Queue/Cable databases, and the precompiled assets all came up.
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: ci.universe-maker.invalid' http://127.0.0.1:8080/up || true)
            if [ "$status" = "200" ]; then
              echo "the application answered /up with 200"
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' universe_maker_ci | grep -q true; then
              echo "::error::the container exited before answering /up"
              docker logs universe_maker_ci
              exit 1
            fi
            sleep 2
          done

          echo "::error::the application did not answer /up within 120 seconds"
          docker logs universe_maker_ci
          exit 1

      # Both failure paths above already print the container's logs, so this step
      # only cleans up.
      - name: Remove the container
        if: always()
        run: docker rm --force universe_maker_ci || true
