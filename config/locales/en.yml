  # The field labels the modal editors are built from.
  #
  # `ModalFields` serializes these descriptors into the taxonomy tree's
  # `data-taxonomy-tree-modal-fields-value`, so a label here is the string the
  # DOM-built modal prints, and the same helpers feed the server-rendered modals.
  # The descriptors themselves hold a *key* rather than a translated string —
  # `PHOTO_FIELD` is a frozen constant, and a constant that called `t()` would be
  # resolved once, in whatever locale loaded the class first — so these are
  # resolved per request by `ModalFields#modal_field`.
  modal_fields:
    name: "Name"
    description: "Description"
    background_color: "Background color"
    foreground_color: "Foreground color"
    parent: "Parent"
    no_parent: "(No parent)"
    taggable: "Taggable"
