  shared:
    count:
      with_count: "%{count} %{label}"
    # El ámbito que anuncia la cabecera de una página. El árbol de Secciones, la
    # lista de Escenas y las dos taxonomías de historia declaran los mismos dos
    # ámbitos, así que son un par de claves y no una copia por superficie.
    eyebrow:
      story: "Historia: %{story}"
      scene: "Escena: %{scene}"
    # La píldora de posición narrativa, anunciada por la lista de Escenas, por la
    # lista de escenas de una Sección y por la sección «Aparece en escenas». La
    # forma larga nombra el total de la Historia junto a la posición; la corta se
    # usa donde la lista ya se sabe que es un subconjunto de una Escena.
    scene_position_aria: "Posición narrativa %{position} de %{total}"
    scene_position_aria_short: "Posición narrativa %{position}"
    detail_fact:
      blank: "Sin definir todavía."
    in_world_range:
      empty: "Sin fechas todavía."
      from: "Desde el %{date}"
      until: "Hasta el %{date}"
    record_details_link:
      text: "Detalles"
      aria: "Detalles de %{name}"
    record_photo:
      alt: "Foto de %{name}"
    error_summary:
      # `count` se pluraliza con la clave: un error se lee de otra forma que
      # muchos. `subject` es la frase que va detrás del «this» de la oración. En
      # español la oración no aporta determinante, así que la frase lo trae
      # entero: un sustantivo suelto necesitaría un artículo que la clave no
      # puede conocer.
      heading:
        one: "Un error impidió guardar %{subject}:"
        other: "%{count} errores impidieron guardar %{subject}:"
    # Los mensajes de validación que lanzan las cuatro Tuberías de Interés
    # Compartidas, para que un espacio de trabajo no repita una regla que su
    # propio modelo hereda. Cada uno es la cola de `errors.format`
    # ("%{attribute} %{message}"), así que todos empiezan en minúscula.
    #
    # Las dos tuberías que comprueban un ámbito — el `parent` de `Hierarchical` y
    # las filas de asignación de `HasManyTags` — dicen lo mismo sobre un dueño
    # distinto, así que el ámbito es su propia oración y no un marco con la
    # palabra del ámbito cosida dentro: un idioma que contrae o concuerda su
    # determinante con el sustantivo no puede recibir un marco. Es la misma
    # decisión que toma `tags.show.scope_universe_description` a su lado.
    errors:
      same_scope:
        # El determinante concuerda con el sustantivo, y el español lo lleva
        # delante: no es un marco con «el mismo» pegado al final.
        universe: "debe pertenecer al mismo universo"
        story: "debe pertenecer a la misma historia"
      hierarchy:
        scope_change_with_children: "no se puede cambiar mientras existan registros hijos"
        cannot_be_itself: "no puede ser él mismo"
        cannot_be_descendant: "no puede ser un descendiente"
      tagged_records:
        scope_change_with_tags: "no se puede cambiar mientras existan registros etiquetados"
      color:
        must_be_hex: "debe ser un color hexadecimal como #d3d3d3"
      photo:
        needs_universe_record: "necesita un registro que pertenezca a un universo"
        must_be_attached: "debe estar adjunto"
    flash:
      close: "Cerrar"
    photo_field:
      default_label: "Foto"
      # Las cadenas que lee el propio controlador del editor de fotos. El editor
      # se construye entero en el navegador, así que cada palabra que muestra es
      # una de estas; el widget es una sola implementación compartida por los
      # tres patrones de página, así que una lista sirve para los tres en lugar
      # de tres copias.
      hint: "Una foto siempre es cuadrada. Elige una imagen y muévela dentro del cuadrado para decidir qué conservar."
      remove: "Quitar la foto actual"
      stage_aria: "Área de recorte de la foto. Las flechas mueven la imagen, y más y menos la amplían."
      zoom: "Ampliar"
      zoom_aria: "Ampliar la foto"
      accept: "Usar esta foto"
      move_group_aria: "Mover la foto dentro del cuadrado"
      move_left: "Mover a la izquierda"
      move_up: "Mover arriba"
      move_down: "Mover abajo"
      move_right: "Mover a la derecha"
      reading: "Leyendo la foto…"
      unreadable: "Ese archivo no se pudo leer como una imagen. Prueba con un JPEG, PNG, WebP o GIF."
      # `action` es la **propia clave del botón** interpolada en la oración que
      # le indica al autor que lo pulse, por la misma razón que una oración con
      # un enlace lleva el enlace: quien traduce, al decidir dónde colocar la
      # referencia, sigue necesitando saber cómo se llama el control, y el
      # nombre del control es una clave propia porque el botón también la
      # imprime.
      ready: "Cuadrado listo. Mueve la foto y elige %{action}."
      chosen: "Foto elegida. Guarda el formulario para conservarla."
      discarded: "Foto descartada."
      removing: "La foto se quitará cuando guardes."
    # Las dos oraciones con las que ambos editores imprimen un mensaje de error
    # del servidor. Son marcos, no texto propio: `subject` y `label` llegan ya
    # resueltos, y un idioma que necesite un determinante lo lleva en el sujeto
    # (véase `record_subject.*` y `shared.taxonomy_tree.record_subject`). Las dos
    # se leen igual en ambos idiomas porque todas sus palabras vienen de otro
    # sitio, que es justo lo que las hace claves en lugar del inglés que los
    # controladores armaban antes.
    record_error: "%{subject} %{message}"
    record_message: "%{label} %{message}"
    # La línea de estado y los mensajes de error propios del modal de lista. Un
    # espacio de nombres para los marcos que comparten los dos editores, y otro
    # para los mensajes que solo muestra este: quien guarda un personaje y
    # mueve una escena está leyendo el mismo editor y espera las mismas
    # palabras.
    modal_form:
      saving: "Guardando…"
      saved_refresh: "Guardado. Actualizando la lista…"
      save_failed: "No se pudo guardar el cambio."
      unsent: "No se pudo enviar el cambio. Comprueba tu conexión e inténtalo de nuevo."
      deleting: "Eliminando…"
      deleted_refresh: "Eliminado. Actualizando la lista…"
      delete_failed: "No se pudo eliminar el registro."
      delete_unsent: "No se pudo eliminar el registro: la petición no se pudo enviar. Comprueba tu conexión e inténtalo de nuevo."
      gone_refresh: "Ese registro ya no existe. Actualizando la lista…"
      # «up»/«down» son los valores que lleva el atributo
      # `data-modal-form-direction`, así que nunca se traducen; las dos oraciones
      # que los mencionan son dos claves y no un marco con una palabra pegada,
      # porque un idioma que ordene el adverbio de otra forma tendría que
      # reescribir el marco para colocarlo.
      moving_up: "Subiendo…"
      moving_down: "Bajando…"
      moved_refresh: "Movido. Actualizando la lista…"
      move_failed: "No se pudo mover la fila."
      move_unsent: "No se pudo mover la fila: la petición no se pudo enviar. Comprueba tu conexión e inténtalo de nuevo."
      gone_row_refresh: "Esa fila ya no existe. Actualizando la lista…"
      unexplained: "El servidor rechazó el cambio pero no explicó por qué. No se guardó nada."
      fix_and_retry: "No se pudo guardar el cambio. Corrige lo siguiente e inténtalo de nuevo."
      # Los tres rechazos que puede contestar el contrato de mutación, añadidos a
      # la oración del propio editor para que quien lee sepa qué falló y por qué.
      forbidden: "Ya no tienes permiso para hacer eso; recarga la página e inicia sesión de nuevo."
      rejected: "El servidor rechazó el valor."
      server_error: "El servidor no pudo completar la petición. No se cambió nada; inténtalo de nuevo."
      http_status: "(HTTP %{status})"
    # La opción en blanco que limpia una referencia opcional. Tanto las tres
    # referencias temporales del formulario de Sucesos como el enlace al suceso del
    # formulario de Escena leen esta clave, así que la palabra tiene una sola casa.
    none: "Ninguno"
    include_descendants_toggle:
      label: "Incluir registros de las etiquetas hijas"
    child_tags:
      empty_title: "No hay etiquetas hijas"
      empty_description: "Esta etiqueta de grupo todavía no tiene etiquetas hijas."
      unused_description: "Todavía no se usa esta etiqueta hija."
    detail_section:
      # `label` es una clave de tipo de registro resuelta con `count: 1`, así que
      # la frase se lee «Ningún personaje lleva esta etiqueta». La ranura recibe un
      # nombre **singular**, porque en ninguno de los dos idiomas un plural cabe
      # detrás de este verbo.
      #
      # `determiner` es una segunda interpolación porque un idioma que concuerda en
      # género no puede deducir «una sección» a partir de la palabra `sección` ni
      # más que deducir su plural. Quien llama declara el determinante de su tipo de
      # registro junto al nombre, igual que declara el nombre; los dos valores
      # ingleses son iguales porque el inglés no tiene esa concordancia.
      empty_title: "%{determiner} %{label} lleva esta etiqueta"
      determiners:
        none_masculine: "Ningún"
        none_feminine: "Ninguna"
    menu_tag_content_tabs:
      aria_label: "Espacio de trabajo de %{type}"
    tag_workspace_navigation:
      scope_aria_label: "Ámbito de las etiquetas"
      story_aria_label: "Espacio de trabajo de etiquetas de historia"
      universe_aria_label: "Espacio de trabajo de etiquetas del universo"
    taxonomy_tree:
      hint: "Usa el menú de la fila para añadir una hija, insertar antes o después, subir o bajar, editar y eliminar. También puedes renombrar en línea haciendo clic en el propio nombre. Arrastra las filas cuando quieras reordenarlas visualmente; soltar cerca del principio o del final anida una fila como hija."
      empty_description: "Crea el primero para empezar a construir esta jerarquía."
      read_only_empty_description: "Todavía no hay nada que mostrar aquí."
      # Las cadenas que lee el propio controlador del árbol. El árbol dibuja las
      # filas del servidor, pero su fila de creación y renombrado en línea, su
      # modal de edición y su línea de estado se construyen en el navegador, así
      # que esas palabras están aquí y no en la parcial.
      new_name: "Nombre nuevo"
      save: "Guardar"
      save_changes: "Guardar los cambios"
      edit_title: "Editar %{name}"
      # El texto oculto que un campo obligatorio lleva junto a su asterisco
      # visible. El asterisco no es clave: es una marca tipográfica que dibuja la
      # hoja de estilos, no una palabra, y es la misma marca en todos los idiomas.
      required: " (obligatorio)"
      delete_confirm: "¿Eliminar %{name} y sus elementos hijos?"
      insert_at: "Insertar un elemento en la posición %{position}"
      # El sujeto de un error de registro, para un árbol que edita ocho
      # taxonomías distintas y por tanto no puede nombrar ninguna en concreto.
      # Es la misma palabra genérica que ya usa su propia línea de estado («The
      # item could not be created.»), así que a quien lee no le dicen «el
      # elemento» en un mensaje y «esta entrada» en el siguiente.
      record_subject: "el elemento"
      create_failed: "No se pudo crear el elemento."
      rename_failed: "No se pudo guardar el nombre."
      update_failed: "No se pudieron guardar los cambios."
      delete_failed: "No se pudo eliminar el elemento."
      move_failed: "No se pudo mover el elemento."
      network_failed: "La petición de red falló. Inténtalo de nuevo."
      invalid_response: "El servidor devolvió una respuesta no válida."
      saved_refresh: "Guardado. Actualizando la taxonomía…"
    taxonomy_node:
      rename: "Renombrar %{name}"
      add_child: "Añadir hija"
      insert_before: "Insertar antes"
      insert_after: "Insertar después"
      move_up: "Subir"
      move_down: "Bajar"
    row_actions:
      actions_for: "Acciones para %{name}"
      edit: "Editar"
      delete: "Eliminar"
      edit_title: "Editar %{label}"
      delete_confirm: "¿Eliminar %{name}?"
    # Las dos cadenas que comparten todos los formularios y todos los modales de la
    # aplicación: el botón que abandona una edición y el botón de icono que cierra
    # un modal. Son una clave cada una en lugar de una por espacio de trabajo,
    # porque quien lee «Cancelar» en el formulario del universo y «Cancelar» en el
    # de Personajes ha leído dos veces la misma palabra y espera que sea una.
    form:
      cancel: "Cancelar"
      close: "Cerrar"

