# Scene Elements for the Lord of the Rings universe: the ordered prose blocks of
# each Scene. Narration describes what happens, a dialogue is written as ordered
# turns that each name their speaker, and positions are flat and contiguous inside
# their own Scene.
#
# Every Scene of this story has at least one element, so the list is exercised in
# both the populated and the partly-written state: two narration blocks carry no
# content yet, and "Three is Company" has a single dialogue.

- scene: Scene.a-long-expected-party
  name: The Party Field
  kind: narration
  body: "Food on every table, fireworks over the water, and one old man at the gate who will not come in out of the rain."
  position: 0

- scene: Scene.a-long-expected-party
  name: "A ring on the table"
  manifest_key: lotr-party-dialogue
  kind: dialogue
  body: "It is hot. It is. I wish it were not. All the things I wish, and it is hot."
  position: 1

- scene: Scene.the-shadow-of-the-past
  name: "You should not go"
  kind: dialogue
  body: "The road is dangerous for you, and I cannot stop you from taking it. That is the whole of what I know."
  position: 0

- scene: Scene.three-is-company
  name: "A pony, a cart, two hobbits"
  kind: dialogue
  body: "I will not go. I said I would, and now I have said it twice, which is once more than I mean to."
  position: 0

# A title-only element: the Scene exists and the block is still a blank page.
- scene: Scene.a-long-walk-in-the-dark
  name: "The first night out"
  kind: narration
  position: 0

- scene: Scene.the-council-of-elrond
  name: Rivendell
  kind: narration
  body: "The house is lit from inside, and the water is loud, and no one comes to the door."
  position: 0

# Four speakers in one block, each line attributed to the Character who says it.
- scene: Scene.the-council-of-elrond
  name: "The ring goes to a hobbit"
  kind: dialogue
  body: "I will take it. All of it. Set a bearer, the council says, and no one looks at the hobbit."
  position: 1

- scene: Scene.the-council-of-elrond
  name: "What they swore"
  kind: narration
  position: 2
