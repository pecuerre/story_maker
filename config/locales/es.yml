      move_failed: "No se ha podido mover la escena."
      already_first: "Esta escena ya está la primera en el orden narrativo."
      already_last: "Esta escena ya está la última en el orden narrativo."
      grouped: "«%{name}» ahora está agrupada bajo %{grouping}. Su posición narrativa no ha cambiado."
      ungrouped: "«%{name}» ahora está sin agrupar. Su posición narrativa no ha cambiado."
    # El sujeto del resumen de errores. Es la frase que va detrás del «this» de la
    # oración, así que aquí no lleva artículo; la entrada española es una frase
    # entera porque su oración no aporta determinante.
    #
    # Los mensajes de `errors.add` de abajo se leen como la cola de `errors.format`
    # («%{attribute} %{message}»), así que cada uno empieza en minúscula. Son
    # mensajes propios del modelo Scene y viven junto al sujeto en lugar de en un
    # bloque compartido, igual que `events.errors` pertenece al espacio de trabajo
    # de Sucesos.
    errors:
      subject: "esta escena"
      must_exist: "no puede existir"
      must_belong_to_story: "debe pertenecer a la misma historia"
      must_belong_to_universe: "debe pertenecer al universo de la historia"
      must_be_unique: "no puede estar repetido"
      invalid_datetime: "no es una fecha y una hora válidas"
    # Los tres enlaces de presencia y la lista de hablantes del Elemento. Sus dos
    # reglas de ámbito son un par de claves para los cuatro modelos porque la
    # oración es la misma la diga el enlace que la diga: los modelos de presencia
    # la añaden al atributo del registro enlazado y el Elemento a
    # `:character_ids`, pero al lector se le dice el mismo hecho.
    participation_errors:
      already_in_scene: "ya está en esta escena"
      must_belong_to_scene_universe: "debe pertenecer al universo de la escena"
    # Las dos reglas que el propio `kind` de un diálogo tiene que cumplir.
    # `narration` es la `label` del tipo, no su valor `kind`, así que se
    # interpola: la oración nombra el tipo que el lector eligió en el selector, y
    # un idioma que no lo llame «Narración» recibe igualmente una oración sobre el
    # tipo que eligió.
    element_errors:
      speakers_required: "es obligatorio para un elemento de diálogo"
      narration_with_speakers: "no puede ser %{narration} mientras todavía haya hablantes asignados"

  # Los espacios de trabajo de la Biblia del universo: Personajes, Lugares,
  # Sucesos, Objetos, Relaciones y Propiedades. Cada bloque es dueño de su
  # página de lista, del editor modal que esa lista abre y de la página de
  # detalles del registro, de modo que un espacio de trabajo y sus traducciones
  # viven juntos.
  #
  # Dos de sus cadenas no se repiten aquí. El antetítulo «Biblia del universo» es
  # el encabezado de sección de la barra lateral izquierda y se lee de
  # `sidebar.*`, la misma elección que hace `universes.show` con sus enlaces
  # rápidos. Los nombres de los tipos de registro con los que se anuncian los
  # recuentos viven en la raíz de este archivo, y la tira de pestañas que un
  # espacio de trabajo comparte con su hermano lee las pestañas de ese hermano.
  characters:
    title: "Personajes"
    description: "Personas y seres cuyos detalles comparten todas las historias de este universo."
    tabs_aria_label: "Espacio de trabajo de personajes"
    new_title: "Nuevo personaje"
    add: "Añadir personaje"
    save: "Guardar personaje"
    # El modal se construye con `form_with scope:`, que no tiene modelo del que
    # leer `human_attribute_name`, así que aquí se nombran las etiquetas del propio
    # modal. La entrada de `activerecord.attributes` para la misma columna es lo
    # que lee un mensaje de error, y se espera que las dos digan lo mismo.
    form:
      name: "Nombre"
      description: "Descripción"
      tags_label: "Etiquetas de personajes"
    empty_title: "Todavía no hay personajes"
    # La lista tiene dos estados vacíos porque tiene dos audiencias, igual que
    # las listas de universos e historias: a quien puede escribir se le dice que
    # añada el primer registro, y a un visitante o a un miembro de solo lectura se
    # le dice que los registros pertenecen al universo.
    empty_writable_description: "Los personajes pertenecen al universo y los comparten todas sus historias. Añade el primero para empezar."
    empty_read_only_description: "Los personajes pertenecen al universo y los comparten todas sus historias."
    # Un personaje tiene dependientes, así que su borrado declara su propia cascada.
    # La frase exacta la impone el ADR 0007 y no debe debilitarse aquí; `name` es el
    # nombre del propio registro de la persona autora, así que se interpola en lugar
    # de traducirse.
    delete_confirm: "¿Eliminar «%{name}»? Sus personajes descendientes, relaciones, propiedades, asignaciones de etiquetas y enlaces a escenas se eliminarán de forma permanente. Las escenas y otros registros del universo permanecerán."
    show:
      label: "Personaje"
      back_label: "Todos los personajes"
      facts:
        universe: "Universo"
        tags: "Etiquetas de personajes"
        tags_blank: "No hay etiquetas asignadas. Las etiquetas son opcionales."
        description: "Descripción"
        description_blank: "Todavía no hay descripción."
    tabs:
      characters: "Personajes"
      relations: "Relaciones"

  locations:
    title: "Lugares"
    description: "Construye una jerarquía de lugares y regiones que comparten todas las historias de este universo."
    tabs_aria_label: "Espacio de trabajo de lugares"
    new_label: "Añadir lugar"
    # Lugares es un árbol de taxonomías, así que no tiene un título vacío propio:
    # el árbol nombra la taxonomía con `taxonomies.<model_param>.none_yet`. Estas
    # dos descripciones van bajo ese título, y la segunda es la de solo lectura.
    empty_description: "Añade un lugar y luego arrastra las filas para crear lugares padres e hijos."
    read_only_empty_description: "Todavía no se ha añadido ningún lugar."
    # Un lugar tiene dependientes, así que cada nodo del árbol lleva su propia cascada
    # como el `confirm_message` que el árbol de taxonomías compartido serializa. La
    # misma frase que impone el ADR 0007 que usan las listas de personajes y objetos.
    delete_confirm: "¿Eliminar «%{name}»? Sus lugares descendientes, asignaciones de etiquetas y enlaces a escenas se eliminarán de forma permanente. Las escenas y otros registros del universo permanecerán."
    show:
      label: "Lugar"
      back_label: "Todos los lugares"
      facts:
        universe: "Universo"
        tags: "Etiquetas de lugares"
        tags_blank: "No hay etiquetas asignadas. Las etiquetas son opcionales."
        parent: "Lugar padre"
        parent_blank: "Este lugar está en el nivel superior."
        children: "Lugares hijos"
        children_blank: "Todavía no hay lugares anidados."
        description: "Descripción"
        description_blank: "Todavía no hay descripción."
    tabs:
      locations: "Lugares"

  events:
    title: "Sucesos"
    description: "Registra momentos que dan forma al universo y aportan la estructura de su cronología."
    tabs_aria_label: "Espacio de trabajo de sucesos"
    new_title: "Nuevo suceso"
    add: "Añadir suceso"
    save: "Guardar suceso"
    empty_title: "Todavía no hay sucesos"
    empty_writable_description: "Añade sucesos con fechas o relaciones entre ellos y abre después la Cronología para ver cómo se conectan."
    empty_read_only_description: "Los sucesos de este universo aparecerán aquí en cuanto se hayan añadido."
    # Un suceso tiene dependientes, así que su borrado declara su propia cascada con las
    # mismas palabras que impone el ADR 0007 para las listas de personajes, objetos y
    # lugares. `name` es `Event#display_label`, es decir la etiqueta del propio suceso
    # resuelta en el idioma del lector, así que se interpola en lugar de traducirse.
    delete_confirm: "¿Eliminar «%{name}»? Sus sucesos hijos, las asignaciones de etiquetas y cualquier referente temporal que quedara sin identificar se eliminarán de forma permanente; las demás referencias temporales y los enlaces a escenas se vaciarán. Las escenas permanecerán."
    form:
      title: "Título"
      description: "Descripción"
      tags_label: "Etiquetas de sucesos"
      hint: "Un suceso necesita al menos un título, una fecha de inicio o de fin, o una relación con otro suceso de abajo."
      start_datetime: "Fecha/hora de inicio"
      end_datetime: "Fecha/hora de fin"
      # Las tres referencias temporales y la opción en blanco que limpia una. Los
      # valores son identificadores de suceso, así que solo se traducen las
      # etiquetas que los acompañan.
      before_event: "Ocurre antes"
      after_event: "Ocurre después"
      simultaneous_event: "Al mismo tiempo que"
    show:
      label: "Suceso"
      back_label: "Todos los sucesos"
      facts:
        # El título no tiene estado vacío. El valor es
        # `title.presence || display_label`, y `display_label` siempre responde
        # con algo —en el peor caso, «Suceso n.º 12»—, así que una copia en blanco
        # aquí nunca se renderizaría y solo sería una clave que nadie lee.
        title: "Título"
        universe: "Universo"
        tags: "Etiquetas de sucesos"
        tags_blank: "No hay etiquetas asignadas. Las etiquetas son opcionales."
        in_world_time: "Tiempo en el mundo"
        description: "Descripción"
        description_blank: "Todavía no hay descripción."
    # Los mensajes de `errors.add` se leen como la cola de `errors.format`
    # («%{attribute} %{message}»), así que cada uno empieza en minúscula.
    errors:
      must_belong_to_universe: "debe pertenecer al universo del suceso"
      cannot_be_itself: "no puede ser él mismo"
      must_be_identifiable: "debe tener un título, una fecha o una relación con otro suceso"
    # La etiqueta propia de un suceso en el idioma del lector.
    # `Event#display_label` resuelve estas claves; `Event#display_string` es la
    # misma escalera resuelta en el idioma por defecto, porque esa es la cadena
    # que guarda un documento del índice y un solo índice sirve a todos los
    # lectores. `event` es la etiqueta de un suceso referenciado, así que ya es
    # una frase en el idioma del lector y se interpola entera.
    display_label:
      unidentified: "Suceso n.º %{id}"
      before: "antes de %{event}"
      after: "después de %{event}"
      simultaneous: "al mismo tiempo que %{event}"
    tabs:
      events: "Sucesos"

