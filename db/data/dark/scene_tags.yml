# Scene Tags belong to a Story, so each story in this directory carries its own
# vocabulary. `netflix-darker` tags scenes by how they read and `bethesda-dark`
# by how the player meets them, so the same Universe Bible produces three
# different scene taxonomies rather than one repeated.

- story: Story.netflix-dark
  name: Mood
  slug: mood
  bgcolor: "#6c8ebf"
  fgcolor: "#ffffff" # white
  position: 0

- story: Story.netflix-dark
  name: Mystery
  slug: mystery
  parent: SceneTag.mood
  position: 0

- story: Story.netflix-dark
  name: Turning point
  slug: turning-point
  bgcolor: "#c96b6b"
  fgcolor: "#000000" # black
  position: 1

- story: Story.netflix-dark
  name: Revelation
  slug: revelation
  parent: SceneTag.turning-point
  position: 0

