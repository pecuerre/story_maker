      speaks_in: "Habla en %{count}"
      # El único aviso que comparten los tres campos de rol, y cada pestaña aporta
      # sus propios ejemplos: la frase se escribe una vez y los ejemplos se
      # interpolan, porque los ejemplos también son chrome y cada pestaña sugiere
      # otros distintos.
      role_hint: "Opcional, con tus propias palabras: %{examples} Déjalo en blanco si no quieres decir nada. La aplicación no interpreta nada de esto."
      # El nombre accesible del menú de la fila. Nombra el registro *y* la escena
