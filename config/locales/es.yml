      position_note_html: "La posición narrativa de esta escena solo se establece con los controles %{move_up}/%{move_down} de la %{scenes_list}. Es el orden en que se cuenta la historia, no la cronología en el mundo."
      scenes_list_link: "lista de escenas"
      submit_create: "Crear escena"
      submit_update: "Actualizar escena"
    # La sección de elementos de los detalles de la escena. Las etiquetas de tipo
    # son los valores que el selector almacena, así que el `kind` nunca se traduce:
    # solo se traduce la etiqueta que va al lado, y tanto la lista que renderiza el
    # servidor como el modal leen estas claves.
    elements:
      title: "Elementos de la escena"
      add: "Añadir elemento"
      edit: "Editar elemento"
      position_aria: "Elemento %{position} de %{total}"
      empty_title: "Todavía no hay elementos"
      empty_description: "Una escena puede tener cualquier número de elementos, incluido ninguno. Un bloque de narración describe lo que ocurre; un bloque de diálogo nombra a los personajes que hablan en él."
      no_content: "Todavía no hay contenido. Un título es todo lo que un elemento necesita."
      delete_confirm: "¿Eliminar «%{name}»? Su contenido y sus enlaces con los hablantes se eliminarán de forma permanente. Los personajes y otros registros del universo no se eliminarán."
      # La frase que la fila de un diálogo declara sobre sus enlaces con
      # hablantes. `names` son los nombres de hablantes escritos por la persona
      # autora unidos por el conector de la locale, así que se interpola; la
      # separación one/other es la concordancia del verbo con la cuenta.
      speaker_note:
        one: "%{names} habla en este bloque. El enlace registra quién está en la conversación, no qué línea es de quién."
        other: "%{names} hablan en este bloque. El enlace registra quién está en la conversación, no qué línea es de quién."
      speaker_note_empty: "Un diálogo debe nombrar al menos un hablante."
