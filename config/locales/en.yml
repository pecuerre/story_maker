# Every user-facing string in the application chrome. Keys are grouped by the
# surface that owns the string, not by a flat global list, so a page and its
# translations live together and a surface can be moved without renumbering the
# rest. See ADR 0016.
#
# Author-entered data is not here and must never be added: record names,
# descriptions, tag names, and universe or story names are data, and a
# translation layer that rewrote them would be corrupting the author's work.
en:
  app:
    name: "Universe Maker"

  # The application layout: the document shell, the top bar's own strings, and
  # the access notice the workspace shows a read-only member or a guest.
  layouts:
    skip_to_content: "Skip to main content"
    primary_navigation: "Primary navigation"
    toggle_navigation: "Toggle navigation"
    workspace_navigation: "Workspace navigation"
    close_navigation: "Close navigation"
    close_tools: "Close tools"
    universe_tools: "Universe tools"
    menu: "Menu"
    tools: "Tools"
    account: "Account"
    log_in: "Log in"
    log_out: "Log out"
    settings: "Settings"
    read_only: "read-only"
    scope:
      universe: "Universe:"
      story: "Story:"
    # The two access notices contain markup — a `strong` and a link — so they
    # are `_html` keys and are rendered with the `html_safe` helper.
    read_only_notice_html: "You have %{emphasis} access to this universe."
    guest_notice_html: "You are viewing this public universe as a guest. %{login_link} to contribute."

  # The left column: the universe/story navigation.
  sidebar:
    current_universe: "Current universe"
    current_story: "Current story"
    none_selected: "None selected"
    navigation_label: "Universe and story navigation"
    universe_bible: "Universe Bible"
    story_workspace: "Story workspace"
    story_overview: "Story overview"
    characters: "Characters"
    locations: "Locations"
    events: "Events"
    timeline: "Timeline"
    items: "Items"
    sections: "Sections"
    scenes: "Scenes"
    all_stories: "All stories"
    select_story_hint: "Select a story to work on its sections and story-specific structure."
    # The right column: universe configuration and the reserved tool areas.
    tools:
      navigation_label: "Universe configuration and tools"
      eyebrow: "Universe tools"
      intro: "Additional collaboration, analytics, and AI tools will live here."
      configuration: "Configuration"
      tags: "Tags"
      members: "Members"
      collaboration: "Collaboration"
      collaborators: "Collaborators"
      conflicts: "Conflicts"
      branches: "Branches"
      forks: "Forks"
      analytics: "Analytics"
      insights: "Insights"
      reports: "Reports"
      ai: "AI"
      assistant: "Assistant"

  # The access level a reader has in a universe, as a details page states it.
  universe_access:
    admin: "Admin"
    contributor: "Contributor"
    read_only: "Read-only"
    none: "No access"
    public_read_only: "Public read-only"

  # Partials shared by every workspace.
  shared:
    count:
      # A count and the record type it counts. `label` is already the pluralized
      # record type, resolved by `ApplicationHelper#count_with_label`.
      with_count: "%{count} %{label}"
    # The scope a page's header announces above its title. The Sections tree, the
    # Scenes list, and the two story taxonomies state the same two scopes, so
    # they are one pair of keys rather than one copy per surface.
    eyebrow:
      story: "Story: %{story}"
      scene: "Scene: %{scene}"
    # The narrative-position badge, announced by the Scenes list, a Section's own
    # scene list, and the "Appears in scenes" section. The long form names the
    # Story's total beside the position; the short form is used where the list is
    # already known to be one Scene's subset.
    scene_position_aria: "Narrative position %{position} of %{total}"
    scene_position_aria_short: "Narrative position %{position}"
    detail_fact:
      blank: "Not set yet."
    in_world_range:
      empty: "No dates set yet."
      from: "From %{date}"
      until: "Until %{date}"
    record_details_link:
      text: "Details"
      aria: "Details for %{name}"
    record_photo:
      alt: "Photo of %{name}"
    error_summary:
      # `count` is pluralized by the key: one error reads differently from many.
      # `subject` is the phrase that follows the sentence's own "this", so it
      # carries no article of its own in English. A locale whose sentence has no
      # determiner to supply one — Spanish — passes a full phrase instead, because
      # a bare noun there would need an article the key cannot know.
      heading:
        one: "1 error prevented this %{subject} from being saved:"
        other: "%{count} errors prevented this %{subject} from being saved:"
    flash:
      close: "Close"
    photo_field:
      default_label: "Photo"
      # The strings the photo editor's own controller reads. The editor is built
      # entirely in the browser, so every word it shows is one of these; the
      # widget is one implementation shared by all three page patterns, so one
      # list serves all three rather than three copies.
      hint: "A photo is always square. Choose an image, then move it inside the square to choose what to keep."
      remove: "Remove the current photo"
      stage_aria: "Photo crop area. Arrow keys move the image, plus and minus zoom it."
      zoom: "Zoom"
      zoom_aria: "Zoom the photo"
      accept: "Use this photo"
      move_group_aria: "Move the photo inside the square"
      move_left: "Move left"
      move_up: "Move up"
      move_down: "Move down"
      move_right: "Move right"
      reading: "Reading the photo…"
      unreadable: "That file could not be read as an image. Try a JPEG, PNG, WebP, or GIF."
      # `action` is the **button's own key** interpolated into the sentence that
      # tells the author to press it, for the same reason a sentence carrying a
      # link carries the link: a translator deciding where the reference sits
      # still needs to know what the control is called, and the control's name is
      # a key in its own right because the button prints it too.
      ready: "Square ready. Move the photo, then choose %{action}."
      chosen: "Photo chosen. Save the form to keep it."
      discarded: "Photo discarded."
      removing: "The photo will be removed when you save."
    # The two sentences both editors use to print a server error message. They
    # are frames, not copy: `subject` and `label` arrive already resolved, and a
    # locale that needs a determiner puts it in the subject (see
    # `record_subject.*` and `shared.taxonomy_tree.record_subject`). Both read
    # identically in the two locales because every word in them comes from
    # elsewhere — which is the point of making them keys rather than the English
    # the controllers used to assemble.
    record_error: "%{subject} %{message}"
    record_message: "%{label} %{message}"
    # The flat-list modal's own status line and error copy. One namespace for
    # both editors' shared frames, and one for the messages only this editor
    # shows, because a reader who saves a character and moves a scene is reading
    # the same editor and expects its words to be the same words.
    modal_form:
      saving: "Saving…"
      saved_refresh: "Saved. Refreshing the list…"
      save_failed: "The change could not be saved."
      unsent: "The change could not be sent. Check your connection and try again."
      deleting: "Deleting…"
      deleted_refresh: "Deleted. Refreshing the list…"
      delete_failed: "The record could not be deleted."
      delete_unsent: "The record could not be deleted: the request could not be sent. Check your connection and try again."
      gone_refresh: "That record no longer exists. Refreshing the list…"
      # "up"/"down" are the values a `data-modal-form-direction` attribute
      # carries, so they are never translated; the two sentences that mention
      # them are two keys rather than one frame with a spliced word, because a
      # locale that orders the adverb differently would have to rewrite the
      # frame to place it.
      moving_up: "Moving up…"
      moving_down: "Moving down…"
      moved_refresh: "Moved. Refreshing the list…"
      move_failed: "The row could not be moved."
      move_unsent: "The row could not be moved: the request could not be sent. Check your connection and try again."
      gone_row_refresh: "That row no longer exists. Refreshing the list…"
      unexplained: "The server rejected the change but did not explain why. Nothing was saved."
      fix_and_retry: "The change could not be saved. Fix the following and try again."
      # The three refusals the mutation contract can answer with, appended to the
      # caller's own sentence so the reader is told both what failed and why.
      forbidden: "You are no longer allowed to do that; reload the page and sign in again."
      rejected: "The server rejected the value."
      server_error: "The server could not complete the request. Nothing was changed; try again."
      http_status: "(HTTP %{status})"
    # The blank option that clears an optional reference. Both the Events form's
    # three temporal references and the Scene form's event link read it, so the
    # word has one home rather than one per form.
    none: "None"
    include_descendants_toggle:
      label: "Include records from child tags"
    child_tags:
      empty_title: "No child tags"
      empty_description: "This grouping tag has no child tags yet."
      unused_description: "Nothing uses this child tag yet."
    detail_section:
      # `label` is a record-type key resolved with `count: 1`, so the sentence
      # reads "No character carries this tag" and not "No character carry…" — the
      # slot takes a **singular** noun, because a plural cannot follow this verb
      # in either language.
      #
      # `determiner` is a second interpolation because a language that agrees in
      # gender cannot derive "una sección" from the word `sección` any more than it
      # can derive the plural from it. The caller states its record type's
      # determiner beside the noun, the same way it states the noun; the two
      # English values are identical because English has no such agreement.
      empty_title: "%{determiner} %{label} carries this tag"
      determiners:
        none_masculine: "No"
        none_feminine: "No"
    menu_tag_content_tabs:
      aria_label: "%{type} workspace"
    tag_workspace_navigation:
      scope_aria_label: "Tag scope"
      story_aria_label: "Story tag workspace"
      universe_aria_label: "Universe tag workspace"
    taxonomy_tree:
      hint: "Use the row menu for Add child, Insert before/after, Move up/Move down, Edit, and Delete. Inline rename is available by clicking the name itself. Drag rows when you want a visual reorder; dropping near the top or bottom nests a row as a child."
      empty_description: "Create the first one to start building this hierarchy."
      read_only_empty_description: "There is nothing here to show yet."
      # The strings the tree's own controller reads. The tree renders the
      # server-side rows, but its inline create and rename rows, its editor
      # modal, and its status line are built in the browser, so those words are
      # here rather than in the partial.
      new_name: "New name"
      save: "Save"
      save_changes: "Save changes"
      edit_title: "Edit %{name}"
      # The hidden text a required field carries beside its visible asterisk. The
      # asterisk itself is not a key: it is a typographic marker the stylesheet
      # draws, not a word, and it is the same mark in every language.
      required: " (required)"
      delete_confirm: "Delete %{name} and its children?"
      insert_at: "Insert item at position %{position}"
      # The subject of a record-level error, for a tree that edits eight
      # different taxonomies and therefore cannot name one of them. It is the
      # same generic word the tree's own status line already uses ("The item
      # could not be created."), so a reader is not told "the item" by one
      # message and "this entry" by the next one.
      record_subject: "the item"
      create_failed: "The item could not be created."
      rename_failed: "The name could not be saved."
      update_failed: "The changes could not be saved."
      delete_failed: "The item could not be deleted."
      move_failed: "The item could not be moved."
      network_failed: "The network request failed. Please try again."
      invalid_response: "The server returned an invalid response."
      saved_refresh: "Saved. Refreshing the taxonomy…"
    taxonomy_node:
      rename: "Rename %{name}"
      add_child: "Add child"
      insert_before: "Insert before"
      insert_after: "Insert after"
      move_up: "Move up"
      move_down: "Move down"
    row_actions:
      actions_for: "Actions for %{name}"
      edit: "Edit"
      delete: "Delete"
      edit_title: "Edit %{label}"
      delete_confirm: "Delete %{name}?"
    # The two strings every form and every modal in the application shares: the
    # button that abandons an edit, and the icon button that closes a modal. They
    # are one key each rather than one per workspace, because a reader who reads
    # "Cancel" on the universe form and "Cancel" on the Characters form has read
    # the same word twice and expects it to be one word.
    form:
      cancel: "Cancel"
      close: "Close"

  # The universes workspace: the list of worlds, one universe's own page, and
  # the create/edit forms it shares with the stories workspace.
  #
  # The button labels and the page titles are the same string, so one key serves
  # both the `content_for :title` and the `h1` — a reader who follows "New
  # universe" expects the page it opens to be called that too.
  universes:
    title: "Universes"
    description: "Choose a world to work in. Each universe contains its own stories and shared world-building records."
    new: "New universe"
    new_description: "Create a world that will contain its own stories and shared world-building records."
    edit: "Edit universe"
    # The browser tab names the record being edited; the page below it keeps the
    # workspace's own "Edit universe" title.
    edit_document_title: "Edit %{name}"
    edit_description: "Update the name used to identify this universe."
    open: "Open universe"
    manage_members: "Manage members"
    delete: "Delete universe"
    delete_confirm: "Delete %{name} and all of its content?"
    columns:
      universe: "Universe"
      visibility: "Visibility"
      actions: "Actions"
    visibility:
      private: "Private"
      public: "Public"
    empty:
      # The list has two empty states because it has two audiences: someone who
      # can create a universe is told to create one, and a guest is told to wait.
      owner_title: "Create your first universe"
      owner_description: "A universe holds the world, characters, locations, events, and items shared by its stories."
      guest_title: "No public universes yet"
      guest_description: "Sign in to create a universe, or check back when a public universe is available."
    form:
      name: "Name"
      slug: "Address slug"
      slug_hint: "Leave this blank to build the address from the name."
      slug_hint_current: "Leave this blank to keep /u/%{slug}. A new name rebuilds the address from the name."
      private: "Private universe"
      private_hint: "Public universes can be read by guests and contributed to by signed-in users. Private universes are visible only to their members."
      # The default submit label comes from Rails' own `helpers.submit.*`, which
      # is English only, so the label is named here rather than inherited.
      submit_create: "Create Universe"
      submit_update: "Update Universe"
    show:
      eyebrow: "Universe"
      description: "The shared world and story collection for this workspace."
      new_story: "New story"
      actions_aria: "Universe actions"
      stories_eyebrow: "Stories"
      current_badge: "Current"
      open_story: "Open"
      open_story_aria: "Open %{name}"
      empty_title: "No stories yet"
      empty_writable_description: "A story holds the plot, sections, and scenes of this universe while sharing its world. Create the first one from the New story action above."
      empty_read_only_description: "This universe has no stories to show yet."
      # The four quick links and the eyebrow are the sidebar's own navigation
      # labels, so they are read from `sidebar.*` rather than repeated here.
      bible_heading: "Shared world"
      bible_description: "Characters, places, events, items, and their relationships live at universe scope."
    # The JSON-shaped detail partial still renders a labelled value.
    detail:
      name: "Name:"
    flash:
      created: "Universe was successfully created."
      updated: "Universe was successfully updated."
      deleted: "Universe was successfully deleted."

  # The stories workspace, which shares the universe's own page as its picker.
  stories:
    title: "Stories"
    description: "Each story owns its plot and sections while sharing the characters, locations, events, and items in this universe."
    new: "New story"
    new_description: "Create a story with its own plot and section structure inside this universe."
    edit: "Edit story"
    edit_document_title: "Edit %{name}"
    edit_description: "Update the name and description used for this story."
    open: "Open story"
    delete: "Delete story"
    delete_confirm: "Delete “%{name}”? Its sections, section tags, scene tags, scenes, scene elements, and story-owned links will be permanently deleted. Shared universe records will not be deleted."
    current_badge: "Current"
    no_description: "No description yet."
    empty_title: "No stories yet"
    empty_writable_description: "A story holds the plot and sections of this universe, while its world-building records remain shared across stories."
    empty_read_only_description: "Stories in this universe will appear here once they have been added."
    form:
      name: "Name"
      description: "Description"
      submit_create: "Create Story"
      submit_update: "Update Story"
    show:
      default_description: "Plan the plot and structure for this story."
      open_sections: "Open sections"
      open_scenes: "Open scenes"
      actions_aria: "Story actions"
      structure_eyebrow: "Story structure"
      structure_description: "Organize this story into a hierarchy such as acts, chapters, books, or seasons, and write it as an ordered sequence of scenes."
      manage_sections: "Manage sections"
      view_sections: "View sections"
      manage_scenes: "Manage scenes"
      view_scenes: "View scenes"
      bible_eyebrow: "Shared Universe Bible"
      bible_heading: "World-building records"
      # The sentence is written per language rather than assembled around the
      # universe's name: "Shared by every story in X" cannot become Spanish by
      # substituting the name into a fixed frame.
      bible_description: "Every story in %{universe} shares these records."
    flash:
      created: "Story was successfully created."
      updated: "Story was successfully updated."
      deleted: "Story was successfully deleted."

  # Granting and changing a universe's access.
  memberships:
    index:
      title: "Members"
      description: "Grant read, write, or admin access to this universe. The owner always has admin access."
      back: "Back to universe"
      columns:
        member: "Member"
        access: "Access"
        actions: "Actions"
      grant_eyebrow: "Grant access"
      grant_title: "Add a member"
      grant_description: "The user must already have an account. In a public universe every signed-in user can contribute; an admin membership also grants control over members and universe settings."
      owner: "Owner"
      you: "You"
      save: "Save"
      remove: "Remove"
      remove_confirm: "Remove %{name} from this universe?"
      access_level_aria: "Access level for %{name}"
    new:
      title: "Add member"
      description: "Grant a user access to this universe."
    form:
      email_address: "Email address"
      access_level: "Access level"
      choose_level: "Choose a level"
      submit: "Grant access"
    # The three levels the form offers. Their *values* are the `read`/`write`/
    # `admin` strings that travel in a form field and are stored on the record,
    # so only the label beside them is translated.
    access_levels:
      read: "Read"
      write: "Write"
      admin: "Admin"
    # What a membership is called in the error summary's sentence, where the
    # record being saved has no name. It is the phrase that follows the sentence's
    # own "this", so it carries no article of its own here — the Spanish entry is
    # a full phrase because its sentence has no determiner to supply one.
    subject: "access grant"
    # `errors.add` messages read as the tail of `errors.format`
    # ("%{attribute} %{message}"), so each starts lowercase.
    errors:
      email_not_found: "could not be found"
      email_is_owner: "is the universe owner and already has admin access"
      invalid_access_level: "is not a valid access level"
    flash:
      granted: "Member access was successfully granted."
      updated: "Member access was successfully updated."
      removed: "Member access was successfully removed."
      own_change_refused: "You cannot change your own membership."
      own_removal_refused: "You cannot remove your own membership."

  # The Sections tree and a Section's own details page. The tree itself is the
  # shared taxonomy partial; these are the words this workspace passes to it.
  #
  # Its story-scope eyebrow and the narrative-position badge on its scene list are
  # `shared.eyebrow.story` and `shared.scene_position_aria`, because the Scenes
  # workspace states the same two facts.
  sections:
    # The one group a Section selector offers that is not a Section. It is built
    # by `SectionPaths`, which is shared with the Scenes workspace, so both read
    # it from here; the `ungrouped` **value** that travels in a URL is the
    # `SceneFilter::UNGROUPED` string and is never translated.
    ungrouped_label: "Ungrouped"
    index:
      title: "Sections"
      description: "Organize this story into a hierarchy of books, chapters, acts, scenes, or any structure you need."
      new_label: "Add section"
      empty_description: "Add a section, then drag rows to create the outline for this story."
      read_only_empty_description: "This story has no sections to show yet."
      delete_confirm: "Delete “%{name}”? Its child sections and tag assignments will be removed, and linked scenes will become ungrouped. Their narrative order will not change."
    show:
      label: "Section"
      back_label: "All sections"
      facts:
        story: "Story"
        path: "Section path"
        tags: "Section tags"
        tags_blank: "No tags assigned. Tags are optional."
        description: "Description"
        description_blank: "No description yet."
      scenes:
        title: "Scenes in this section"
        empty_title: "No scenes in this section"
        empty_description: "A section only groups scenes; it never sets their order. Scenes assigned to it will be listed here in the order the story is told."
      related:
        title: "Related information"
        empty_title: "Nothing related yet"
        empty_description: "Anything else worth knowing about this section will be listed here later."

  # The Scenes workspace and the three Scene-owned tabs. This block owns the
  # story-scoped list and its filter, Scene Details with its Element list, the one
  # editor both `new` and `edit` share, and the Characters, Items, and Locations
  # tabs.
  #
  # Three of its strings are not repeated here because one home already owns
  # them: the workspace tab strip names its siblings with the workspaces' own
  # titles (`characters.title`, `items.title`, `locations.title`), the count
  # labels resolve the **root** record-type nouns with a `count:`, and
  # `Cancel`/`Close` are the `shared.form` pair.
  scenes:
    title: "Scenes"
    add: "Add scene"
    # `new_*` and `edit_*` are flat rather than nested blocks, because the editor's
    # own page titles and descriptions are the four strings beside them and a
    # `new:` block would collide with the `new_title` key beside it.
    new_title: "New scene"
    new_description: "Add the next scene to %{story}. Its position is the order in which the story is told, not in-world chronology."
    # The browser tab names the record being edited; the page below it keeps the
    # workspace's own "Edit scene" title, and the Scene Details page's editor link
    # carries that same title.
    edit_title: "Edit scene"
    edit_document_title: "Edit %{name}"
    edit_description: "Update the title, short description, Section group, event link, and in-world time of this scene. Its narrative position changes only through the Move up/Move down controls on the scenes list."
    back_to_details: "Scene details"
    # The move controls the Scenes list and the Element list both show, and the
    # titles that say why one is disabled at a sequence boundary. The Element
    # controls are a Sequence inside one Scene and the Scene controls are the
    # Story's own, which is why each has its own wording rather than one shared
    # sentence that would be wrong half the time.
    move:
      up: "Move up"
      down: "Move down"
      already_first: "Already first in the narrative order"
      already_last: "Already last in the narrative order"
      up_aria: "Move %{name} up in the narrative order"
      down_aria: "Move %{name} down in the narrative order"
      element_already_first: "Already first in this scene"
      element_already_last: "Already last in this scene"
      element_up_aria: "Move %{name} up"
      element_down_aria: "Move %{name} down"
    index:
      description: "The order below is the order %{story} is told, not in-world chronology. A section group only organizes a scene; it never changes this order."
      # Two empty states, because a story without scenes and a filter that matched
      # nothing are different facts and only a writer is told to change either.
      empty_title: "No scenes yet"
      empty_writable_description: "Scenes are the ordered units of this story. Add the first one to start its narrative order."
      empty_read_only_description: "This story has no scenes to show yet."
      no_match_title: "No scenes match these filters"
      no_match_description: "%{story} has %{total}, but none of them match the filters above. Clear them to see the whole narrative order."
      # The row's own delete confirmation. A Scene owns its Elements and its
      # presence links, so the cascade is stated here rather than falling back to
      # the short `shared.row_actions.delete_confirm`; `name` is the author's own
      # record name and is interpolated rather than translated.
      delete_confirm: "Delete “%{name}”? Its elements, tag assignments, and links to story and universe records will be permanently removed. Linked records will not be deleted."
      # The two row badges that are not counts, and the two titles that explain
      # what a grouping badge means.
      grouped_title: "Grouped under %{grouping}. Grouping does not change the narrative order."
      ungrouped_title: "Not grouped under a section. Grouping does not change the narrative order."
      participants_title: "Characters that take part in this scene, whether they are stored participants or only speakers in a dialogue. Counted once."
      # `%{characters}` is a count resolved with a `count:`, so the plural comes
      # from the locale and this sentence stays one clause in both languages.
      participants_aria: "%{characters} taking part"
    filter:
      title: "Find scenes"
      description: "A story can hold hundreds or thousands of scenes. Narrow the list by text, section, scene tag, or in-world date range. Filtering never changes the narrative order, and a scene without an in-world time is not in a date range."
      search_label: "Search"
      search_placeholder: "Title or short description"
      section_label: "Section"
      all_sections: "All sections"
      scene_tag_label: "Scene tag"
      all_scene_tags: "All scene tags"
      from_label: "In-world from"
      to_label: "In-world to"
      submit: "Filter scenes"
      clear: "Clear filters"
      # The sentence a narrowed list opens with. Both counts are resolved with a
      # `count:` before they are interpolated, so each chooses its own plural.
      showing: "Showing %{shown} of %{total}."
      filtered_by: "Filtered by"
      # The active filters repeated as text, so an empty result set can always say
      # which value produced it.
      summaries:
        search: "Search: “%{value}”"
        section: "Section: %{value}"
        scene_tag: "Scene tag: %{value}"
        from: "In-world from %{value}"
        to: "In-world to %{value}"
      # A filter value the filter could not use. `bound` is `scenes.filter.bound.*`
      # resolved with the same word the form's own label uses, never the literal
      # `start`/`end` this object was constructed with.
      bound:
        start: "start"
        end: "end"
      discarded:
        section: "The section filter was ignored because it is not a section of this story."
        scene_tag: "The scene tag filter was ignored because it is not a scene tag of this story."
        date: "The in-world %{bound} date “%{value}” could not be read, so it was ignored."
    show:
      description: "Scene %{position} of %{total} in the order %{story} is told. Narrative order is not in-world chronology."
      all_scenes: "All scenes"
      facts:
        title: "Title"
        narrative_position: "Narrative position"
        # The position and the total beside it, with no words of their own.
        position: "%{position} of %{total}"
        description: "Short description"
        description_blank: "No short description yet."
        tags: "Scene tags"
        tags_blank: "No scene tags assigned yet."
        tags_hint: "Tags are optional and belong to this story."
        # Two hints with a link in them, so they are `_html` keys and the link is
        # the interpolation: the sentence decides where the link sits. The link
        # *text* stays a key of its own, because a translator choosing where the
        # link goes still needs to know what it is called.
        tags_hint_editor_html: "Change them from the %{editor}."
        tags_hint_workspace_html: "The taxonomy is available in the %{workspace}."
        editor_link: "scene editor"
        workspace_link: "Scene Tags workspace"
        section_group: "Section group"
        section_blank: "Ungrouped. A Section is optional and only organizes this scene; it does not change its narrative position."
        event: "In-world event"
        # `%{event}` is `Event#display_label`, the record's own label in the
        # reader's language. Its own title and dates are data, so they are
        # interpolated, never translated; a phrase of its own resolves the key.
        event_html: "%{event} — see the %{workspace}. Several scenes can depict the same event."
        event_workspace: "Events workspace"
        event_blank: "No event linked yet."
        in_world_time: "In-world time"
        in_world_time_blank: "No in-world time set yet."
        in_world_time_hint: "This is the order in world time, kept separate from the narrative position above. The event and the in-world time are independent values; neither one is derived from the other and a disagreement between them is not detected here."
        story: "Story"
      tabs:
        # The four workspace tabs, which are real URLs rather than in-document
        # panes. The other three are the sibling workspaces' own titles.
        aria_label: "Scene workspace"
        details: "Scene Details"
    form:
      name: "Title"
      name_hint: "The scene's title in the narrative order. Only a title is required."
      description: "Short description"
      description_hint: "An optional one-line summary shown in the scene list."
      tags_legend: "Scene tags"
      tags_label: "Scene tags"
      tags_hint: "Optional. Assign any labels that describe this scene. Tags belong to this story and can be managed under Configuration → Tags → Story Tags → Scene tags."
      tags_empty: "No scene tags are defined for this story yet."
      manage_tags: "Manage Scene Tags"
      organization_legend: "Organization"
      section: "Section"
      section_hint: "Optional. A Section groups this scene, for example under a book, chapter, season, or episode. Grouping changes organization only: it never changes this scene's narrative position, and a nested Section also places the scene inside its ancestor path."
      in_world_time_legend: "In-world time"
      event: "Event"
      event_hint: "Optional. Links this scene to a shared universe event. Several scenes can reference the same event, and nothing else in this form changes when you pick one."
      # The blank event option reads the shared `shared.none`, so it is not
      # repeated here.
      datetime: "In-world time"
      datetime_hint: "Optional. A single point in story time, stored with the same precision and without a timezone as event dates. It is independent of the event above: choosing or clearing one never writes, clears, or checks the other, so you can deliberately keep them different."
      # `%{move_up}`/`%{move_down}` are the list's own translated control names, so
      # this sentence names the controls the reader will actually find.
      position_note_html: "This scene's narrative position is set only by the %{move_up}/%{move_down} controls on the %{scenes_list}. It is the order the story is told in, not in-world chronology."
      scenes_list_link: "scenes list"
      submit_create: "Create Scene"
      submit_update: "Update Scene"
    # The Elements section of Scene Details. The kind labels are the values a
    # select stores, so the `kind` itself is never translated — only the label
    # beside it is, and both the server-rendered list and the modal read these.
    elements:
      title: "Scene elements"
      add: "Add element"
      edit: "Edit element"
      position_aria: "Element %{position} of %{total}"
      empty_title: "No elements yet"
      empty_description: "A scene can hold any number of elements, including none. A narration block describes what happens; a dialogue block names the characters who speak in it."
      no_content: "No content yet. A title is all an element needs."
      delete_confirm: "Delete “%{name}”? Its content and its speaker links will be permanently removed. Characters and other universe records will not be deleted."
      # The sentence a Dialogue's row states about its speaker links. `names` is
      # the author-entered speaker names joined by the locale's own connector, so
      # it is interpolated; the one/other split is the verb agreeing with the count.
      speaker_note:
        one: "%{names} speaks in this block. The link records who is in the conversation, not which line belongs to whom."
        other: "%{names} speak in this block. The link records who is in the conversation, not which line belongs to whom."
      speaker_note_empty: "A dialogue must name at least one speaker."
      # The two Element kinds. `kind` is the value the select stores, so only the
      # label is translated.
      kinds:
        narration: "Narration"
        dialogue: "Dialogue"
        narration_description: "Description or action, with no one speaking."
        dialogue_description: "A spoken block. Name everyone who speaks in it."
      form:
        kind: "Element type"
        name: "Title"
        name_hint: "The block's title. Only a title is required; the content can follow later."
        body: "Content"
        body_hint: "Plain text, kept exactly as written. Nothing here is interpreted as chronology or checked against the universe."
        speakers: "Speakers"
        speakers_hint: "Everyone who speaks in this block. Several characters may share one dialogue; the link records who is in the conversation, not which line belongs to whom."
        remove_speakers: "Remove the speakers and make this narration"
        remove_speakers_hint: "Narration cannot keep speakers. This is the confirmation that removes them, and it happens in the same save."
        save: "Save element"
    # The three presence-link tabs. Their pages and their editors are one shape, so
    # the copy that is genuinely shared (the role field, the "linked" badge, the
    # sentences a derived speaker states) sits in `participation` and each tab's
    # own strings sit under its own name.
    participation:
      role: "Role: %{role}"
      no_role: "No role recorded"
      linked: "Linked"
      depicted: "Depicted"
      # The row control withdraws a **link**, which is not the record: the
      # character, item, or location stays in the universe. That is why this is
      # "Remove" and not the shared row action's "Delete", which removes a record.
      remove_label: "Remove"
      # `%{count}` is a count resolved with a `count:`, so the plural comes from
      # the locale.
      speaks_in: "Speaks in %{count}"
      # The one hint all three role fields share, with each tab supplying its own
      # examples (`<tab>.role_examples`): the sentence is written once and the
      # examples are interpolated, because the examples are chrome too and each
      # tab suggests different ones.
      role_hint: "Optional, in your own words: %{examples} Leave it blank if you do not want to say. Nothing here is interpreted by the application."
      # The row menu's own accessible name. It names the record *and* the scene it
      # appears in, because a name can appear in more than one of this tab's rows
      # across the story.
      actions_for: "Actions for %{name} in %{scene}"
      # The row that says a character speaks, naming the Elements. `%{elements}` is
      # the author-entered element names joined by the locale's connector.
      speaks_in_html: "Speaks in %{elements}."
      remove:
        character: "Remove %{name} from %{scene}? The character stays in the universe, and anyone who speaks in a dialogue is unaffected."
        item: "Remove %{name} from %{scene}? The item stays in the universe and in every other scene."
        location: "Remove %{name} from %{scene}? The location stays in the universe, with its nested places, and in every other scene."
    characters:
      document_title: "Characters in %{scene}"
      description: "Everyone who takes part in this scene. A participant is stored here with an optional role; a character who only speaks in a dialogue is derived from that dialogue, so the two are shown side by side and counted once."
      add: "Add character"
      save: "Save character"
      edit_role: "Edit role"
      role_examples: "“setting,” “enters,” “carries,” “objective.”"
      participant_badge: "Participant"
      empty_title: "No characters in this scene yet"
      empty_description: "Add a character to record that they take part, with an optional role such as “setting,” “enters,” or “objective.” A character who only speaks in a dialogue appears here too, without a separate record."
      form:
        character: "Character"
        choose_character: "Choose a character"
        character_hint: "A character belongs to the universe and is shared by every story in it. A character can only be in a scene once; choosing one that already is is reported here, in this window."
        role: "Role"
    items:
      document_title: "Items in %{scene}"
      description: "The objects that appear in this scene. An item belongs to the universe and is shared by every story in it, so linking one here never copies it. Each link can carry an optional role in your own words."
      add: "Add item"
      save: "Save item"
      edit_item: "Edit item"
      role_examples: "“carries,” “on the table,” “destroyed.”"
      empty_title: "No items in this scene yet"
      empty_description: "Add an item to record that it appears here, with an optional role such as “carries,” “on the table,” or “destroyed.” The item itself is shared by every story in the universe."
      form:
        item: "Item"
        choose_item: "Choose an item"
        item_hint: "An item belongs to the universe and is shared by every story in it. An item can only be in a scene once; choosing one that already is is reported here, in this window."
        role: "Role"
    locations:
      document_title: "Locations in %{scene}"
      description: "The places this scene happens in. A location belongs to the universe and is shared by every story in it, so linking one here never copies it. A scene can use any number of them, and each link can carry an optional role in your own words."
      add: "Add location"
      save: "Save location"
      edit_location: "Edit location"
      role_examples: "“setting,” “arrives at,” “left behind.”"
      empty_title: "No locations in this scene yet"
      empty_description: "Add a location to record that the scene happens there, with an optional role such as “setting,” “arrives at,” or “left behind.” The location itself is shared by every story in the universe, together with its nested places."
      form:
        location: "Location"
        choose_location: "Choose a location"
        location_hint: "Nested places are indented under their parent, so a room is recognizable from the house it belongs to. A location can only be in a scene once; choosing one that already is is reported here, in this window."
        role: "Role"
    # The "Appears in scenes" section on a shared universe record's own page: the
    # reverse of the three tabs, so it states the same things they do.
    appearances:
      title: "Appears in scenes of %{story}"
      # Without a current Story there is nothing to point at, so the section says
      # so and names no Story.
      title_without_story: "Appears in scenes"
      empty_title: "Not in any scene of %{story} yet"
      empty_title_without_story: "Select a story to see its scenes"
      empty_description: "This record is shared by every story in the universe, so it can appear in as many scenes as you like. Link it from a scene's Characters, Items, or Locations tab, or point a scene at this event, and it will be listed here."
      empty_description_without_story: "Scenes belong to a story, so a record can only say where it appears once a story is the current one. Pick a story to see which of its scenes use this record."
    # The ungrouped block below the Sections tree: only the scenes that belong to
    # no section, plus the form that groups one of them.
    grouping:
      title: "Ungrouped scenes"
      description_html: "Only the scenes that belong to no section are listed here. Grouping is organization only: it never changes the order in the %{scenes_list}."
      # The same paragraph with the count of already-grouped scenes folded in.
      # It is a second key rather than a sentence spliced into the first, because
      # the two clauses do not keep their order in every language.
      description_with_grouped_html: "Only the scenes that belong to no section are listed here. The other %{total} in %{story} are grouped and are listed on their own section's page, which the Details link on a section above opens. Grouping is organization only: it never changes the order in the %{scenes_list}."
      empty_title: "No scenes yet"
      empty_description: "This story has no scenes to group yet. Add one and it will appear here as ungrouped."
      add_first: "Add the first scene"
      all_grouped: "Every scene in %{story} is grouped under a section, so there is nothing waiting to be grouped here. Open a section above to read the scenes grouped under it."
      count:
        one: "%{count} ungrouped scene"
        other: "%{count} ungrouped scenes"
      move_scene_label: "Ungrouped scene"
      move_to_label: "Move to"
      submit: "Move scene"
    flash:
      created: "Scene was successfully created."
      updated: "Scene was successfully updated."
      deleted: "Scene was successfully destroyed."
      moved: "Scene was moved."
      move_failed: "Scene could not be moved."
      already_first: "This scene is already first in the narrative order."
      already_last: "This scene is already last in the narrative order."
      grouped: "“%{name}” is now grouped under %{grouping}. Its narrative position did not change."
      ungrouped: "“%{name}” is now ungrouped. Its narrative position did not change."
    # The error summary's subject. It is the phrase that follows the sentence's own
    # "this", so it carries no article here — the Spanish entry is a full phrase
    # because its sentence has no determiner to supply one.
    #
    # The `errors.add` messages below read as the tail of `errors.format`
    # ("%{attribute} %{message}"), so each starts lowercase. They are the Scene
    # model's own messages and live beside the subject rather than in a shared
    # block, exactly as `events.errors` belongs to the Events workspace.
    errors:
      subject: "scene"
      must_exist: "must exist"
      must_belong_to_story: "must belong to the same story"
      must_belong_to_universe: "must belong to the story's universe"
      must_be_unique: "must be unique"
      invalid_datetime: "is not a valid date and time"

  # The Universe Bible workspaces: Characters, Locations, Events, Items,
  # Relations, and Ownerships. Each block owns its list page, the modal editor
  # that list page opens, and the record's own details page, so a workspace and
  # its translations live together.
  #
  # Two of their strings are not repeated here. The `Universe Bible` eyebrow is
  # the left sidebar's own section heading and is read from `sidebar.*` — the
  # same choice `universes.show` makes for its quick links. The record-type nouns
  # the counts are announced with stay at the root of this file, and the tab
  # strip a workspace shares with its sibling reads that sibling's own `tabs`.
  characters:
    title: "Characters"
    description: "People and beings whose details are shared by every story in this universe."
    tabs_aria_label: "Character workspace"
    new_title: "New character"
    add: "Add character"
    save: "Save character"
    # The modal is built with `form_with scope:`, which has no model to read
    # `human_attribute_name` from, so a modal's own labels are named here. The
    # `activerecord.attributes` entry for the same column is what an error
    # message reads, and the two are expected to say the same thing.
    form:
      name: "Name"
      description: "Description"
      tags_label: "Character tags"
    empty_title: "No characters yet"
    # The list has two empty states because it has two audiences, exactly as the
    # universes and stories lists do: a writer is told to add the first record,
    # and a guest or read-only member is told the records belong to the universe.
    empty_writable_description: "Characters belong to the universe and are shared by all of its stories. Add the first one to begin."
    empty_read_only_description: "Characters belong to the universe and are shared by all of its stories."
    # A Character has dependents, so its row's delete states its own cascade. The
    # exact sentence is mandated by ADR 0007 and must not be weakened here;
    # `name` is the author's own record name, so it is interpolated rather than
    # translated.
    delete_confirm: "Delete “%{name}”? Its descendant characters, relations, ownerships, tag assignments, and links to scenes will be permanently removed. Scenes and other universe records will remain."
    show:
      label: "Character"
      back_label: "All characters"
      facts:
        universe: "Universe"
        tags: "Character tags"
        tags_blank: "No tags assigned. Tags are optional."
        description: "Description"
        description_blank: "No description yet."
    tabs:
      characters: "Characters"
      relations: "Relations"

  locations:
    title: "Locations"
    description: "Build a hierarchy of places and regions shared by every story in this universe."
    tabs_aria_label: "Location workspace"
    new_label: "Add location"
    # Locations is a taxonomy tree, so it has no empty title of its own: the tree
    # names the taxonomy from `taxonomies.<model_param>.none_yet`. These two
    # descriptions sit under that title, and the second is the read-only one.
    empty_description: "Add a location, then drag rows to create parent and child places."
    read_only_empty_description: "No locations have been added yet."
    # A Location has dependents, so each tree node carries its own cascade as the
    # `confirm_message` the shared taxonomy tree serializes. Same ADR-mandated
    # sentence as the Characters and Items lists.
    delete_confirm: "Delete “%{name}”? Its descendant locations, tag assignments, and links to scenes will be permanently removed. Scenes and other universe records will remain."
    show:
      label: "Location"
      back_label: "All locations"
      facts:
        universe: "Universe"
        tags: "Location tags"
        tags_blank: "No tags assigned. Tags are optional."
        parent: "Parent location"
        parent_blank: "This location is a top-level place."
        children: "Child locations"
        children_blank: "No nested places yet."
        description: "Description"
        description_blank: "No description yet."
    tabs:
      locations: "Locations"

  events:
    title: "Events"
    description: "Record moments that shape the universe and provide the structure for its timeline."
    tabs_aria_label: "Event workspace"
    new_title: "New event"
    add: "Add event"
    save: "Save event"
    empty_title: "No events yet"
    empty_writable_description: "Add events with dates or relationships to each other, then open the Timeline to see how they connect."
    empty_read_only_description: "Events in this universe will appear here once they have been added."
    # An Event has dependents, so its row's delete states its own cascade in the
    # same ADR-mandated words as the Character, Item, and Location lists.
    # `name` is `Event#display_label`, so it is the event's own label, resolved
    # in the reader's language, and interpolated rather than translated.
    delete_confirm: "Delete “%{name}”? Its child events, tag assignments, and any temporal referrers that would become unidentifiable will be permanently removed; other temporal references and Scene links will be cleared. Scenes will remain."
    form:
      title: "Title"
      description: "Description"
      tags_label: "Event tags"
      hint: "An event needs at least a title, a start or end date, or a relationship to another event below."
      start_datetime: "Start date/time"
      end_datetime: "End date/time"
      # The three temporal references. The values are event ids, so only the
      # labels beside them are translated, and the blank option that clears one is
      # `shared.none` because the Scene form's event link needs the same word.
      before_event: "Happens before"
      after_event: "Happens after"
      simultaneous_event: "Same time as"
    show:
      label: "Event"
      back_label: "All events"
      facts:
        # There is no blank state for the title. The value is
        # `title.presence || display_label`, and `display_label` always answers
        # with something — at worst "Event #12" — so a blank copy here could never
        # be rendered and would only be a key nothing reads.
        title: "Title"
        universe: "Universe"
        tags: "Event tags"
        tags_blank: "No tags assigned. Tags are optional."
        in_world_time: "In-world time"
        description: "Description"
        description_blank: "No description yet."
    # `errors.add` messages read as the tail of `errors.format`
    # ("%{attribute} %{message}"), so each starts lowercase.
    errors:
      must_belong_to_universe: "must belong to the event's universe"
      cannot_be_itself: "cannot be itself"
      must_be_identifiable: "must have a title, a date, or a relation to another event"
    # An Event's own label, in the reader's language. `Event#display_label`
    # resolves these; `Event#display_string` is the same ladder resolved in the
    # default locale, because that is the string a search document stores and one
    # index serves every reader. `event` is a referenced event's own label, so it
    # is already a sentence in the reader's language and is interpolated whole.
    display_label:
      unidentified: "Event #%{id}"
      before: "before %{event}"
      after: "after %{event}"
      simultaneous: "same time as %{event}"
    tabs:
      events: "Events"

  items:
    title: "Items"
    description: "Objects and resources whose details are shared by every story in this universe."
    tabs_aria_label: "Item workspace"
    new_title: "New item"
    add: "Add item"
    save: "Save item"
    form:
      name: "Name"
      description: "Description"
      tags_label: "Item tags"
    empty_title: "No items yet"
    empty_writable_description: "Items belong to the universe and can be used to track objects, resources, and ownership across every story. Add the first one to begin."
    empty_read_only_description: "Items belong to the universe and are shared by all of its stories."
    # An Item has dependents, so its row's delete states its own cascade, in the
    # same ADR-mandated words as the Characters list above.
    delete_confirm: "Delete “%{name}”? Its descendant items, ownerships, tag assignments, and links to scenes will be permanently removed. Scenes and other universe records will remain."
    show:
      label: "Item"
      back_label: "All items"
      facts:
        universe: "Universe"
        tags: "Item tags"
        tags_blank: "No tags assigned. Tags are optional."
        description: "Description"
        description_blank: "No description yet."
    tabs:
      items: "Items"
      ownerships: "Ownerships"

  # Relations and Ownerships are the two workspaces that use the HTML
  # redirect/re-render flow rather than a JSON-only mutation, so they are also the
  # two that set a flash. Their `flash` blocks are the confirmation for a saved or
  # deleted record; the record type is spelled out rather than interpolated,
  # because "Relation created." is a sentence about one record and composing it
  # from the root noun would put the word order back under the locale's control.
  relations:
    title: "Relations"
    # The eyebrow is the tab strip this workspace belongs to, not the section it
    # is filed under: Relations is reached from the Characters tab.
    eyebrow: "Characters"
    description: "Connect characters and record how their relationships change over time."
    new_title: "New relation"
    add: "Add relation"
    save: "Save relation"
    form:
      # The name is optional on both models: the two endpoints are the reliable
      # label, and a record's label and the composite slug both prefer the name
      # only when one is set.
      name: "Name"
      name_hint: "Optional. Used as the label instead of the two characters when it is set."
      description: "Description"
      tags_label: "Relation tags"
    character1: "Character 1"
    character2: "Character 2"
    select_character: "Select a character"
    from: "From"
    to: "To"
    empty_title: "No relations yet"
    empty_writable_description: "Connect two characters to describe their relationship. Relation tags are optional but can make these connections easier to scan."
    empty_read_only_description: "Character relationships in this universe will appear here once they have been added."
    show:
      label: "Relation"
      back_label: "All relations"
      facts:
        character1: "First character"
        character2: "Second character"
        tags: "Relation tags"
        tags_blank: "No tags assigned. Tags are optional."
        in_world_dates: "In-world dates"
        description: "Description"
        description_blank: "No description yet."
      related:
        title: "Related information"
        empty_title: "Nothing related yet"
        empty_description: "This relation is a link between two characters. Anything else worth knowing about it will be listed here later."
    # The error summary's subject. It is the phrase that follows the sentence's
    # own "this", so it carries no article here — the Spanish entry is a full
    # phrase because its sentence has no determiner to supply one.
    errors:
      subject: "relation"
    # The two endpoints as one phrase, for the row action's delete confirmation:
    # the row draws them either side of an arrow, and the confirmation has to
    # name them in a sentence. Neither name is chrome, so both are interpolated.
    endpoints: "%{first} and %{second}"
    flash:
      created: "Relation created."
      updated: "Relation updated."
      deleted: "Relation deleted."
    tabs:
      characters: "Characters"
      relations: "Relations"

  ownerships:
    title: "Ownerships"
    eyebrow: "Items"
    description: "Track which characters own items and when those relationships change."
    new_title: "New ownership"
    add: "Add ownership"
    save: "Save ownership"
    form:
      # The name is optional on both models: the item and character are the
      # reliable label, and a record's label and the composite slug both prefer
      # the name only when one is set.
      name: "Name"
      name_hint: "Optional. Used as the label instead of the item and character when it is set."
      description: "Description"
      tags_label: "Ownership tags"
    # The two form labels. `character` is the field's subject — the select offers
    # characters — while `show.facts.owner` is what the record *is* in that
    # relationship, so the two are separate keys and not one shared noun.
    item: "Item"
    character: "Character"
    select_item: "Select an item"
    select_character: "Select a character"
    from: "From"
    to: "To"
    empty_title: "No ownerships yet"
    empty_writable_description: "Connect a character to an item to record present or historical ownership."
    empty_read_only_description: "Ownership records in this universe will appear here once they have been added."
    show:
      label: "Ownership"
      back_label: "All ownerships"
      facts:
        item: "Item"
