      character_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      relation_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        symmetric: "Symmetric"
        inverse: "Inverse"
      location_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      event_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      item_tag:
