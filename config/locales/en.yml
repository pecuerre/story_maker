  # The universe Timeline. Each node's popover is assembled by `TimelineHelper`,
  # so the labels read there. The three relationship phrases are not listed here:
  # an Event's label carries them, and `Event#display_label` owns them so a node's
  # popover and an Event's own page cannot disagree about what "before" means.
  timeline:
    description: "See how events are ordered from dates and explicit before, after, and simultaneous relationships."
    add_event: "Add event"
    empty_title: "No events to place on the timeline"
    empty_writable_description: "Add events with dates or relationships to each other, then return here to see their order."
    empty_read_only_description: "Events in this universe will appear on the timeline once they have been added."
    # The node renders the record's id, which a screen reader announces as a bare
    # number, so the control carries this label instead. `event` is the same
    # string the popover header shows.
    node_aria_label: "Show event details: %{event}"
    popover:
      dates: "Dates:"
      tag: "Tag:"
      related: "Related:"

  # The read-only comparison of one Story's Scene sequence with the Universe
  # Timeline. The conflict definition is the whole point of the page: a reversal
  # between telling and happening is not an error, and only a Scene whose own
  # time falls outside its linked Event is reported as conflicting.
  narrative_orders:
    title: "Narrative order"
    description: "Compare the order %{story} tells its scenes with when the universe says they happen."
    intro: "The left column is the order the story is told. The right column is the Universe Timeline. A scene's own time is shown but never moves its event."
    left_heading: "How the story is told"
    left_description: "Every scene in narrative order. A scene with no event, or whose event has no recorded time, ends the current run."
    right_heading: "When it happens"
    right_description: "The Universe Timeline in the same order the Timeline page draws. Events this story never depicts stay visible but secondary."
    guide:
      title: "Reading the comparison"
      conflict: "Only one thing is called a conflict: a scene whose own in-world time falls outside every event it links. A flashback, a parallel thread, or a scene told out of order is not a conflict."
      steps_heading: "Steps"
      counts_heading: "Steps in this story"
      summary_heading: "This story"
    steps:
      first:
        label: "First in this run"
        description: "No earlier scene in this run has a place, so there is nothing to compare. A scene that cannot be placed starts a new run."
      later:
        label: "Later"
        description: "The event happens after the previous scene's event in the same run."
      earlier:
        label: "Earlier"
        description: "The event happens before the previous one. This is a flashback, a parallel thread, or an order worth checking, not a conflict."
      same_time:
        label: "Same time"
        description: "The two events share a simultaneity group."
      unknown_order:
        label: "No known order"
        description: "The two events share a timeline row, but the timeline records no evidence either way."
    summary:
      scenes: "Scenes"
      on_timeline: "Scenes on the timeline"
      no_event: "Scenes with no event link"
      event_without_time: "Scenes whose events have no recorded time"
      conflicts: "Conflicts"
      events_on_timeline: "Events on the timeline"
      events_without_time: "Events without recorded time"
      runs: "Runs compared"
    no_event: "No event linked"
    own_time: "Own time: %{time}"
    event_without_time: "The linked events have no recorded time."
    timeline_row: "Timeline row %{number}"
    compared_with: "Compared with scene %{position}"
    conflict: "Conflicting time: this scene's own time (%{time}) falls outside its event's range (%{range})."
    conflict_multiple: "Conflicting time: this scene's own time (%{time}) falls outside every event it links (%{events})."
    scenes_here: "Scenes %{positions}"
    no_scenes_here: "No scene depicts this event"
    unplaced_heading: "No recorded time"
    unplaced_event: "No date or temporal relationship is recorded."
    no_place_description: "No scene links an event with a recorded time yet, so there is nothing to compare here."
    timeline_empty_title: "No events in this universe yet"
    timeline_empty_writable_description: "Add events with dates or relationships, then return here to see them beside the story."
    timeline_empty_read_only_description: "Events in this universe will appear here once they have been added."
    timeline_no_time_description: "This universe has events, but none has a recorded time yet."
    empty_title: "No scenes yet"
    empty_writable_description: "Add the first scene to start the narrative order."
    empty_read_only_description: "This story has no scenes to compare yet."

  # The read-only Story-wide Scene planning board. Every Section is a column,
  # the ungrouped scenes have their own column, and the cards inside a column
  # keep narrative order. The page adds no order, no editor, and no stored
  # result.
  scene_boards:
    title: "Scene board"
    description: "The shape of %{story} at once: every section as a column, with its scenes in the order the story tells them."
    intro: "Columns are sections and the ungrouped scenes, and every card is a scene in narrative order. Move a card in the story's telling order, regroup it into another section, or open it to edit its fields."
    scroll_label: "Scrollable scene board for %{story}."
    column_empty: "No scenes here"
    controls:
      regroup: "Move to section"
      section: "Section"
      regroup_submit: "Move scene"
    empty:
      title: "No scenes yet"
      writable_description: "Add the first scene to start the board."
      read_only_description: "This story has no scenes to show yet."

  # The read-only Story-wide Scene matrix. One row per Scene in narrative order
  # and one column per fact the Story already stores; the table is its own
  # accessible equivalent, and the page adds no order, no editor, and no stored
  # result.
  scene_matrices:
    title: "Scene matrix"
    description: "Every scene in %{story} at once, in the order the story tells them, with the facts already recorded about each one."
    intro: "Rows are scenes in narrative order and columns are what the story already records on them. This page is a read: edit a scene, its tags, or its events from the scene's own pages."
    caption: "The scenes of %{story} in narrative order, with each scene's section, tags, point of view, in-world time, linked events, element count, word count, and participant count."
    scroll_label: "Scrollable scene matrix for %{story}."
    columns:
      scene: "Scene"
      section: "Section"
      tags: "Scene tags"
      pov: "Point of view"
      in_world_time: "In-world time"
      events: "Events"
      elements: "Elements"
      words: "Words"
      participants: "Characters take part"
    values:
      no_tags: "No tags"
      no_pov: "No point of view recorded"
      no_time: "No in-world time recorded"
      no_events: "No events linked"
    empty:
      title: "No scenes yet"
      writable_description: "Add the first scene to start the matrix."
      read_only_description: "This story has no scenes to show yet."

  # The read-only Story-wide appearance grid. Recorded presence and prose
  # mentions are two layers drawn with different marks, never one merged state;
  # the legend says so in the reader's language.
  appearances:
    title: "Appearance grid"
    description: "Every character in %{story} at once: recorded appearances and prose mentions are separate layers."
    intro: "Rows are characters and columns are scenes in narrative order. Recorded presence is a stored character link or a line of dialogue; a prose mention is only a name written in an element."
    caption: "Recorded appearances and prose mentions for each character in %{story}, by scene in narrative order."
    scroll_label: "Scrollable appearance grid for %{story}."
    character_column: "Character"
    scene_link: "Scene %{position}: %{name}"
    legend:
      title: "Legend"
      present: "Recorded appearance: a stored character link or a line of dialogue."
      mention: "Prose mention: a name written in an element. A mention is not an appearance."
    states:
      present: "Appears"
      mention: "Mentioned"
      both: "Appears and is mentioned"
      none: "Not present"
    empty:
      no_scenes_title: "No scenes yet"
      no_scenes_description: "Add the first scene to start the grid."
      no_scenes_read_only_description: "This story has no scenes to show yet."
      no_characters_title: "No characters appear or are mentioned in %{story} yet"
      no_characters_description: "Record a character in a scene's Characters tab, or write their name in an element's content. Either way, the character gets a row here."

  # The search box and the results page it opens. `bar.*` is the box in the top
  # bar; everything below it belongs to the results page, the scope dropdown, and
  # the two model-level surfaces that read for it (`Search::Scope`'s options,
  # `Search::Kinds`' badges, `Search::Commands`' destinations), which is why the
  # copy lives here rather than beside each of them.
  searches:
    bar:
      label: "Search Universe Maker"
      placeholder: "Search"
      placeholder_universe: "Search this universe"
      submit: "Search"
      results_label: "Search results"
      see_all: "See all results"
      # The strings the autocomplete half of the box builds in the browser. The
      # form and the results page are server-rendered; the dropdown, its live
      # announcements, and the no-match message are not, so they live here.
      #
      # The announced forms repeat a sentence without the curly quotes the
      # visible one uses, because the quotes are decoration on screen and
      # punctuation a screen reader reads out loud.
      type_more:
        one: "Type %{count} more character to search."
        other: "Type %{count} more characters to search."
      no_matches: "No matches for “%{text}”."
      no_matches_announce: "No matches for %{text}."
      matches_announce:
        one: "%{count} result for %{text}."
        other: "%{count} results for %{text}."
      unavailable: "Search is not available."
      # `reason` is the server's own already-translated sentence
      # (`searches.unavailable_reason`), or the one below when the request never
      # reached the server at all — which is the same answer the server gives for
      # an engine it cannot reach, so this frame only has to place it.
      unreachable: "Search could not be reached."
      unavailable_reason: "Search is not available. %{reason}"
      results_group: "Results"
      # The last-resort label for a payload that carries no `kind_label` of its
      # own. The server always sends one; this is what a reader sees if it ever
      # stops doing so.
      result_label: "Result"

    title: "Search"
    eyebrow: "Find anything"
    # The page's own paragraph. It names the record types a search covers, so it
    # is one sentence rather than a list assembled from the record-type nouns:
    # the list is this page's copy, and the nouns' plurals belong to the count
    # labels.
    description: "Search records in the scope you choose by their name and searchable details; a universe or story name is context, not something to match."
    form:
      label: "Search"
      # `minimum` is `Search::Query::MINIMUM_LENGTH`, a number the code owns, so
      # it is interpolated rather than translated.
      placeholder: "At least %{minimum} characters"
      scope_label: "Scope"
      submit: "Search"
      clear: "Clear"
    # The `aria-label` of the one scope dropdown both surfaces render.
    scope_aria_label: "Search scope"
    # What the form searched. `searched` is the resolved scope's own label, which
    # is why the sentence carries a `<strong>`: the label is the emphasis, and an
    # `_html` key is the only way a translation can decide where it sits. It is
    # not called `scope`, because `scope` is a reserved I18n option and
    # `t(key, scope: …)` asks I18n to look the key up inside an area.
    scope_note_html: "Searching <strong>%{searched}</strong>."

    # The three states that explain rather than answer.
    unavailable_title: "Search is not available"
    # What a reader is told, under a heading of its own. This is not
    # `Search::UnavailableBackend::REASON`, which is the operator's sentence for a
    # log line and a reindex report: the two name the same environment variable and
    # the same command, and neither name is prose.
    unavailable_reason: "Set MEILISEARCH_URL and run bin/rails search:reindex."
    too_short_title: "Keep typing"
    too_short_description: "A search needs at least %{minimum} characters, because one character matches nearly everything."
    idle_title: "Search this universe"
    idle_description: "Type at least %{minimum} characters to look through characters, factions, locations, routes, events, items, relations, ownerships, tags, and — inside a story — sections, scenes, and their text. Narrow it with the scope above."
    commands_title: "Go to"

    # The result count. `count` is the engine's own total, not the page's, which
    # is why the count and the "showing" line are two keys: a page that lists 25
    # of 40 is not showing 25 matches.
    matches:
      one: "%{count} match"
      other: "%{count} matches"
    showing:
      one: "Showing %{shown} of %{count} match"
      other: "Showing %{shown} of %{count} matches"
    pagination:
      aria_label: "Search results pages"
      previous: "Previous"
      next: "Next"
      page: "Page %{number}"

    # The empty answer. The scope is a sentence of its own rather than a noun
    # inside this one: "Nothing in *This universe* matched" needs a lowercased
    # label, and a lowercased label is a word order the locale does not get to
    # choose. The page above the form already says what was searched, so the box
    # says it once more in a form that can start a sentence.
    nothing_matched_title: "Nothing matched “%{query}”"
    nothing_matched_searched_html: "Searched <strong>%{searched}</strong>."
    nothing_matched_description: "Check the spelling, or widen the scope above — %{platform_hint}"
    # Only stated inside a universe, where "Entire platform" is a scope the
    # reader can widen to and would not think to try.
    nothing_matched_description_no_widen: "Check the spelling, or try a different scope above."
    platform_hint: "“Entire platform” searches every universe you can read, not only this one."

    # The scope dropdown's option labels, keyed by the option's own `value`. That
    # value is a query value and is never translated — a Spanish link to
    # `?scope=characters` has to keep working — so the key is the value and only
    # the wording beside it moves.
    scopes:
      platform: "Entire platform"
      universe: "This universe"
      story: "This story"
      universes: "Only universes"
      stories: "Only stories"
      characters: "Only characters"
      factions: "Only factions"
      locations: "Only locations"
      routes: "Only routes"
      items: "Only items"
      events: "Only events"
      relations: "Only relations"
      ownerships: "Only ownerships"
      sections: "Only sections"
      scenes: "Only scenes"
      tags: "Only tags"

    # A value a request could not use, reported rather than applied. Each is
    # translated where it is dropped, so `SearchesController` joins them with
    # `to_sentence` in the reader's language instead of with English connectors.
    discarded:
      unknown_scope: "“%{value}” is not a search scope, so the default scope was used."
      widened_to_universe: "The story search was widened to this universe because no story is selected."
      widened_to_platform: "The story search was widened to the entire platform because no story is selected."
      story_without_universe: "The story filter was ignored because no universe is selected."
      story_outside_universe: "The story filter was ignored because it is not a story of this universe."

    # The badge on a result row. A document's `kind` is what the engine filters
    # on and is never translated; only the word beside it is a key. The eight
    # taxonomies share the `tag` kind and are told apart by a document's
    # `taxonomy`, so each of them is named here as a whole rather than composed
    # from the kind and a lowercased noun — the same reason `taxonomy:` stays
    # untranslated.
    kinds:
      universe: "Universe"
      story: "Story"
      section: "Section"
      plot: "Plot"
      scene: "Scene"
      scene_element: "Scene element"
      character: "Character"
      faction: "Faction"
      location: "Location"
      route: "Route"
      canon_rule: "Canon rule"
      item: "Item"
      event: "Event"
      relation: "Relation"
      faction_relationship: "Faction relationship"
      ownership: "Ownership"
      tag: "Tag"
      character_tag: "Character tag"
      faction_tag: "Faction tag"
      location_tag: "Location tag"
      item_tag: "Item tag"
      event_tag: "Event tag"
      relation_tag: "Relation tag"
      ownership_tag: "Ownership tag"
      section_tag: "Section tag"
      scene_tag: "Scene tag"

    # The navigation half of the box. A command's `id` is what the dropdown
    # marks the active option with, so it stays a value; the title is the label
    # beside it. `name` is a universe's or a story's own name, so it is
    # interpolated rather than translated.
    commands:
      universe_overview: "Universe overview"
      stories: "All stories"
      characters: "Characters"
      factions: "Factions"
      locations: "Locations"
      routes: "Routes"
      events: "Events"
      items: "Items"
      relations: "Relations"
      ownerships: "Ownerships"
      timeline: "Timeline"
      tags: "Tags"
      story: "Story: %{name}"
      sections: "Sections"
      plots: "Plots"
      scenes: "Scenes"
      universe: "Universe: %{name}"
      open_universe: "Open universe"

