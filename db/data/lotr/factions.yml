- universe: Universe.lotr
  name: Fellowship of the Ring
  slug: fellowship-of-the-ring
  summary: Carry the One Ring to Mount Doom and destroy it.
  description: |
    ## Actual aims

    Prevent Sauron from ruling Middle-earth.

    ## Structure

    A small company guided by its appointed leader and shared purpose.

    ## Internal divisions

    Members differ in experience, loyalties, and confidence.

    ## Resources

    The Ring-bearer, companions, and aid from free peoples.

    ## Would never

    Use the Ring as a weapon against Sauron.

    ## Would absolutely

    Continue the quest despite overwhelming danger.
  faction_tags: [ FactionTag.alliance ]

- universe: Universe.lotr
  name: White Council
  slug: white-council
  summary: Resist the return of the Shadow in Middle-earth.
  description: |
    ## Actual aims

    Keep Sauron's influence from becoming an open threat.

    ## Structure

    A council of powerful leaders with independent responsibilities.

    ## Internal divisions

    Its members disagree about when and how to confront Dol Guldur.

    ## Resources

    Ancient knowledge, influence, and the power of its members.

    ## Would never

    Surrender its members' independent judgment.

    ## Would absolutely

    Act when the Shadow threatens the free peoples.
  faction_tags: [ FactionTag.council ]
