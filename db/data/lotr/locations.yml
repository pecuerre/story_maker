- universe: Universe.lotr
  name: The Shire
  slug: the_shire
  location_tags: [ LocationTag.region ]
  parent: Location.eriador
  description: |
    A quiet land the wider world has largely forgotten, and the place the Ring
    leaves first.

    ## Sensory

    - Sight: Green hills, tidy gardens, and round doors set into the slopes.
    - Smell: Pipeweed, cut grass, and bread from the village ovens.

    ## History

    - Past occupants: Hobbit families have farmed these hills for generations.

- universe: Universe.lotr
  name: Hobbiton
  slug: hobbiton
  description: |
    The Shire village of the Baggins family.

    ## Layout

    - Structure: A village of smials built into a low hillside above a mill and a pond.
    - Key areas: Bag End, the Party Tree, the mill, and the Green Dragon.
    - Entrances and exits: The East Road runs through the village and over the Water.
    - Points of interest: Bag End's round green door.
  location_tags: [ LocationTag.village ]
  parent: Location.the_shire

- universe: Universe.lotr
  name: Rivendell
  slug: rivendell
  location_tags: [ LocationTag.stronghold ]
  parent: Location.eriador
  description: |
    A refuge where the council decides the fate of the Ring. [[canon:K1]] is
    argued here before [[character:frodo-baggins]] carries the Ring south.

    ## Sensory

    - Sound: Waterfalls, wind in the pines, and songs in the halls at evening.

    ## Layout

    - Structure: Elven halls and terraces built along a gorge beneath the mountain road.

    ## Control and access

    - Granted how: The hidden path is known to the Elves and to travellers they guide.
    - Security: The valley is hard to find and guarded by watchful scouts.

- universe: Universe.lotr
  name: Moria
  slug: moria
  location_tags: [ LocationTag.stronghold ]
  parent: Location.eriador
  description: |
    The ancient Dwarf city beneath the Misty Mountains.

    ## Sensory

    - Smell: Dust, old iron, and deep water.
    - Touch: Cold stone, slick stairs, and air that leaves the skin damp.

    ## History

    - Significant events: The Dwarves delve too deep and the Balrog drives them out.
    - Past occupants: The Dwarves of Khazad-dûm, and later the Orcs that occupy the halls.
    - Changes: Mines and bridges collapse, and the upper halls become a tomb.

    ## Control and access

    - Controlled by: No one holds Moria when the Fellowship passes; Orcs and the Balrog hold its depths.
    - Security: Doors of stone, a guarded bridge, and the long dark.
    - Restrictions: The mines are impassable without light and a guide who knows the upper ways.

