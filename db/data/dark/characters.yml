- universe: Universe.dark
  name: Jonas
  character_tags: [ CharacterTag.family_kahnwald ]
  factions: [ Faction.sic_mundus ]
  pronouns: "he/him"
  summary: "A young man caught in the knot's repeating cycles."
  description: |
    ## Wants

    To prevent his father's suicide and save Martha.

    ## Needs

    To accept that certainty can make him part of the cycle.

    ## Lies about (to himself)

    He can end the cycle without becoming what he opposes.

    ## Contradictions

    He seeks freedom while following a path laid by older selves.

    ## Under pressure

    Withholds what he knows and acts alone.

    ## Never

    Deliberately abandon Martha to the cycle.

    ## Knowledge

    When Martha describes the other world, he learns that a second version of
    the world exists and that she comes from it. It changes his plan.
  photo: Photo.the_tannhaus

