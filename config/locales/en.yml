    catalog:
      damsel_in_distress:
        description: "A character is placed in danger so another character can rescue them."
        craft_note: "Keep the endangered character's own goals, choices, and consequences in view; peril need not erase agency."
      women_in_refrigerators:
        description: "A character's harm or death is used chiefly to motivate another character's story."
        craft_note: "Give the affected character narrative agency; avoid using their suffering as a shortcut for someone else's development."
      magical_negro:
        description: "A marginalized character is framed mainly as a guide or catalyst for a more privileged protagonist."
        craft_note: "Give the character independent aims and relationships, rather than reducing them to a helper or stereotype."
      manic_pixie_dream_girl:
        description: "A quirky love interest exists chiefly to change a dissatisfied protagonist's outlook."
        craft_note: "Give them motivations and change of their own, beyond catalyzing someone else's growth."
      bury_your_gays:
        description: "Queer characters are repeatedly killed or denied lasting futures as an emotional device."
        craft_note: "Consider the pattern across the work; queer characters deserve varied, full lives rather than a single tragic function."
      chekhovs_gun:
        description: "A detail introduced earlier later becomes consequential to the plot."
        craft_note: "A payoff feels earned when the setup is noticeable without making every detail a promise."
      red_herring:
        description: "A clue plausibly points toward a wrong explanation or suspect."
        craft_note: "Plant it fairly and resolve it; misdirection should reward attention rather than invalidate it."
      found_family:
        description: "People form a lasting, family-like bond outside biological or legal ties."
        craft_note: "Let trust grow through choices and care instead of using the label to skip relationship development."
      character_foil:
        description: "Contrast between characters makes traits or choices in each more visible."
        craft_note: "Keep each character fully motivated; contrast is strongest when neither exists only as a measuring stick."
      fish_out_of_water:
        description: "An outsider's unfamiliarity with a setting reveals its rules and assumptions."
        craft_note: "Let the outsider learn and affect the setting; avoid making them only a source of jokes."

