    description: "These preferences belong to this browser, not to a universe, so they are available on every page and to a guest."
    go_back: "Go back"
    navigation_label: "Settings sections"
    tabs:
      appearance: "Appearance"
      language: "Language"
      start_page: "Start page"
      limits: "Limits"
    appearance:
      title: "Appearance"
      description: "How this browser renders Universe Maker. Every page follows the choice, and nothing else about the workspace changes with it."
      legend: "Theme"
      hint: "Light and dark are the only two themes. The choice is remembered in this browser; it is not an account setting and no universe admin can change it for you."
      submit: "Save theme"
      option_description:
        light: "A light page with dark text."
        dark: "A dark page with light text."
    language:
      title: "Language"
      description: "Which language the application is written in. Every page follows the choice, including the messages the server sends back."
      legend: "Language"
      hint: "The choice is remembered in this browser and applies to every page, to a guest, and with no universe selected. It is not an account setting and no universe admin can change it for you."
      submit: "Save language"
      # Each option is described in the language it names, so a reader who cannot
      # read the current one can still tell the two apart.
      option_description:
        en: "The language this application is currently written in."
        es: "Spanish. The application, its pages, and its messages."
    # Not Appearance and not Language: this section changes which page opens,
    # rather than how the page is drawn.
    start_page:
      title: "Start page"
      description: "Where this browser goes after you sign in, when there is no page to return to."
      legend: "After signing in"
      hint: "The choice is remembered in this browser. Returning to your last story still only happens when you picked that story yourself; Universe Maker never chooses a story for you."
      submit: "Save start page"
    # The only section that is not a browser preference, and the only one a plain
    # reader never sees: it configures the deployment rather than this browser, so
    # it is here for an operator and absent for everyone else. The wording keeps
    # saying *platform*, because the page it lives on is otherwise entirely about
    # what this browser remembers.
    limits:
      title: "Limits"
      description: "How much of this platform one account may create. This setting belongs to the whole installation rather than to this browser, so it is stored once and read by every account."
      legend: "New universes"
      hint: "A number, or leave the field blank for no limit at all. One account may create this many universes per hour; a new installation starts at %{limit}. A universe's own change budget is set by that universe's administrators, not here."
      universe_creation_limit: "New universes per hour"
      # What a cleared field is called when a save confirms it. The reader would
      # substitute the default for a row storing `NULL`, and printing that number
      # back as what was just chosen would misreport what was stored.
      unlimited_value: "no limit"
      submit: "Save limits"
    flash:
      theme_saved: "Theme set to %{theme}."
      locale_saved: "Language set to %{language}."
      start_page_saved: "After signing in, you will go to %{start_page}."
      limit_saved: "New universes per account per hour set to %{limit}."
      theme_unknown: "Choose either the light or the dark theme."
      locale_unknown: "Choose a language this application offers."
      start_page_unknown: "Choose either your last story or the universes list."

  # The two start pages, named the way a reader would ask for them.
  start_pages:
    remember:
      label: "My last story"
      description: "Open the universe and story you were last working in."
    universes:
      label: "The universes list"
      description: "Always start from the list of universes you can open."

  # The two themes, named in the reader's own language.
  themes:
    light:
      label: "Light"
      description: "A light page with dark text."
    dark:
      label: "Dark"
      description: "A dark page with light text."

  # The attribute names this slice's own forms and error messages read.
  #
  # Rails resolves a form label and the `%{attribute}` in `errors.format` from
  # `human_attribute_name`, which falls back to a humanized English column name.
  # Naming them here is what keeps a Spanish form from reading "Name" beside a
  # Spanish error message. Only the models whose forms this workspace renders are
  # here; a model is added when the workspace that owns its form is translated.
  activerecord:
    attributes:
      universe:
        name: "Name"
        private: "Private"
        collaboration_mode: "Collaboration mode"
        # The human name of a validation's attribute, not a form label. A taken
        # address reads "Slug has already been taken" beside the Address slug
        # field that answers it.
        slug: "Slug"
      story:
        name: "Name"
        description: "Description"
        story_tropes_attributes: "Trope annotations"
        id: "Assignment ID"
        trope_slug: "Trope"
        selected: "Included"
        context_note: "Context note"
        _destroy: "Remove assignment"
      universe_membership:
        email_address: "Email address"
        access_level: "Access level"
      # The Universe Bible workspaces' own models. A form label reads the same
      # name an error message does, so a Spanish page must not render "Name"
      # beside a Spanish error about `name`. The attributes named here are the
      # ones a form label, a collection select, or an `errors.add` in these
      # workspaces actually reaches.
      character:
        name: "Name"
        pronouns: "Pronouns"
        aliases: "Aliases"
        at_a_glance: "At a glance"
        wants: "Wants"
        needs: "Needs"
        lies_to_self: "Lies about (to themselves)"
        contradictions: "Contradictions"
        under_pressure_they: "Under pressure, they"
        never: "Never"
        parent: "Parent character"
        # The collection a form's `character_tag_ids` fills, named here because a
        # draft's page prints the remembered assignment by its association: the
        # editor knows "Character tags" and has never seen the writer's name.
        character_tags: "Character tags"
        factions: "Factions"
      character_knowledge:
        when_text: "When"
        what_learned: "What they learn"
        source_character: "From whom"
        source_character_id: "From whom"
        changes_plan: "Does this change their plan?"
      faction:
        name: "Name"
        mission: "Public mission"
        actual_aims: "Actual aims"
        structure: "Structure"
        internal_divisions: "Internal divisions"
        resources: "Resources"
        would_never: "Would never"
        would_absolutely: "Would absolutely"
        faction_tags: "Faction tags"
      faction_relationship:
        name: "Name"
        description: "Description"
        from_faction: "From faction"
        to_faction: "To faction"
        from_date: "From"
        to_date: "To"
      location:
        name: "Name"
        description: "Description"
        parent: "Parent location"
        location_tags: "Location tags"
        sensory_sight: "Sensory: sight"
        sensory_sound: "Sensory: sound"
        sensory_smell: "Sensory: smell"
        sensory_taste: "Sensory: taste"
        sensory_touch: "Sensory: touch"
        layout_structure: "Layout: overall structure"
        layout_key_areas: "Layout: key areas"
        layout_pathways: "Layout: pathways"
        layout_entrances_exits: "Layout: entrances and exits"
        layout_points_of_interest: "Layout: points of interest"
        significance: "Why it matters"
        history_significant_events: "History: significant events"
        history_past_occupants: "History: past occupants"
        history_changes: "History: changes over time"
        access_controlled_by: "Control and access: who controls it"
        access_granted_how: "Control and access: how access is granted"
        access_security: "Control and access: security measures"
        access_restrictions: "Control and access: restrictions"
      route:
        name: "Name"
        description: "Description"
        from_location: "From location"
        to_location: "To location"
        from_location_id: "From location"
        to_location_id: "To location"
        distance: "Distance"
        duration: "Travel time"
      canon_rule:
        statement: "Rule"
        source: "Source passage"
        # The drafts page prints the remembered owner by association, so the label
        # says what choosing one means rather than "Story id".
        story: "Owned by"
        story_id: "Owned by"
      event:
        name: "Name"
        title: "Title"
        description: "Description"
        start_datetime: "Start date/time"
        end_datetime: "End date/time"
        # An Event is hierarchical like the other Universe Bible models, so it has
        # a parent too. Its tree submits it and the drafts page prints it.
        parent: "Parent event"
        # The three temporal references are named by the form's own labels, and
        # an `errors.add(:before_event, …)` is announced as this name.
        before_event: "Happens before"
        after_event: "Happens after"
        simultaneous_event: "Same time as"
        event_tags: "Event tags"
      item:
        name: "Name"
        description: "Description"
        what_it_does: "What it does"
        how_it_is_used: "How it is used"
        side_effects: "Side effects"
        origin: "Origin"
        value: "Value"
        cannot: "Cannot"
        constraints: "Constraints"
        history: "History"
        jargon: "Jargon"
        parent: "Parent item"
        item_tags: "Item tags"
      relation:
        name: "Name"
        description: "Description"
        relation_tags: "Relation tags"
        character1: "Character 1"
        character2: "Character 2"
        from_date: "From"
        to_date: "To"
      ownership:
        name: "Name"
        description: "Description"
        ownership_tags: "Ownership tags"
        item: "Item"
        character: "Character"
        from_date: "From"
        to_date: "To"
      # The Scene and its Scene-owned join models. The editor is rendered with a
      # model, so these are what a form label *and* an `errors.add` read; the
      # `scenes.form` labels above are the form's own copy and the two are expected
      # to say the same thing. `name` is the record's title, not a bare column
      # name, and `datetime` is the in-world point rather than a raw timestamp.
      scene:
        name: "Title"
        description: "Short description"
        section: "Section"
        datetime: "In-world time"
        pov_character: "Point of view"
        scene_tags: "Scene tags"
        scene_tropes_attributes: "Trope detections"
        id: "Assignment ID"
        trope_slug: "Trope"
        selected: "Included"
        context_note: "Context note"
        _destroy: "Remove assignment"
      # One Event a Scene depicts, with the author's own role and its order in the
      # Scene. The drafts page prints a remembered link's values through these
      # names, and the Events form labels the same two controls with them.
      scene_event:
        event: "Event"
        event_id: "Event"
        role: "Role"
      # One catalogue assignment on the Scene's Tropes tab. The drafts page prints
      # a remembered assignment's own values through these names.
      scene_trope:
        trope_slug: "Trope"
        context_note: "Context note"
      # The story-scoped models the Scenes workspace owns. A Section and the two
      # story-scoped taxonomies are grouped with `scene` rather than with the
      # Universe Bible models above, because they are named by the same workspace
      # and read by the same editors.
      #
      # **A Section has no form of its own here**, so nothing in this workspace
      # labels it — and the drafts page prints its remembered values through
      # `human_attribute_name`, which is why these entries exist at all.
      section:
        name: "Name"
        description: "Description"
        # Resolved from `parent_id` by `DraftsHelper.label_field`, so the row says
        # what the tree's own parent selector is called.
        parent: "Parent section"
        section_tags: "Section tags"
      plot:
        name: "Name"
        description: "Description"
      # An Element's `name` is its title and its `body` its content, which is what
      # the Element editor's own labels call them, and `characters` is the
      # collection the Dialogue speaker picker fills.
      scene_element:
        kind: "Element type"
        name: "Title"
        body: "Content"
        characters: "Speakers"
      scene_dialogue_turn:
        speaker: "Speaker"
        body: "Line"
        parenthetical: "Delivery note"
      # The three presence links. Each one is a statement inside a Scene rather
      # than a record with a page of its own, so each has exactly two attributes
      # worth naming: the record it points at, and the author's own free-text role.
      # The three tabs spell their labels out in `scenes.<tab>.form.*` because their
      # forms are rendered there, and these are the copies those labels are expected
      # to agree with.
      scene_character:
        character: "Character"
        role: "Role"
      scene_item:
        item: "Item"
        role: "Role"
      scene_location:
        location: "Location"
        role: "Role"
      # The eight taxonomies share one concern for the colour pair and one for
      # the parent, so a model is named once here and the tag editor's field
      # labels come from `modal_fields.*` rather than from here.
      #
      # `section_tag` and `scene_tag` are the two story-scoped members of that
      # eight, and they were the two missing until the drafts page made their
      # absence visible: their editors label themselves through `modal_fields.*`,
      # so nothing else in the application ever asked for a name.
      section_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
      scene_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
      character_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      faction_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      relation_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        symmetric: "Symmetric"
        inverse: "Inverse"
      location_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      event_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      item_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"
        show_in_menu: "Show in menu"
      ownership_tag:
        name: "Name"
        description: "Description"
        bgcolor: "Background color"
        fgcolor: "Foreground color"
        parent: "Parent tag"
        taggable: "Taggable"

  # Refusals and rate limits that are stated rather than answered with a bare
  # status code.
  errors:
    unavailable_account: "That page is not available to this account. Here are the universes you can open."
    rate_limited: "Try again later."
    # The per-universe mutation budget, which is a universe's own setting rather
    # than one rate for the application (ADR 0028). It says the budget rather
    # than the number, because the number is the universe's and this sentence is
    # shared by every value of it.
    mutation_throttled: "You are making changes too quickly for this universe. Wait a moment and try again."
    # Its own sentence for the one group with no universe in it. Universe creation is
    # refused on `POST /u`, before any universe exists, so borrowing a sentence about
    # "this universe" would name something the author is not in and has never been in
    # — and the wait is an hour's window rather than a minute's, so the same wording
    # would misdescribe how long.
    mutation_throttled_platform: "You are creating universes too quickly. Wait a moment and try again."

  # The record-type nouns, at the root of the locale on purpose.
  #
  # Every workspace already passes one of these as a bare word
  # (`count_label: "character"`, `details_count_label: "scene"`), and the shared
  # count helpers resolve that word as an I18n key with a `count:` so the plural
  # is chosen by the locale. Nesting them under a namespace would mean every one
  # of those 50-odd call sites had to name a longer key, for no gain: the key
  # *is* the record type's name, which is what `t` is for.
  entry:
    one: "entry"
    other: "entries"
  entity:
    one: "entity"
    other: "entities"
  element:
    one: "element"
    other: "elements"
  # The unit a prose counter reports, resolved with `count:` like the record-type
  # nouns above so "1 word" and "1,234 words" come from the locale.
  word:
    one: "word"
    other: "words"
  item:
    one: "item"
    other: "items"
  record:
    one: "record"
    other: "records"
  tag:
    one: "tag"
    other: "tags"
  trope:
    one: "trope"
    other: "tropes"
  character:
    one: "character"
    other: "characters"
  faction:
    one: "faction"
    other: "factions"
  faction_relationship:
    one: "faction relationship"
    other: "faction relationships"
  location:
    one: "location"
    other: "locations"
  route:
    one: "route"
    other: "routes"
  canon_rule:
    one: "rule"
    other: "rules"
  event:
    one: "event"
    other: "events"
  section:
    one: "section"
    other: "sections"
  plot:
    one: "plot"
    other: "plots"
  scene:
    one: "scene"
    other: "scenes"
  relation:
    one: "relation"
    other: "relations"
  ownership:
    one: "ownership"
    other: "ownerships"
  universe:
    one: "universe"
    other: "universes"
  story:
    one: "story"
    other: "stories"
  member:
    one: "member"
    other: "members"
  # One author's remembered changes, one of them, and one conflict one of them
  # is in. Each page passes one of these as `count_label:` beside its page
  # header's badge, so the noun beside a bare number is always a key rather than
  # a word the template pluralizes.
  draft:
    one: "draft"
    other: "drafts"
  change:
    one: "change"
    other: "changes"
  conflict:
    one: "conflict"
    other: "conflicts"
  # A submission in the reviewer's queue, for the same reason as the three above: the
  # noun beside the header's badge is a key, so the plural comes from the locale.
  request:
    one: "review request"
    other: "review requests"
  # One thing that was said to this reader, for the same reason as the four above.
  notification:
    one: "notification"
    other: "notifications"
  # One person who has changed a universe, for the same reason: the noun beside the
  # collaborators list's own badge and beside the sidebar's figure, which counts people
  # rather than the runs the history entry counts.
  collaborator:
    one: "collaborator"
    other: "collaborators"

  # The subject of a record-level error, keyed by the `model_param` a controller
  # already holds. Both browser editors print a `base` message as a sentence
  # about the record ("the event must have a title…"), and the client cannot
  # turn that parameter into a noun — `scene_element` is a form field name, not a
  # word — so the server sends this instead.
  #
  # English supplies the determiner in the phrase; a language that does not
  # supplies it in the phrase too, which is why these are whole phrases rather
  # than bare nouns. See `shared.error_summary.heading` for the same decision on
  # the server-rendered summary.
  record_subject:
    canon_rule: "the canon rule"
    character: "the character"
    faction: "the faction"
    faction_relationship: "the faction relationship"
    event: "the event"
    item: "the item"
    ownership: "the ownership"
    plot: "the plot"
    relation: "the relation"
    route: "the route"
    scene_character: "the scene character"
    scene_element: "the scene element"
    scene_event: "the scene event"
    scene_item: "the scene item"
    scene_location: "the scene location"
    scene_trope: "the trope annotation"

  # The taxonomy tree's own empty state, keyed by the `model_param` a caller
  # passes. The tree needs the *taxonomy's* name there ("No relation tags yet"),
  # which is not the `count_label` a caller passes ("tag"), so it cannot be
  # derived from it and is translated from the model param instead.
  taxonomies:
    character_tag:
      none_yet: "No character tags yet"
    faction_tag:
      none_yet: "No faction tags yet"
    relation_tag:
      none_yet: "No relation tags yet"
    location_tag:
      none_yet: "No location tags yet"
    event_tag:
      none_yet: "No event tags yet"
    item_tag:
      none_yet: "No item tags yet"
    ownership_tag:
      none_yet: "No ownership tags yet"
    section_tag:
      none_yet: "No section tags yet"
    scene_tag:
      none_yet: "No scene tags yet"
    section:
      none_yet: "No sections yet"
    location:
      none_yet: "No locations yet"
