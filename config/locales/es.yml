    # que lee un mensaje de error, y se espera que las dos digan lo mismo.
    form:
      name: "Nombre"
      description: "Descripción"
      tags_label: "Etiquetas de personajes"
    empty_title: "Todavía no hay personajes"
    # La lista tiene dos estados vacíos porque tiene dos audiencias, igual que
    # las listas de universos e historias: a quien puede escribir se le dice que
    # añada el primer registro, y a un visitante o a un miembro de solo lectura se
    # le dice que los registros pertenecen al universo.
    empty_writable_description: "Los personajes pertenecen al universo y los comparten todas sus historias. Añade el primero para empezar."
    empty_read_only_description: "Los personajes pertenecen al universo y los comparten todas sus historias."
    show:
