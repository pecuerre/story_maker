      bound:
        start: "inicio"
        end: "fin"
      discarded:
        section: "Se ha ignorado el filtro de sección porque no es una sección de esta historia."
        scene_tag: "Se ha ignorado el filtro de etiqueta de escena porque no es una etiqueta de escena de esta historia."
        date: "No se ha podido leer la fecha de %{bound} en el mundo «%{value}», así que se ha ignorado."
    show:
      description: "Escena %{position} de %{total} en el orden en que se cuenta %{story}. El orden narrativo no es la cronología en el mundo."
      all_scenes: "Todas las escenas"
      facts:
        title: "Título"
        narrative_position: "Posición narrativa"
        # La posición y el total que la acompañan, sin palabras propias.
        position: "%{position} de %{total}"
        description: "Descripción breve"
        description_blank: "Todavía no hay descripción breve."
        tags: "Etiquetas de escena"
        tags_blank: "Todavía no hay etiquetas de escena asignadas."
        tags_hint: "Las etiquetas son opcionales y pertenecen a esta historia."
        # Dos avisos con un enlace dentro, así que son claves `_html` y el enlace es
        # la interpolación: la frase decide dónde va el enlace. El *texto* del enlace
        # sigue siendo su propia clave, porque quien traduce sigue necesitando saber
        # cómo se llama el enlace al elegir dónde ponerlo.
        tags_hint_editor_html: "Cámbialas desde el %{editor}."
        tags_hint_workspace_html: "La taxonomía está disponible en el %{workspace}."
        editor_link: "editor de escenas"
        workspace_link: "espacio de trabajo de Etiquetas de escenas"
        section_group: "Grupo de sección"
        section_blank: "Sin agrupar. Una Sección es opcional y solo organiza esta escena; no cambia su posición narrativa."
        event: "Suceso en el mundo"
        # `%{event}` es `Event#display_label`, la etiqueta propia del registro en el
        # idioma del lector. Su título y sus fechas son dato, así que se interpolan
        # y nunca se traducen; una frase propia suya resuelve su clave.
        event_html: "%{event}: consulta el %{workspace}. Varias escenas pueden representar el mismo suceso."
        event_workspace: "espacio de trabajo de Sucesos"
        event_blank: "Todavía no hay ningún suceso enlazado."
        in_world_time: "Tiempo en el mundo"
        in_world_time_blank: "Todavía no hay tiempo en el mundo definido."
        in_world_time_hint: "Este es el orden en el tiempo del mundo, que se mantiene separado de la posición narrativa de arriba. El suceso y el tiempo en el mundo son valores independientes; ninguno se deduce del otro y aquí no se detecta ninguna discrepancia entre ellos."
        story: "Historia"
      tabs:
        # Las cuatro pestañas del espacio de trabajo, que son URL reales y no paneles
        # dentro del mismo documento. Las otras tres son los títulos de los espacios
        # de trabajo hermanos.
        aria_label: "Espacio de trabajo de la escena"
        details: "Detalles de la escena"
    form:
      name: "Título"
      name_hint: "El título de la escena en el orden narrativo. Solo hace falta un título."
      description: "Descripción breve"
      description_hint: "Un resumen opcional de una línea que se muestra en la lista de escenas."
      tags_legend: "Etiquetas de escena"
      tags_label: "Etiquetas de escena"
      tags_hint: "Opcional. Asigna las etiquetas que describan esta escena. Las etiquetas pertenecen a esta historia y se pueden gestionar en Configuración → Etiquetas → Etiquetas de historia → Etiquetas de escenas."
      tags_empty: "Todavía no hay etiquetas de escena definidas para esta historia."
      manage_tags: "Gestionar etiquetas de escena"
      organization_legend: "Organización"
      section: "Sección"
      section_hint: "Opcional. Una Sección agrupa esta escena, por ejemplo bajo un libro, un capítulo, una temporada o un episodio. La agrupación solo cambia la organización: nunca cambia la posición narrativa de esta escena, y una Sección anidada también sitúa la escena dentro de la ruta de sus ancestros."
      in_world_time_legend: "Tiempo en el mundo"
      event: "Suceso"
      event_hint: "Opcional. Enlaza esta escena con un suceso compartido del universo. Varias escenas pueden referirse al mismo suceso, y nada más en este formulario cambia cuando eliges uno."
      # La opción de suceso en blanco lee el `shared.none` compartido, así que no se
      # repite aquí.
      datetime: "Tiempo en el mundo"
      datetime_hint: "Opcional. Un único punto en el tiempo de la historia, almacenado con la misma precisión y sin zona horaria que las fechas de los sucesos. Es independiente del suceso de arriba: elegir o limpiar uno nunca escribe, limpia ni comprueba el otro, así que puedes mantenerlos distintos a propósito."
      # `%{move_up}`/`%{move_down}` son los nombres traducidos de los controles de la
      # lista, así que esta frase nombra los controles que el lector encontrará de
