  # etiqueta aquí es la cadena que imprime el modal construido con DOM, y los
  # mismos ayudantes alimentan los modales que renderiza el servidor. Los
  # descriptores guardan una *clave* y no una cadena ya traducida —`PHOTO_FIELD` es
