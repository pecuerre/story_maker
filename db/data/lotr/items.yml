- universe: Universe.lotr
  name: "Ring of Barahir"
  slug: "ring_of_barahir"
  summary: "The heirloom Ring of Barahir passed down to Aragorn."
  description: |
    The heirloom Ring of Barahir passed down to Aragorn.

    ## Origin

    Given to Barahir by Finrod Felagund.

    ## Value

    A token of an old oath rather than a price.

