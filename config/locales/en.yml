# Every user-facing string in the application chrome. Keys are grouped by the
# surface that owns the string, not by a flat global list, so a page and its
# translations live together and a surface can be moved without renumbering the
# rest. See ADR 0016.
#
# Author-entered data is not here and must never be added: record names,
# descriptions, tag names, and universe or story names are data, and a
# translation layer that rewrote them would be corrupting the author's work.
en:
  # A reader's own API credentials for one universe: list them and revoke any
  # one of them. The bearer value is shown once at creation and never stored.
  api_tokens:
    index:
      title: "API tokens"
      description: "The bearer tokens this account holds for this universe. Revoking a token retires it forever: its bearer value was shown once and is never stored again."
      back: "Back to the universe"
      columns:
        name: "Name"
        prefix: "Prefix"
        status: "Status"
        last_used: "Last used"
        actions: "Actions"
      status:
        active: "Active"
        revoked: "Revoked"
      revoke: "Revoke token"
      revoke_confirm: 'Revoke "%{name}"? It can no longer call the API.'
      empty: "This account has no API tokens for this universe."
    flash:
      revoked: "API token revoked."
  app:
    name: "Universe Maker"

  # The application layout: the document shell, the top bar's own strings, and
  # the access notice the workspace shows a read-only member or a guest.
  layouts:
    skip_to_content: "Skip to main content"
    primary_navigation: "Primary navigation"
    toggle_navigation: "Toggle navigation"
    workspace_navigation: "Workspace navigation"
    close_navigation: "Close navigation"
    close_tools: "Close tools"
    universe_tools: "Universe tools"
    menu: "Menu"
    tools: "Tools"
    account: "Account"
    log_in: "Log in"
    log_out: "Log out"
    settings: "Settings"
    read_only: "read-only"
    scope:
      universe: "Universe:"
      story: "Story:"
    # The two access notices contain markup — a `strong` and a link — so they
    # are `_html` keys and are rendered with the `html_safe` helper.
    read_only_notice_html: "You have %{emphasis} access to this universe."
    guest_notice_html: "You are viewing this public universe as a guest. %{login_link} to contribute."

  # The left column: the universe/story navigation.
  sidebar:
    current_universe: "Current universe"
    current_story: "Current story"
    none_selected: "None selected"
    navigation_label: "Universe and story navigation"
    universe_bible: "Universe Bible"
    story_workspace: "Story workspace"
    story_overview: "Story overview"
    characters: "Characters"
    factions: "Factions"
    locations: "Locations"
    routes: "Routes"
    canon: "Canon"
    map: "Map"
    events: "Events"
    timeline: "Timeline"
    items: "Items"
    sections: "Sections"
    plots: "Plots"
    scenes: "Scenes"
    scene_board: "Scene board"
    scene_matrix: "Scene matrix"
    appearances: "Appearances"
    narrative_order: "Narrative order"
    export: "Export"
    all_stories: "All stories"
    select_story_hint: "Select a story to work on its sections, plot arcs, and scenes."
    # The right column: universe configuration and the reserved tool areas.
    tools:
      navigation_label: "Universe configuration and tools"
      eyebrow: "Universe tools"
      intro: "The inspector below shows what the page in front of you is about: a story's sections and scenes, and a record's relations and ownerships."
      configuration: "Configuration"
      tags: "Tags"
      members: "Members"
      collaboration: "Collaboration"
      # The one live entry in the Collaboration group. It points at the reader's
      # own remembered changes, and it is offered only where such a thing can
      # exist: a `direct` universe never opens a draft, and a draft belongs to a
      # person rather than to a visitor.
      pending_changes: "Pending changes"
      # The reviewer's queue, offered on `admin` alone because that is the whole of
      # `ReviewRequestsController`'s authorization. Its pill counts what is waiting,
      # not what the queue holds, so it is zero rather than absent once everything
      # has been decided.
      review_requests: "Review requests"
      # What has happened in this universe. Gated on `admin` and on `draft_based?`:
      # the page names every author who has closed a draft, and a `direct` universe
      # has no runs to list.
      history: "Change history"
      # Who has done any of it, which is the change history read per person. Gated on
      # `admin` and on `draft_based?` like the history beside it: it names every author
      # who has closed a draft, and a `direct` universe has none.
      collaborators: "Collaborators"
      # The inspector shows page-relevant details beside Configuration and
      # Collaboration — the selected story's sections and scenes, and a selected
      # record's relations and ownerships — at most five rows and nothing at all
      # when the page has nothing useful to say. It replaces the Analytics and AI
      # placeholders, which had no model or route behind them.
      inspector: "Inspector"

  # Page-relevant details the right utility sidebar shows beside Configuration
  # and Collaboration. Each label names what its value counts.
  inspector:
    sections: "Sections"
    plots: "Plots"
    scenes: "Scenes"
    relations: "Relations"
    ownerships: "Ownerships"

  # The access level a reader has in a universe, as a details page states it.
  universe_access:
    admin: "Admin"
    contributor: "Contributor"
    read_only: "Read-only"
    none: "No access"
    public_read_only: "Public read-only"

  # Partials shared by every workspace.
  shared:
    count:
      # A count and the record type it counts. `label` is already the pluralized
      # record type, resolved by `ApplicationHelper#count_with_label`.
      with_count: "%{count} %{label}"
    # The scope a page's header announces above its title. The Sections tree, the
    # Scenes list, and the two story taxonomies state the same two scopes, so
    # they are one pair of keys rather than one copy per surface.
    eyebrow:
      story: "Story: %{story}"
      scene: "Scene: %{scene}"
    # The narrative-position badge, announced by the Scenes list, a Section's own
    # scene list, and the "Appears in scenes" section. The long form names the
    # Story's total beside the position; the short form is used where the list is
    # already known to be one Scene's subset.
    scene_position_aria: "Narrative position %{position} of %{total}"
    scene_position_aria_short: "Narrative position %{position}"
    detail_fact:
      blank: "Not set yet."
    in_world_range:
      empty: "No dates set yet."
      from: "From %{date}"
      until: "Until %{date}"
    record_details_link:
      text: "Details"
      aria: "Details for %{name}"
    record_photo:
      alt: "Photo of %{name}"
    # The prose mention mark. A mention is a name written in an Element body, not
    # a recorded appearance, so the suggestion note says what the dashed link is
    # not: a fact about presence.
    mention:
      suggested_title: "Mentioned in the prose, but not recorded as present in this scene"
      suggested_note: "(not recorded as present)"
    error_summary:
      # `count` is pluralized by the key: one error reads differently from many.
      # `subject` is the phrase that follows the sentence's own "this", so it
      # carries no article of its own in English. A locale whose sentence has no
      # determiner to supply one — Spanish — passes a full phrase instead, because
      # a bare noun there would need an article the key cannot know.
      heading:
        one: "1 error prevented this %{subject} from being saved:"
        other: "%{count} errors prevented this %{subject} from being saved:"
    # The validation messages the four shared concerns raise, so a workspace
    # does not repeat a rule its own model inherited. Each is the tail of
    # `errors.format` ("%{attribute} %{message}"), so each starts lowercase.
    #
    # The two concerns that check a scope — `Hierarchical`'s parent and
    # `HasManyTags`' assignment rows — say the same thing about a different
    # owner, so the scope is its own sentence rather than a frame with the
    # scope's word spliced into it: a locale that contracts or genders its
    # determiner with the noun cannot be handed a frame. This is the same
    # decision `tags.show.scope_universe_description` makes beside it.
    errors:
      same_scope:
        universe: "must belong to the same universe"
        story: "must belong to the same story"
        draft: "must belong to the same draft"
      # `TemporalInterval`'s one rule, shared by the three models that record a
      # span: an Event's datetimes and a Relation's or Ownership's dates. An absent
      # end is an open interval and is allowed; this sentence only says that a range
      # with both ends cannot end before it starts.
      interval:
        must_not_be_reversed: "must not be before the date it starts"
      hierarchy:
        scope_change_with_children: "cannot be changed while child records exist"
        must_exist: "does not exist"
        cannot_be_itself: "cannot be itself"
        cannot_be_descendant: "cannot be a descendant"
      # A polymorphic reference — one `record_type`/`record_id` pair naming any
      # content record — reports a type or id that resolves to nothing. It keeps
      # its own key because it is not a hierarchy's `parent_id`, and the
      # wrong-scope case for the same pair is the `same_scope` sentence above.
      reference:
        must_exist: "does not exist"
      tagged_records:
        scope_change_with_tags: "cannot be changed while tagged records exist"
      color:
        must_be_hex: "must be a hex color like #d3d3d3"
      photo:
        needs_universe_record: "needs a record that belongs to a universe"
        must_be_attached: "must be attached"
    flash:
      close: "Close"
    photo_field:
      default_label: "Photo"
      # The strings the photo editor's own controller reads. The editor is built
      # entirely in the browser, so every word it shows is one of these; the
      # widget is one implementation shared by all three page patterns, so one
      # list serves all three rather than three copies.
      hint: "A photo is always square. Choose an image, then move it inside the square to choose what to keep."
      remove: "Remove the current photo"
      stage_aria: "Photo crop area. Arrow keys move the image, plus and minus zoom it."
      zoom: "Zoom"
      zoom_aria: "Zoom the photo"
      accept: "Use this photo"
      move_group_aria: "Move the photo inside the square"
      move_left: "Move left"
      move_up: "Move up"
      move_down: "Move down"
      move_right: "Move right"
      reading: "Reading the photo…"
      unreadable: "That file could not be read as an image. Try a JPEG, PNG, WebP, or GIF."
      # `action` is the **button's own key** interpolated into the sentence that
      # tells the author to press it, for the same reason a sentence carrying a
      # link carries the link: a translator deciding where the reference sits
      # still needs to know what the control is called, and the control's name is
      # a key in its own right because the button prints it too.
      ready: "Square ready. Move the photo, then choose %{action}."
      chosen: "Photo chosen. Save the form to keep it."
      discarded: "Photo discarded."
      removing: "The photo will be removed when you save."
    # The two sentences both editors use to print a server error message. They
    # are frames, not copy: `subject` and `label` arrive already resolved, and a
    # locale that needs a determiner puts it in the subject (see
    # `record_subject.*` and `shared.taxonomy_tree.record_subject`). Both read
    # identically in the two locales because every word in them comes from
    # elsewhere — which is the point of making them keys rather than the English
    # the controllers used to assemble.
    record_error: "%{subject} %{message}"
    record_message: "%{label} %{message}"
    # The flat-list modal's own status line and error copy. One namespace for
    # both editors' shared frames, and one for the messages only this editor
    # shows, because a reader who saves a character and moves a scene is reading
    # the same editor and expects its words to be the same words.
    modal_form:
      saving: "Saving…"
      saved_refresh: "Saved. Refreshing the list…"
      save_failed: "The change could not be saved."
      unsent: "The change could not be sent. Check your connection and try again."
      deleting: "Deleting…"
      deleted_refresh: "Deleted. Refreshing the list…"
      delete_failed: "The record could not be deleted."
      delete_unsent: "The record could not be deleted: the request could not be sent. Check your connection and try again."
      gone_refresh: "That record no longer exists. Refreshing the list…"
      # "up"/"down" are the values a `data-modal-form-direction` attribute
      # carries, so they are never translated; the two sentences that mention
      # them are two keys rather than one frame with a spliced word, because a
      # locale that orders the adverb differently would have to rewrite the
      # frame to place it.
      moving_up: "Moving up…"
      moving_down: "Moving down…"
      moved_refresh: "Moved. Refreshing the list…"
      move_failed: "The row could not be moved."
      move_unsent: "The row could not be moved: the request could not be sent. Check your connection and try again."
      gone_row_refresh: "That row no longer exists. Refreshing the list…"
      unexplained: "The server rejected the change but did not explain why. Nothing was saved."
      fix_and_retry: "The change could not be saved. Fix the following and try again."
      # The three refusals the mutation contract can answer with, appended to the
      # caller's own sentence so the reader is told both what failed and why.
      forbidden: "You are no longer allowed to do that; reload the page and sign in again."
      rejected: "The server rejected the value."
      # The universe's mutation budget (ADR 0028). The server answers a throttled
      # JSON mutation with a bare 429 and no body, so this sentence is the only
      # account of what happened; it says to wait rather than to fix anything,
      # because nothing about the record the author typed is wrong.
      throttled: "You are making changes too quickly for this universe. Wait a moment and try again."
      server_error: "The server could not complete the request. Nothing was changed; try again."
      http_status: "(HTTP %{status})"
    # The blank option that clears an optional reference. Both the Events form's
    # three temporal references and the Scene form's event link read it, so the
    # word has one home rather than one per form.
    none: "None"
    include_descendants_toggle:
      label: "Include records from child tags"
    child_tags:
      empty_title: "No child tags"
      empty_description: "This grouping tag has no child tags yet."
      unused_description: "Nothing uses this child tag yet."
    detail_section:
      # `label` is a record-type key resolved with `count: 1`, so the sentence
      # reads "No character carries this tag" and not "No character carry…" — the
      # slot takes a **singular** noun, because a plural cannot follow this verb
      # in either language.
      #
      # `determiner` is a second interpolation because a language that agrees in
      # gender cannot derive "una sección" from the word `sección` any more than it
      # can derive the plural from it. The caller states its record type's
      # determiner beside the noun, the same way it states the noun; the two
      # English values are identical because English has no such agreement.
      empty_title: "%{determiner} %{label} carries this tag"
      determiners:
        none_masculine: "No"
        none_feminine: "No"
    menu_tag_content_tabs:
      aria_label: "%{type} workspace"
    tag_workspace_navigation:
      scope_aria_label: "Tag scope"
      story_aria_label: "Story tag workspace"
      universe_aria_label: "Universe tag workspace"
    taxonomy_tree:
      hint: "Use the row menu for Add child, Insert before/after, Move up/Move down, Edit, and Delete. Inline rename is available by clicking the name itself. Drag rows when you want a visual reorder; dropping near the top or bottom nests a row as a child."
      empty_description: "Create the first one to start building this hierarchy."
      read_only_empty_description: "There is nothing here to show yet."
      # The strings the tree's own controller reads. The tree renders the
      # server-side rows, but its inline create and rename rows, its editor
      # modal, and its status line are built in the browser, so those words are
      # here rather than in the partial.
      new_name: "New name"
      save: "Save"
      save_changes: "Save changes"
      edit_title: "Edit %{name}"
      # The hidden text a required field carries beside its visible asterisk. The
      # asterisk itself is not a key: it is a typographic marker the stylesheet
      # draws, not a word, and it is the same mark in every language.
      required: " (required)"
      delete_confirm: "Delete %{name} and its children?"
      insert_at: "Insert item at position %{position}"
      # The one sentence a tag's color pair is judged by, shown under the two
      # color controls while the author picks them. It warns and does not block:
      # the pair is the author's data, the badge shape still names the tag, and
      # the save button works whatever this sentence says.
      low_contrast_colors: "This text and background are hard to read: %{ratio}:1. Body text needs %{minimum}:1. You can still save the tag."
      # The subject of a record-level error, for a tree that edits eight
      # different taxonomies and therefore cannot name one of them. It is the
      # same generic word the tree's own status line already uses ("The item
      # could not be created."), so a reader is not told "the item" by one
      # message and "this entry" by the next one.
      record_subject: "the item"
      create_failed: "The item could not be created."
      rename_failed: "The name could not be saved."
      update_failed: "The changes could not be saved."
      delete_failed: "The item could not be deleted."
      move_failed: "The item could not be moved."
      network_failed: "The network request failed. Please try again."
      invalid_response: "The server returned an invalid response."
      saved_refresh: "Saved. Refreshing the taxonomy…"
      # The search area the shared tree renders on every tree workspace. The
      # workspaces pass their own tag choices and the selected tag's name when
      # they have a tag filter; everything else here is shared, because the
      # control means the same thing on every tree.
      filter:
        title: "Filter the list"
        description: "Narrow the list by text or by a tag. Filtering only changes what this page shows; it does not change any record."
        search_label: "Search"
        search_placeholder: "Name or description"
        tag_label: "Tag"
        all_tags: "All tags"
        submit: "Filter"
        clear: "Clear filters"
        showing: "Showing %{shown} of %{total}."
        filtered_by: "Filtered by"
        summaries:
          search: "Search: “%{value}”"
          tag: "Tag: %{value}"
        # A list that matched nothing is not an empty taxonomy: say what the
        # filters did, and offer the way back.
        no_match_title: "Nothing matches these filters"
        no_match_description: "%{count} in this universe, but none of them match the filters above."
    taxonomy_node:
      rename: "Rename %{name}"
      add_child: "Add child"
      insert_before: "Insert before"
      insert_after: "Insert after"
      move_up: "Move up"
      move_down: "Move down"
      # The parent a node sits under, shown beside the node's name so a reader
      # can see where a record sits in the hierarchy at a glance.
      parent: "in %{name}"
    row_actions:
      actions_for: "Actions for %{name}"
      edit: "Edit"
      delete: "Delete"
      edit_title: "Edit %{label}"
      delete_confirm: "Delete %{name}?"
    # The two strings every form and every modal in the application shares: the
    # button that abandons an edit, and the icon button that closes a modal. They
    # are one key each rather than one per workspace, because a reader who reads
    # "Cancel" on the universe form and "Cancel" on the Characters form has read
    # the same word twice and expects it to be one word.
    form:
      cancel: "Cancel"
      close: "Close"

  # The universes workspace: the list of worlds, one universe's own page, and
  # the create/edit forms it shares with the stories workspace.
  #
  # The button labels and the page titles are the same string, so one key serves
  # both the `content_for :title` and the `h1` — a reader who follows "New
  # universe" expects the page it opens to be called that too.
  universes:
    title: "Universes"
    description: "Choose a world to work in. Each universe contains its own stories and shared world-building records."
    new: "New universe"
    new_description: "Create a world that will contain its own stories and shared world-building records."
    edit: "Edit universe"
    # The browser tab names the record being edited; the page below it keeps the
    # workspace's own "Edit universe" title.
    edit_document_title: "Edit %{name}"
    edit_description: "Update the name, visibility, collaboration mode, and change limit of this universe."
    open: "Open universe"
    manage_members: "Manage members"
    delete: "Delete universe"
    delete_confirm: "Delete %{name} and all of its content?"
    columns:
      universe: "Universe"
      contents: "Contents"
      activity: "Activity"
      visibility: "Visibility"
      actions: "Actions"
    activity:
      ago: "%{time} ago"
    visibility:
      private: "Private"
      public: "Public"
    empty:
      # The list has two empty states because it has two audiences: someone who
      # can create a universe is told to create one, and a guest is told to wait.
      owner_title: "Create your first universe"
      owner_description: "A universe holds the world, characters, locations, events, and items shared by its stories."
      guest_title: "No public universes yet"
      guest_description: "Sign in to create a universe, or check back when a public universe is available."
    form:
      name: "Name"
      slug: "Address slug"
      slug_hint: "Leave this blank to build the address from the name."
      slug_hint_current: "Leave this blank to keep /u/%{slug}. A new name rebuilds the address from the name."
      private: "Private universe"
      private_hint: "Public universes can be read by guests and contributed to by signed-in users. Private universes are visible only to their members."
      # Each option label carries its own one-line meaning, because the three
      # modes are told apart by what happens to a change and the reader should not
      # have to choose one to find out. The hint says who may change the mode.
      collaboration_mode_hint: "How changes are made here. Only the owner and the universe's administrators can change this."
      collaboration_modes:
        direct: "Direct — a change is saved straight away"
        wikipedia: "Wikipedia — a change is remembered until its author applies it"
        github: "GitHub — a change is remembered until an owner or administrator reviews it"
      # The budget the throttle reads, described the way an admin thinks about it:
      # one account, one universe, per minute. The number is interpolated from the
      # constant so this sentence cannot outlive the default it states, and a blank
      # field is the answer "no limit", which is stored as NULL.
      mutation_limit: "Changes per minute"
      mutation_limit_hint: "How many changes one account may make here per minute, across every workspace in this universe. Leave blank for no limit; a new universe starts at %{limit}."
      # The three per-group sub-limits, in the order `MUTATION_GROUP_COLUMNS` lists
      # them and rendered by a loop over it — so each label and hint is named after
      # its column, and a fourth group arrives with the other two strings beside it.
      # Each ceiling answers a different question, so each says what its own group
      # is for rather than repeating the overall budget's sentence: one is about the
      # work an upload costs, one is about handing out reach, one is about a reply
      # being more than a single row.
      photo_mutation_limit: "Photo uploads per minute"
      photo_mutation_limit_hint: "How many photos one account may upload here per minute. Uploading counts separately because cropping an image is real work; these changes also count towards Changes per minute. Leave blank for no limit; a new universe starts at %{limit}."
      membership_mutation_limit: "Access changes per minute"
      membership_mutation_limit_hint: "How many times one account may grant, change, or remove someone's access here per minute. These changes also count towards Changes per minute. Leave blank for no limit; a new universe starts at %{limit}."
      discussion_mutation_limit: "Discussion replies per minute"
      discussion_mutation_limit_hint: "How many discussion replies one account may post here per minute, because a reply also writes the notification its conversation receives. These changes also count towards Changes per minute. Leave blank for no limit; a new universe starts at %{limit}."
      # The default submit label comes from Rails' own `helpers.submit.*`, which
      # is English only, so the label is named here rather than inherited.
      submit_create: "Create Universe"
      submit_update: "Update Universe"
    show:
      eyebrow: "Universe"
      description: "The shared world and story collection for this workspace."
      new_story: "New story"
      actions_aria: "Universe actions"
      stories_eyebrow: "Stories"
      current_badge: "Current"
      open_story: "Open"
      open_story_aria: "Open %{name}"
      empty_title: "No stories yet"
      empty_writable_description: "A story holds the plot, sections, and scenes of this universe while sharing its world. Create the first one from the New story action above."
      empty_read_only_description: "This universe has no stories to show yet."
      # The four quick links and the eyebrow are the sidebar's own navigation
      # labels, so they are read from `sidebar.*` rather than repeated here.
      bible_heading: "Shared world"
      bible_description: "Characters, places, events, items, and their relationships live at universe scope."
    # The JSON-shaped detail partial still renders a labelled value.
    detail:
      name: "Name:"
    flash:
      created: "Universe was successfully created."
      updated: "Universe was successfully updated."
      deleted: "Universe was successfully deleted."

  # The stories workspace, which shares the universe's own page as its picker.
  # Every record's conversation. The thread is the fourth page shape: a
  # guest-readable read of an append-only list, with a composer rendered only for
  # a reader who may write.
  discussions:
    control:
      # Two controls, because the two states are different requests. A record that
      # already has a thread links to it — a GET is not a write — and only a record
      # without one offers the button that asks for it.
      open: "Discussion"
      start: "Discuss"
    show:
      eyebrow: "Discussion"
      description: "What has been said about this record. Everyone who can read it can read this."
      heading: "Messages"
      back_label: "Back to the record"
      participation_label: "Scene participation"
      empty_title: "No messages yet"
      # Two empty states, because the thread has two audiences. A writer is
      # invited to start the conversation; a guest or a read-only member has no
      # composer at all, so telling them to be the first to say something names
      # an action the page does not offer them. Same rule as every list's
      # `empty_writable_description` / `empty_read_only_description` pair.
      empty_writable_description: "This discussion has not been started. Be the first to say something."
      empty_read_only_description: "Messages about this record will appear here once they have been written."
    composer:
      label: "Message"
      submit: "Post message"
    # The subject the error summary names a refused message by. A locale supplies
    # the whole phrase, because "this message" and "este mensaje" are not the same
    # words in the same order.
    message_subject: "this message"
    flash:
      message_created: "Your message was posted."

  drafts:
    # The workflow's own words. `statuses` is the stored `Draft::STATUSES` read as
    # a sentence rather than as a column value, so a draft's history is named the
    # same way wherever it is shown; `actions` is the stored `action` of a change,
    # in its own tense because a remembered change is a *pending* one.
    statuses:
      draft: "Draft"
      applied: "Applied"
      discarded: "Discarded"
      submitted: "Submitted"
    actions:
      create: "Create"
      update: "Update"
      delete: "Delete"
    # The five record types a change can name that are not search documents, so
    # `searches.kinds` deliberately does not name them. They are lower-case nouns
    # because the sentence above them reads "New %{kind}".
    kinds:
      scene_character: "scene character"
      scene_item: "scene item"
      scene_location: "scene location"
      scene_event: "scene event"
      scene_trope: "trope annotation"
      unknown: "record"
    # The two virtual photo writers as a row states them. `photo_data` is a `data:`
    # URL and `remove_photo` is a boolean, so neither can be printed as it is
    # stored; the author's intent is stated instead.
    attributes:
      photo: "a new photo"
      photo_removed: "the photo removed"
      # The two **labels** those two values are printed under, and the one for a
      # position. `DraftsHelper::SHARED_LABEL_KEYS` resolves these three, so a
      # remembered change labels its photo and its position the same way whatever
      # model it is about.
      photo_label: "Photo"
      position: "Position"
      tropes_none: "No tropes selected"
    # One remembered change's own control on a draft that has not been applied. It
    # removes the change rather than marking it, so the confirmation says what is
    # lost and what is not: the rest of the draft still applies.
    changes:
      drop: "Drop this change"
      drop_confirm: "Drop this change? It will not be written, and the rest of your draft is left as it is."
    flash:
      # The one sentence the HTML workspaces say when a universe remembers a
      # change instead of writing it. It says the change was *remembered*, never
      # that the record was saved, because nothing was: the author is looking at
      # the same page, and a "created" flash would be a lie about the universe.
      remembered: "Your change was remembered. It is not live until you apply it."
      # What an apply did. A draft applied whole and a draft where some changes
      # could not be written are different sentences because they are different
      # outcomes, and the second one says where the changes still are rather than
      # implying they are gone.
      applied:
        one: "%{count} remembered change is now live."
        other: "%{count} remembered changes are now live."
      partially_applied: "%{applied} changes are now live. %{skipped} could not be applied: the records they name have changed since you remembered them, or the universe refused the write. This draft is closed, and those changes are still listed on it."
      # What the author chose to leave alone. It is a separate sentence added to
      # the progress one rather than a count inside it, because a change dropped
      # on purpose was not skipped: it is not in `skipped`, it does not make the
      # apply partial, and folding it into either count would say the apply
      # failed when the author simply decided.
      kept_theirs:
        one: "1 change was left exactly as it is now, because you chose theirs."
        other: "%{count} changes were left exactly as they are now, because you chose theirs."
      # What dropping one change did, and what it did not do: the rest of the draft
      # is still waiting, which is the sentence an author needs when they reached
      # this control to rescue a draft they thought was stuck.
      change_dropped:
        zero: "The change was dropped. Nothing is waiting on this draft now."
        one: "The change was dropped. 1 remembered change is still waiting on this draft."
        other: "The change was dropped. %{count} remembered changes are still waiting on this draft."
      # A submitted draft refuses the per-change drop, for the same reason it refuses
      # a new change: the reviewer is reading a set that the author must not change
      # underneath them. Withdrawing the whole draft is the way out, and a rejection
      # hands it back to be edited.
      change_locked_for_review: "That draft is with a reviewer, so this change was not dropped. Withdraw the draft from its page if you want to remove it, or wait for a decision."
      discarded: "The draft was discarded. Nothing was written."
      closed: "That draft has already been applied or discarded, so there is nothing left to do with it."
      # The other mode's answer, refused by the action rather than only hidden by
      # the view. One sentence for both directions because they are the same fact
      # seen from two pages: this universe does not do that, and the draft's own
      # page — which is where the redirect lands — carries the control it does offer.
      wrong_mode: "This universe does not work that way, so nothing was done. The page you are on has the control it uses."
      # A submitted draft is open, so both of the controls on its page would be
      # refused, and neither "apply" nor "discard" describes its state.
      waiting_for_review: "That draft is waiting for a reviewer, so there is nothing left to submit or apply."
      # What a handover did. It says nothing was written, because a submission is
      # the opposite of an apply and the two flashes must not read alike.
      submitted: "Your draft was submitted for review. Nothing was written."
      # The editing session. Starting says what the session *is* — a claim that
      # opens the draft, not a switch that decides whether a change is written —
      # because that is the one thing the control would otherwise leave an author
      # guessing. Stopping names what is still waiting, so a release is never read
      # as a loss.
      editing_started: "You are editing this universe. Changes you make are remembered until you apply them."
      # **What a start found.** Entering an editing session either opens a draft or
      # picks up the one this author already has open here, and the reader is told
      # which: a draft is one line of work per author per universe (ADR 0027), so a
      # second start is a return to the earlier work rather than a second line of
      # it. It is the same question the stop's sentence answers, so it carries the
      # same count.
      editing_resumed:
        zero: "You already had a draft open here. It is still yours, and this session picked it back up."
        one: "You already had a draft open here with 1 remembered change on it. This session picked that same draft back up rather than starting another."
        other: "You already had a draft open here with %{count} remembered changes on it. This session picked that same draft back up rather than starting another."
      editing_stopped:
        zero: "Editing stopped. Nothing was waiting on your draft."
        one: "Editing stopped. 1 remembered change is still waiting on your draft."
        other: "Editing stopped. %{count} remembered changes are still waiting on your draft."
      # Answering a toggle posted from a stale page in a universe that writes
      # straight through: there was never an editing session to stop.
      not_draft_based: "This universe writes changes straight through, so there is no editing session to start or stop."
    # The one sentence for a change that was refused rather than remembered, and it is
    # read by **both** response shapes the remembering path speaks: it is the flash on
    # an HTML workspace's redirect and the `base` message a JSON editor prints in its
    # error summary. It is a key of its own rather than one under `flash` because it is
    # neither a flash about something that happened nor one about something that did
    # not — nothing was written, but nothing was refused either; the change simply
    # cannot be made while a reviewer has the draft. It names what is waiting and where
    # the way out of it is, because the one control that clears this state is
    # **Discard** on the draft's own page, and an author told only "not now" has to go
    # looking for it.
    submission_in_flight: "Your draft is with a reviewer, so this change was not remembered. A submitted draft cannot be edited: withdraw it from the draft's page, or wait for a decision."
    # The three steps, in the order an author meets them. They are the only place
    # the workflow is explained rather than referred to: every other sentence about
    # it — the flash that says a change was remembered, a row's badge, the two
    # controls on a draft — is a consequence of one of these three, and an author
    # who arrives from that flash has to be told what the consequences are. Rendered
    # on both drafts pages, so the keys are stated once here rather than twice in the
    # views.
    guide:
      heading: "How your changes work here"
      lead: "This universe remembers your changes instead of writing them straight away. Nothing you change is live until the third step."
      steps:
        remember: "Edit anything in this universe. Each change is remembered on your draft rather than written."
        review: "Your lists show what is waiting: a row for a record you added, and a badge on a record you edited or deleted."
        apply: "Apply the draft to write every remembered change at once, or discard it and write nothing."
        # The same third step in a `github` universe, where the author is not the
        # person who makes a change live. It says what a rejection means for the
        # author's work — it comes back to be edited — because that is the part of
        # handing something over that is not obvious from the word "review".
        submit: "Hand the draft to a reviewer, who approves it or sends it back with a reason. Nothing is written until they approve it."
      # The rule the three steps do not say, said once beside them: a draft is one
      # line of work. Everything remembered goes onto it, in the order it was
      # remembered, so trying a different direction means closing the first — and
      # the third step is the only thing that closes it.
      one_draft: "One draft at a time in this universe: everything you remember goes onto it, in the order you remembered it. To try a different direction first, apply or discard what is waiting."
    # What one change's apply did to it, as the badge its row carries and the
    # sentence that says why it is not live. `DraftApplier::SKIP_REASONS` and
    # `DraftChangeOutcome::STATES` are the same words; `kept` is the one key that
    # is not a state, because a change the author answered `"theirs"` was decided
    # rather than refused and is badged as that.
    outcomes:
      badge:
        written: "Live"
        kept: "Kept theirs"
        moved: "Not applied"
        deleted: "Not applied"
        missing: "Not applied"
        gone: "Nothing to do"
        unplaceable: "Not applied"
        refused: "Refused"
      # One sentence per state that is not `written`, and each names the one thing
      # the author can still do: the remembered values are still on the row either
      # way, and a change that was not written is redone from the record's own page.
      reason:
        kept: "You chose theirs, so the record keeps what is there now and this change was dropped."
        moved: "The record changed after you remembered this change, so it was not written over."
        deleted: "Somebody deleted this record after you remembered this change, so there was nothing to write onto."
        missing: "The record this change names could not be found, so it was not written."
        gone: "The record had already been deleted, so this change had nothing left to do."
        unplaceable: "The story or universe this change names is not part of this universe, so it could not be placed here."
        refused: "The universe would not accept this change, so nothing was written for it."
    # What a closed draft's history says: when it stopped being actionable, and what
    # the run did. Read by `DraftsHelper#draft_history_sentence` for the draft's own
    # page, and by the universe history page that lists closed drafts, so the two
    # cannot compose it differently. The first two keys are `_html` because the
    # moment is a `<time>` element, and they are keyed by the stored `status` rather
    # than by a second set of booleans.
    history:
      applied_html: "Applied %{at}."
      discarded_html: "Discarded %{at}."
      # Three sentences that stay three sentences for the flash's reason: a change
      # dropped on purpose was not skipped, so folding the kept count into either of
      # the others would report the run as failed when the author simply decided.
      live:
        one: "1 remembered change is live."
        other: "%{count} remembered changes are live."
      not_applied:
        one: "1 remembered change could not be applied."
        other: "%{count} remembered changes could not be applied."
      kept:
        one: "1 remembered change was left exactly as it is, because you chose theirs."
        other: "%{count} remembered changes were left exactly as they are, because you chose theirs."
      # The absence of all three counts, which is a fact in its own right: a
      # discarded draft gets it, and so does an applied draft whose every change
      # could not be written.
      nothing_written: "Nothing was written."
    # The **Start editing** / **Stop editing** control on the universe page. The
    # pending count is one button rather than a badge because the number is only
    # interesting as a way into the changes it is counting — so it reads
    # `drafts.pending.count`, which is the one sentence for "how much is waiting on
    # this reader's draft" and is shared with the sidebar panel.
    editing:
      start: "Start editing"
      stop: "Stop editing"
    # What the reader's open draft would do to the lists around it. Three states,
    # because three different things are true — and a row is never changed to match
    # one: a pending edit shows the values that are stored today, and a pending
    # deletion shows the record as it is until the draft is applied.
    pending:
      count:
        zero: "No pending changes yet"
        one: "1 pending change"
        other: "%{count} pending changes"
      # What a badge's tooltip adds to the state it already names. **Both of these
      # are answers to more than one remembered change on the same record**: one
      # edit is already fully described by the state sentence, so a count of one
      # would repeat it and a lone field name would answer a question nobody asked.
      # A record with three remembered edits on three fields is the case they exist
      # for — one badge that used to say nothing beyond "Pending edit".
      #
      # `fields` names what the draft would write, **not the values**: the row under
      # the badge still shows the stored ones, and printing both beside each other
      # would leave a reader guessing which is the universe. A remembered delete
      # carries no payload at all, so a deletion says `changes` and never `fields`.
      fields: "Your draft would write %{fields}."
      fields_more:
        one: "and 1 more field"
        other: "and %{count} more fields"
      changes:
        one: "%{count} remembered change is waiting on this record."
        other: "%{count} remembered changes are waiting on this record."
      states:
        draft: "Draft"
        draft_title: "This record is only in your draft. Nothing about it has been checked yet: it becomes real when you apply the draft, and the universe decides then whether it can be written."
        draft_icon: "bi-journal-plus"
        edit: "Pending edit"
        edit_title: "Your draft holds an edit to this record. Applying the draft writes it."
        edit_icon: "bi-pencil"
        deletion: "Pending deletion"
        deletion_title: "Your draft holds a delete for this record. Applying the draft removes it."
        deletion_icon: "bi-trash"
      # The sidebar panel is a glance, not a second drafts page: each row resolves
      # the record its change names, and the panel is rendered on every page of the
      # universe, so the rest of a long draft is counted rather than printed.
      panel:
        empty: "Nothing is waiting on your draft in this universe."
        more:
          one: "and 1 more change"
          other: "and %{count} more changes"
    index:
      title: "Pending changes"
      description: "Changes you have made in this universe that are remembered rather than written, and the drafts they belong to. Applied and discarded drafts are history and are not listed here."
      back: "Back to the universe"
      changes:
        one: "%{count} remembered change"
        other: "%{count} remembered changes"
      remembered_at_html: "Remembered %{at}."
      review: "Review"
      apply: "Apply"
      submit: "Submit for review"
      discard: "Discard"
      # What this universe does with a draft, said once above the rows rather than
      # in each of them. Two sentences because they are two different promises: one
      # ends with the author's own button, the other ends with somebody else's.
      apply_note: "Applying a draft writes every remembered change at once."
      review_note: "Nothing here is written until an owner or admin approves the draft, and a rejected draft comes back to you to edit."
      submit_confirm:
        one: "Submit the %{count} remembered change for review? An owner or admin decides whether it is applied."
        other: "Submit the %{count} remembered changes for review? An owner or admin decides whether they are applied."
      # Both confirmations are irreversible decisions, so each says what happens
      # rather than asking whether to continue.
      apply_confirm:
        one: "Apply the %{count} remembered change? It becomes live immediately."
        other: "Apply the %{count} remembered changes? They become live immediately."
      discard_confirm:
        one: "Discard this draft? Its %{count} remembered change will not be written."
        other: "Discard this draft? Its %{count} remembered changes will not be written."
      empty_title: "Nothing is waiting to be applied"
      empty_description: "In a universe that remembers changes, what you edit is collected here until you apply it. Nothing has been waiting in this universe."
    show:
      title: "Changes to review"
      description: "Every change this draft remembers, in the order you made them. Nothing here has been written until you apply it."
      # The same page in a `github` universe. It cannot say "until you apply it",
      # because that is the one thing this mode does not let its author do.
      review_description: "Every change this draft remembers, in the order you made them. Nothing here has been written until a reviewer approves it."
      back: "All pending changes"
      apply: "Apply changes"
      discard: "Discard draft"
      apply_confirm: "Apply every remembered change? They become live immediately."
      discard_confirm: "Discard this draft? Its remembered changes will not be written and cannot be applied afterwards."
      remembered_at_html: "Remembered %{at}."
      # A remembered create names no record, so its row is titled by the type it
      # would create. A change whose record has since been deleted falls back to
      # the same title, because it is still a change *about* that type.
      new_record: "New %{kind}"
      # A delete carries no payload, so the row says what it would do rather than
      # listing nothing.
      removes_record: "This change removes the record."
      no_values: "No field values were remembered for this change."
      empty_title: "This draft remembers no changes"
      empty_description: "There is nothing here to apply. A draft is opened by the first change you remember, so this one is empty."
    # The handover form on a draft's own page, in a `github` universe. It is a form
    # rather than a button because the message is a field: most submissions need no
    # explanation and some need a great deal, and one control cannot carry both.
    submission:
      heading: "Submit this draft for review"
      lead: "Nothing on this page is written when you submit. An owner or an admin reads the changes and either approves them or sends the draft back with a reason, and a draft that comes back is still yours to edit."
      message: "Anything the reviewer should know? (optional)"
      message_hint: "The reviewer reads this above your changes. A name that looks like a mistake, a change you tried twice, a scene you deliberately left alone — say it here rather than hoping it is obvious."
      submit: "Submit for review"
    # Where the author's own submission stands, on the author's own page. The four
    # sentences are keyed by the stored `ReviewRequest` status, because that is where
    # the answer lives: a rejected draft goes back to saying "Draft", so the status
    # of the *submission* is a separate fact with a separate row.
    submission_status:
      heading: "Your submission"
      pending_html: "Waiting for a reviewer since %{at}."
      approved_html: "Approved by %{reviewer} %{at}. Your changes are live."
      rejected_html: "Rejected by %{reviewer} %{at}. Your draft is back with you, with its changes, and you can edit it and submit again."
      withdrawn_html: "You withdrew this submission %{at}, so nothing was written."
      message: "You wrote: %{message}"
      notes: "The reviewer said: %{notes}"
    # The page that answers the apply it stopped. A conflict page is a question,
    # so every row shows both halves of the choice — what the author remembered
    # and what is there now — because a button an author cannot evaluate is a
    # button they press at random. The answers are posted back to `apply`, which
    # is where they are read; nothing here is stored.
    conflicts:
      title: "Conflicts to resolve"
      description: "These changes cannot be applied as they are: the records they name have changed since you remembered them. Choose, for each one, whether your change or what is there now wins."
      back: "All pending changes"
      submit: "Apply with these choices"
      yours: "Your change"
      theirs_now: "Theirs — what is there now"
      theirs_gone: "Theirs — the record stays deleted"
      apply_theirs: "Apply theirs"
      apply_mine: "Apply mine"
      removes_record: "This change removes the record."
      keeps_record: "The record is left exactly as it is now."
      deleted_record: "Somebody deleted this record after you remembered your change."
      # The two states that are a conflict, as the badge naming why the row is
      # here. `DraftConflictDetector::CONFLICT_REASONS` is the same two words.
      states:
        moved: "Changed elsewhere"
        deleted: "Deleted elsewhere"
      # What each button does *for this row*. Three sentences because there are
      # three decisions: overwriting a record that moved, bringing back a record
      # somebody deleted, and deleting a record that moved underneath the author.
      # One sentence covering all three would be wrong on two of them.
      choose:
        moved: "Choosing theirs keeps what is there now and drops your change. Choosing mine writes your change over what is there now."
        deleted: "Choosing theirs leaves the record deleted and drops your change. Choosing mine brings the record back and writes your change onto it."
        removed: "Choosing theirs keeps the record and drops your delete. Choosing mine removes the record even though it has changed."
    errors:
      # A `record_type` is a half of a polymorphic reference, so a type the
      # content registry does not know is a reference that resolves to nothing.
      # It keeps its own sentence from `shared.errors.reference.must_exist`
      # because the column at fault is the type, not a record id.
      record_type_unknown: "must name a record this universe can hold"
      # The two shapes an action may carry. A create remembers a record that does
      # not exist yet, so naming one is meaningless; an update or a delete of
      # nothing has no record to apply to or to conflict-check.
      record_id_for_create: "cannot name a record that does not exist yet"
      record_id_required: "must name a record that already exists"
      # A version is what lets a remembered change be applied safely later. One
      # remembers nothing that does not exist yet, and an update or a delete
      # without one has nothing to compare the record against.
      base_version_for_create: "cannot remember a version of a record that does not exist yet"
      base_version_required: "must remember the record's version"
      # A draft that can no longer be acted on has to say when it stopped being
      # actionable, or its history would have to read the moment off `updated_at`.
      closed_at_required: "must record when the draft was closed"
    # A change the applier cannot read at all. This is not a conflict — there is
    # nothing to choose between — so the notice says what cannot be read and stops,
    # rather than offering the two answers a conflict page offers. `DraftIntegrity`'s
    # two reasons, one sentence each, and the offending value named where naming it
    # is the whole diagnosis: a record type says which class is gone, an attribute
    # says which key no column or collection writer answers.
    damaged:
      heading: "This draft cannot be applied as it stands"
      lead: "Nothing in it can be written while one of these changes names something this application cannot read, so no change was written and this draft is still open. Drop the changes named below, then apply the rest."
      reasons:
        unknown_record_type: "names a record type this application does not have: %{type}"
        unknown_attribute: "names a value that kind of record has no field for: %{attribute}"

  review_requests:
    # A `ReviewRequest` stores what the draft already says — its universe, its one
    # author — so a disagreement between the two is a refusal rather than a row
    # that quietly reviews the wrong thing. The rejected-notes and
    # decided-reviewer sentences are the same argument `drafts.errors` makes
    # about `closed_at`: a fact nobody can recover afterwards is stored now or not
    # at all.
    errors:
      submitted_by_must_be_author: "must be the draft's author"
      notes_required: "must say why the submission was rejected"
      reviewer_required: "must record who reviewed it"
    # The stored `ReviewRequest::STATUSES`, read as words rather than as a column
    # value, for the badge the queue's rows carry. They are three states and not two
    # plus a flag because "waiting for a decision" and "answered" are the two things
    # every surface asks, and neither is derived from the other.
    statuses:
      pending: "Waiting"
      approved: "Approved"
      rejected: "Rejected"
      withdrawn: "Withdrawn"
    index:
      title: "Review requests"
      description: "Drafts that authors have handed over in this universe, with the ones still waiting for a decision first."
      back: "Back to the universe"
      # The row's subject is what the author asked for, so the count is the first
      # thing a reviewer reads: "3 remembered changes" is the size of the decision.
      changes:
        one: "%{count} remembered change from %{author}"
        other: "%{count} remembered changes from %{author}"
      submitted_at_html: "Submitted %{at}."
      # What a reviewer who decided has to see to answer "who let this through",
      # which is why `ReviewRequest` validates a reviewer onto every decided row.
      decided_by: "by %{reviewer}"
      notes: "Notes: %{notes}"
      # A withdrawal has no reviewer, so it cannot use `decided_by`. It reads as
      # the author's own act because that is what it is.
      withdrawn: "Withdrawn — the author discarded this draft, so nothing was written."
      open: "Review"
      empty_title: "Nothing is waiting for a decision"
      empty_description: "When an author hands a draft over in this universe instead of applying it, it appears here."
    show:
      title: "Changes to review"
      description: "Every change this submitted draft remembers, in the order the author made them. Nothing here has been written until you approve it."
      back: "All review requests"
      submitted_by_html: "Submitted by %{author} %{at}."
      # The author's own sentence, above the changes. It is the context for reading
      # the diffs, so it is labelled as a quotation rather than as prose: a reviewer
      # has to be able to see where the author's words end and the application's
      # begin, because everything below this block is the application's reading.
      submission_message_label: "The author wrote:"
      withdrawn_html: "The author withdrew this submission %{at} by discarding its draft. Nothing was written, and there is nothing to decide."
      apply: "Approve changes"
      apply_confirm: "Approve every remembered change? They become live immediately."
      # An approval's note is for the author and is optional, unlike a rejection's.
      # It is said on the control rather than implied by a label, because the reason a
      # reviewer writes one is the thing they want the author to know — "applied mine"
      # over a record somebody else had edited, for instance.
      apply_notes: "Note for the author (optional)"
      apply_notes_hint: "The author reads this beside their submission. Only a rejection has to say why."
      # The rejection is a form rather than a confirmation, because it is the one
      # decision that has something to say: notes are required, so the question is
      # asked beside the field instead of in a dialog that would discard them.
      reject: "Reject submission"
      reject_notes: "Why are you rejecting it?"
      reject_notes_hint: "The author sees these notes and keeps their draft, so they can change it and submit again."
      reject_submit: "Reject and hand the draft back"
      empty_title: "This draft remembers no changes"
      empty_description: "There is nothing here to approve."
    conflicts:
      title: "Conflicts to resolve"
      description: "These changes cannot be approved as they are: the records they name have changed since the author remembered them. Choose, for each one, whether the author's change or what is there now wins."
      back: "Back to the review request"
      submit: "Approve with these choices"
    flash:
      rejected: "The submission was rejected and the draft was handed back to its author. Nothing was written."
      decided: "That review request has already been answered, so there is nothing left to decide about it."

  # What happened to this universe's content: every closed draft, grouped by the day it
  # closed. Owned by `HistoriesController`, which asks for `admin` because the list
  # names every author who has ever closed a draft here.
  #
  # **A discarded draft is listed too, and its changes say they were never written.**
  # Omitting it would answer "who changed this universe" with a list that silently
  # drops the work somebody threw away, which is the half an admin is likelier to need.
  histories:
    index:
      title: "Change history"
      description: "Every draft that has been applied or discarded in this universe, newest first, grouped by the day it closed. A discarded draft is here too, and its changes were never written."
      back: "Back to the universe"
      empty_title: "Nothing has changed yet"
      empty_description: "In a universe that remembers changes, each applied or discarded draft appears here once it has closed."
    # The draft's own block heading inside a day. It is a count of remembered changes
    # because that is the size of what happened, and it links to the draft's page for
    # the values behind each row.
    draft_changes:
      one: "%{count} remembered change"
      other: "%{count} remembered changes"

  # Who has changed this universe, and what one of them changed. Owned by
  # `CollaboratorsController`, which asks for `admin` because the list names every
  # author who has ever closed a draft here — the change history's question, at a
  # narrower scope.
  collaborators:
    index:
      title: "Collaborators"
      description: "Everybody who has applied or discarded a draft in this universe, with the number of changes they remembered. Their changes count whether they were written or thrown away."
      back: "Back to the universe"
      # The row's figure is remembered changes rather than runs, because that is what
      # the reader is about to read on the other side of the link. A discarded draft's
      # changes are counted: remembering a change here is collaborating here.
      changes:
        one: "%{count} remembered change"
        other: "%{count} remembered changes"
      # The row's one navigation, on the right as every list row carries it. The
      # accessible name names the person, because the visible word cannot.
      open: "History"
      open_aria: "History for %{name}"
      empty_title: "Nobody has changed anything yet"
      empty_description: "When an author applies or discards a draft in this universe, they appear here with the changes they remembered."
    show:
      title: "%{name}'s changes"
      description: "Every draft this person applied or discarded in this universe, newest first, grouped by the day it closed. A discarded draft is here too, and its changes were never written."
      back: "All collaborators"
      empty_title: "Nothing here any more"
      empty_description: "This person's runs in this universe are no longer listed."

  # What was said to this reader while they were somewhere else. The three sentences
  # are `Notification::KINDS`, one each, because they are what the bell and the list
  # print, and a kind with no sentence behind it would be a badge nothing can read.
  #
  # They are **not** `_html` keys, and the moment is not folded into them: the values
  # interpolated into a sentence come out of a stored payload rather than out of a
  # validated model, and a `<time>` element beside the sentence is a moment a stylesheet
  # can date. A reviewer's note is a third element again, because it is somebody else's
  # free text and a sentence frame around it has to guess where the punctuation goes.
  notifications:
    bell: "Notifications"
    # The bell's own accessible name, read in place of the icon inside the button.
    bell_aria: "Notifications, what was said to you"
    unread: "New"
    unread_count:
      one: "1 unread"
      other: "%{count} unread"
    see_all: "See all notifications"
    read_all: "Mark all as read"
    # A dropdown with nothing in it still has to say something: it is opened by a
    # button that is rendered because the reader has notifications, and a menu with no
    # rows in it reads as broken rather than as empty.
    empty: "Nothing has been said to you yet."
    empty_title: "Nothing has been said to you yet"
    empty_description: "When somebody hands you a draft for review, answers one you handed over, or replies in a conversation you are part of, it appears here."
    sentences:
      review_submitted: "%{actor} submitted a draft for review in %{universe}."
      review_approved: "%{reviewer} approved your submission in %{universe}. Your changes are live."
      review_rejected: "%{reviewer} rejected your submission in %{universe}. Your draft is back with you, with its changes, and you can edit it and submit again."
      discussion_reply: "%{actor} replied in your conversation about %{record} in %{universe}."
    notes: "The reviewer said: %{notes}"
    # Stand-ins for a payload that does not carry the value. Every row this
    # application writes has these, so they only answer a row written by something
    # else — or one whose record has since been soft-deleted, which is the case
    # `record_name` can be nil for while the row it names is perfectly readable.
    someone: "Someone"
    a_universe: "a universe"
    a_record: "a record"
    index:
      title: "Notifications"
      description: "What has been said to you about your work, newest first."

  live_updates:
    # The notice a live update becomes when the page holds unsent work. It says
    # what happened and offers the reader the choice, because the update was held
