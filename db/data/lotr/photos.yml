# Photos are development-only assets kept beside the manifests in
# `db/photos/<universe>/` and referenced here by path, so this file stays
# readable. Every record that can carry one may name any of them; they are
# shared deliberately, which is also what proves a photo row is never destroyed
# while another record still points at it.
#
# The source images are deliberately not square, so a loaded universe exercises
# the real path: the source is cropped to a square and stored at 300x300, and the
# source file itself is never what is served.

- universe: Universe.lotr
  name: The Shire
  source_file: db/photos/lotr/landscape.jpg

- universe: Universe.lotr
  name: Rivendell
  source_file: db/photos/lotr/portrait.jpg
