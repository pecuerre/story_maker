- universe: Universe.lotr
  name: "The One Ring"
  slug: "one_ring"
  description: "The master Ring of the Lord of the Rings."
  item_tags: [ ItemTag.ring ]
  what_it_does: "Turns its bearer invisible and slowly into a servant of Sauron."
  how_it_is_used: "Slipped on a finger, most often to escape being seen."
  side_effects: "It lengthens the bearer's life while hollowing out their will."
  origin: "Forged by Sauron in the fires of Mount Doom."
  value: "The whole of Middle-earth is contested for it."
  cannot: "Be unmade anywhere but the fire that made it."
  constraints: "It answers to Sauron, and it wants to return to him."
  history: "Cut from Sauron's hand, lost in the Gladden, found by Bilbo, and carried to Mordor by Frodo."
  jargon: "The Ring."

