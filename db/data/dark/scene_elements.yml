# Scene Elements for the Dark universe. They are the ordered prose blocks of a
# Scene: a narration describes what happens, a dialogue names the characters who
# speak in it. Positions are flat and contiguous inside their own Scene, and a
# Dialogue's speakers are ordinary universe Characters rather than copies.
#
# The data deliberately includes every state the editor has to handle: a dialogue
# with one speaker and with three, a narration with no content, a Scene with no
# elements at all, and a speaker who is not a stored participant of the Scene.
#
# A Scene Element belongs to a Scene and reaches the Story and the Universe
# through it, so the second and third stories in this directory have their own
# elements while the speakers are still the same universe Characters.

# A Scene with three elements, including a Dialogue whose two speakers are not
# stored participants: they are derived from the dialogue alone.
- scene: Scene.secrets
  name: The arrival
  kind: narration
  body: "Jonas Kahnwald drives into Winden with a suitcase he will not explain, and a box he will not put down."
  position: 0

- scene: Scene.secrets
  name: "At the kitchen door"
  kind: dialogue
  body: "You found the map, didn't you. I found a map. In a drawer that was empty last Tuesday."
  characters: [ Character.katharina, Character.martha ]
  position: 1

# A title-only narration: Content is optional, so a half-written block is valid.
- scene: Scene.secrets
  name: The photograph
  kind: narration
  position: 2

# A one-speaker dialogue beside a narration, and a title-only closing beat.
- scene: Scene.michaels-waltz
  name: "The kitchen, after dark"
  kind: narration
  body: "Jonas pushes the dining table aside and dances with a chair, counting the beat under his breath."
  position: 0

- scene: Scene.michaels-waltz
  name: "One, two, three"
  kind: dialogue
  body: "You are not dancing with a chair. I am dancing with the count."
  characters: [ Character.jonas ]
  position: 1

- scene: Scene.michaels-waltz
  name: "The adults in the hallway"
  kind: narration
  position: 2

# Three speakers in one block. The link records who is in the conversation; it
# does not say which line belongs to whom.
- scene: Scene.lies
  name: "What happened in 1986"
  kind: dialogue
  body: "She was never here. You were never here. We were all somewhere else, and now we are here."
  characters: [ Character.martha, Character.hannah, Character.ulrich ]
  position: 0

- scene: Scene.past-and-present
  name: "The same argument, twice"
  kind: narration
  body: "The sentences are identical in 1986 and in 2019, and the people saying them are not."
  position: 0

# Two speakers, and one of them is also a stored participant of the Scene, so
# the Characters tab shows one row that is both.
- scene: Scene.truths
  name: "The second Noah"
  kind: dialogue
  body: "He is alive. We have been looking at an empty cave for thirty years."
  characters: [ Character.jonas, Character.martha ]
  position: 0

- scene: Scene.sic-mundus-creatus-est
  name: The cave opens
  kind: narration
  body: "The stone gives way to air, and the air gives way to a light that does not belong to 1953."
  position: 0

- scene: Scene.the-journey
  name: "Season two opens"
  kind: narration
  body: "The alternate Jonas is found in a field, walking north with a suitcase he will not put down."
  position: 0

- scene: Scene.the-golden-beast
  name: "A voice in the corridor"
  kind: dialogue
  body: "Do not be afraid of me. I am the child you will never have."
  characters: [ Character.jonas, Character.ulrich ]
  position: 0

# "The Grotto" and "Double Lives" are left with no elements on purpose: a Scene
# may hold any number of them, including none.
- scene: Scene.interlude
  name: No music
  kind: narration
  position: 0

# The second story's elements. The speakers are the same eight universe
# Characters the first story uses; only the Scene that holds them is different.
- scene: Scene.darker-hollow-tree
  name: The lid, already off
  kind: narration
  body: "The hollow tree has been opened recently, and the leaves packed back down by someone who meant to hide it."
  position: 0

- scene: Scene.darker-hollow-tree
  name: "An hour earlier"
  kind: dialogue
  body: "You will want to know what is in there. You will not want to have been the one to look."
  characters: [ Character.bartosz, Character.jonas ]
  position: 1

- scene: Scene.darker-bartoszs-version
  name: The older man's account
  kind: narration
  body: "Bartosz draws the three steps wrong on purpose, and Jonas memorizes them wrong for thirty-three years."
  position: 0

# A title-only closing block, as the first story has one.
- scene: Scene.darker-bartoszs-version
  name: "What he does not say"
  kind: narration
  position: 1

- scene: Scene.darker-second-grave
  name: Under the headstone
  kind: dialogue
  body: "There is no Noah. There is a photograph of Noah, and a date, and nothing underneath either."
  characters: [ Character.martha, Character.hannah ]
  position: 0

- scene: Scene.darker-what-the-wind-remembers
  name: The plant, after hours
  kind: narration
  body: "Claudia has kept the 1986 log in a drawer at the plant, and she has never once read it."
  position: 0

- scene: Scene.darker-cold-open
  name: No one speaks
  kind: narration
  body: "The cave is lit before anyone arrives, and the light goes out on its own."
  position: 0

# The third story's elements. This story's first scene is a player's arrival, so
# its dialogue is with a character who has no stored role in the scene at all.
- scene: Scene.bethesda-arrival
  name: The platform
  kind: narration
  body: "The station clock is wrong by a year and nobody in Winden thinks that is worth mentioning."
  position: 0

- scene: Scene.bethesda-arrival
  name: "The stranger on the platform"
  kind: dialogue
  body: "You are not from here. Nobody comes to Winden on purpose twice."
  characters: [ Character.bartosz, Character.claudia ]
  position: 1

- scene: Scene.bethesda-power-plant
  name: The guided tour
  kind: narration
  body: "Claudia walks the player through four floors and stops on the fifth, where the logs are kept."
  position: 0

- scene: Scene.bethesda-power-plant
  name: "Why you are still here"
  kind: dialogue
  body: "Everyone who leaves this town comes back. The town does not consider that a problem."
  characters: [ Character.claudia ]
  position: 1

# Two speakers, one of whom is also a stored participant below.
- scene: Scene.bethesda-wardens-bridge
  name: "Terms of the fight"
  kind: dialogue
  body: "Cross the bridge or come back with the device. I will not do this part twice."
  characters: [ Character.ulrich, Character.egon ]
  position: 0

- scene: Scene.bethesda-cave-mouth
  name: The device turns
  kind: narration
  body: "The Tannhaus device opens the Sic Mundus mouth from the outside, which no scene in the first story shows."
  position: 0

# "Winden's Fair" and "The Grotto" hold no elements, so the same empty state is
# reachable in more than one story.
- scene: Scene.bethesda-windens-fair
  name: "The prize wheel"
  kind: narration
  position: 0