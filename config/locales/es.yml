# Spanish translations. Every key under `es:` has a matching key under `en:`; a
# test asserts the two key sets are identical, so a key added to one file and
# forgotten in the other fails the suite rather than silently rendering English
# to a Spanish reader. See ADR 0016.
#
# A translation may reorder an interpolation — the copy is written per language
# rather than assembled from English fragments — but it must keep every
# placeholder the English key uses, which is what lets Spanish put "Desde" in
# front of a date instead of after it.
