- universe: Universe.lotr
  name: Frodo Baggins
  slug: frodo_baggins
  pronouns: "he/him"
  aliases: "Ring-bearer"
  summary: "Hobbit Ring-bearer of the Fellowship."
  description: |
    ## Wants

    To return to the Shire and be left in peace.

    ## Needs

    To accept help and carry the Ring to its destruction.

    ## Lies about (to himself)

    The Ring's burden is his to bear alone.

    ## Contradictions

    He longs for home while choosing a path away from it.

    ## Under pressure

    Endures pain quietly and keeps moving.

    ## Never

    Use the Ring to dominate another.

    ## Knowledge

    At Bag End, before the Fellowship leaves, he learns from
    [[character:gandalf-the-grey]] that the Ring is the One Ring and must be
    destroyed in Mordor. It changes his plan.
  character_tags: [ CharacterTag.hobbit, CharacterTag.fellowship_of_the_ring ]
  factions: [ Faction.fellowship_of_the_ring ]
  photo: Photo.the_shire

