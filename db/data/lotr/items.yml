- universe: Universe.lotr
  name: "The One Ring"
  slug: "one_ring"
  summary: "The master Ring, forged in Mount Doom and carried to Mordor by [[character:frodo-baggins]]."
  description: |
    The master Ring of the Lord of the Rings.

    ## What it does

    Turns its bearer invisible and slowly into a servant of Sauron.

    ## How it is used

    Slipped on a finger, most often to escape being seen.

    ## Side effects

    It lengthens the bearer's life while hollowing out their will.

    ## Origin

    Forged by Sauron in the fires of Mount Doom.

    ## Value

    The whole of Middle-earth is contested for it.

    ## Cannot

    Be unmade anywhere but the fire that made it. [[canon:K1]] holds here.

    ## Constraints

    It answers to Sauron, and it wants to return to him.

    ## History

    Cut from Sauron's hand, lost in the Gladden, found by Bilbo, and carried to Mordor by [[character:frodo-baggins]].

    ## Jargon

    The Ring.

- universe: Universe.lotr
  name: "Sting"
  slug: "sting"
  summary: "Frodo's Elvish blade, which glows blue when orcs are near."
  description: |
    Frodo's Elvish blade.

    ## What it does

    Glows blue when orcs are near.

    ## How it is used

    Worn at the belt and drawn only when needed.

    ## Origin

    Forged in Gondolin in the First Age.

    ## History

    Taken from a troll's hoard by Bilbo, who gave it to Frodo.

    ## Jargon

    The blade.

- universe: Universe.lotr
  name: "Andúril"
  slug: "anduril"
  summary: "The reforged Flame of the West, and Aragorn's claim to be king."
  description: |
    Flame of the West, reforged for Aragorn.

    ## What it does

    Marks Aragorn as the heir of Isildur.

    ## Origin

    Reforged from the shards of Narsil in Rivendell.

    ## Value

    A royal heirloom rather than a traded good.

    ## History

    Narsil broke beneath Isildur; the shards were kept in Rivendell for an age.

    ## Jargon

    The Flame of the West.

