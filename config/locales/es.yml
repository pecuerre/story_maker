        dialogue: "Diálogo"
        narration_description: "Descripción o acción, sin que nadie hable."
        dialogue_description: "Un bloque hablado. Nombra a todos los que hablan en él."
      form:
        kind: "Tipo de elemento"
        name: "Título"
        name_hint: "El título del bloque. Solo hace falta un título; el contenido puede llegar después."
        body: "Contenido"
        body_hint: "Texto sin formato, guardado exactamente como está escrito. Aquí nada se interpreta como cronología ni se contrasta con el universo."
        speakers: "Hablantes"
        speakers_hint: "Todos los que hablan en este bloque. Varios personajes pueden compartir un mismo diálogo; el enlace registra quién está en la conversación, no qué línea es de quién."
